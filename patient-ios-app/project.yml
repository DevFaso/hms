name: MediHubPatient
options:
  bundleIdPrefix: com.bitnesttechs.hms.patient
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true
  groupSortPosition: top

# Phase 2.8.B: per-env release configurations for the Keycloak cutover.
# Default Debug/Release stay unchanged (in-Xcode dev). Release-Dev/Prod
# layer xcconfig files (Config/{Dev,Prod}.xcconfig) on top of the
# Release defaults to populate MEDIHUB_KEYCLOAK_* per environment.
# XcodeGen reads this mapping from `configs`. It was spelled
# `configurations`, which XcodeGen ignores entirely — the project fell
# back to the default Debug/Release pair, so the `configFiles` entries
# below referenced configurations that did not exist and
# `xcodegen generate` failed outright. Never caught because the repo had
# no iOS CI and the original setup used a hand-made .xcodeproj.
configs:
  Debug: debug
  Release: release
  Release-Dev: release
  Release-Prod: release

packages:
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS.git
    from: "1.7.5"

settings:
  base:
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "D6K83N72S4"
    CODE_SIGN_IDENTITY: "Apple Distribution"
    CODE_SIGN_STYLE: Automatic
    # MEDIHUB_KEYCLOAK_* defaults — empty issuer keeps SSO disabled in
    # Debug/Release builds. Per-env xcconfigs override these for
    # Release-{Dev,Prod}. See Config/README.md.
    MEDIHUB_API_BASE_URL: ""
    MEDIHUB_KEYCLOAK_ISSUER: ""
    MEDIHUB_KEYCLOAK_SSO_ENABLED: "0"
    MEDIHUB_KEYCLOAK_CLIENT_ID: "hms-patient-ios"
    MEDIHUB_KEYCLOAK_REDIRECT_URI: "com.bitnesttechs.hms.patient.native:/oauth2redirect"

targets:
  MediHubPatient:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MediHubPatient
        excludes:
          - "**/.DS_Store"
    # Layered on the TARGET, not the project. Xcode resolves target settings
    # over target xcconfig over project settings over project xcconfig, so a
    # project-level xcconfig loses to the `settings.base` defaults below and
    # every per-env value silently resolved to the empty default — which is
    # how Release-Prod would have shipped pointing at the dev server.
    configFiles:
      Release-Dev: Config/Dev.xcconfig
      Release-Prod: Config/Prod.xcconfig
    dependencies:
      - package: AppAuth
        product: AppAuth
    settings:
      base:
        INFOPLIST_FILE: MediHubPatient/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bitnesttechs.hms.patient.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: "YES"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
    info:
      path: MediHubPatient/Resources/Info.plist
      properties:
        # Every key here is declared in THIS block and not by hand in
        # Info.plist, because `xcodegen generate` rewrites that file from
        # here on every CI run and would silently drop a hand-added one.
        # ITSAppUsesNonExemptEncryption below was found the expensive way —
        # build 202609201928 uploaded, processed, and landed in Missing
        # Compliance — so the build job now asserts every key in this block
        # is present in the generated plist, on every PR.

        # User-facing name under the icon.
        CFBundleDisplayName: e-Keneya

        # Required before LocalAuthentication may evaluate
        # .deviceOwnerAuthenticationWithBiometrics: iOS TERMINATES an app
        # that reaches Face ID without a purpose string, and App Review
        # rejects for its absence.
        NSFaceIDUsageDescription: Utiliser Face ID pour vous connecter à e-Keneya sans saisir votre mot de passe.

        # Without this, every upload lands in TestFlight as "Missing
        # Compliance" and reaches nobody until a human answers the export
        # question by hand — verified on build 202609201928, whose
        # usesNonExemptEncryption came back null from the App Store Connect
        # API.
        #
        # false is the accurate answer, not a convenience, and the basis is
        # narrower than "no crypto in the binary": AppAuth is linked and its
        # PKCE support calls CommonCrypto's CC_SHA256 and SecRandomCopyBytes,
        # so the shipped binary DOES contain crypto symbols. What the
        # exemption turns on is that none of it is the app's own
        # cryptography: HTTPS through URLSession, the Keychain,
        # LocalAuthentication, and a SHA-256 digest used for authentication
        # are all platform or standards-track primitives. The app implements
        # no algorithm and bundles no crypto library of its own.
        #
        # The build job fails the PR if any first-party source imports
        # CryptoKit or CommonCrypto while this stays false, so the claim is
        # checked rather than remembered.
        ITSAppUsesNonExemptEncryption: false

        # Derived from the build settings, not literals. XcodeGen writes
        # this plist from here, and a literal CFBundleVersion outranks
        # CURRENT_PROJECT_VERSION — so the CI build number was inert and
        # every TestFlight upload after the first would be rejected as a
        # duplicate build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # KC-3: AppAuth callback scheme. Must match the redirect URI on
        # the Keycloak `hms-patient-ios` client and `MEDIHUB_KEYCLOAK_REDIRECT_URI`.
        # Declared here (not just in Info.plist) so `xcodegen generate`
        # does not strip it on regeneration.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.bitnesttechs.hms.patient.native.oauth
            CFBundleURLSchemes:
              - com.bitnesttechs.hms.patient.native
        # Phase 2.8.B: per-env Keycloak settings, baked into Info.plist
        # so `xcodebuild archive` builds carry them. `KeycloakConfig` /
        # `FeatureFlags` read these via Bundle.main.infoDictionary as a
        # fallback when ProcessInfo doesn't have a value (i.e. archive
        # builds, where scheme env vars don't apply). Default values
        # come from `settings.base`; per-env xcconfigs override.
        MEDIHUB_API_BASE_URL: $(MEDIHUB_API_BASE_URL)
        MEDIHUB_KEYCLOAK_ISSUER: $(MEDIHUB_KEYCLOAK_ISSUER)
        MEDIHUB_KEYCLOAK_SSO_ENABLED: $(MEDIHUB_KEYCLOAK_SSO_ENABLED)
        MEDIHUB_KEYCLOAK_CLIENT_ID: $(MEDIHUB_KEYCLOAK_CLIENT_ID)
        MEDIHUB_KEYCLOAK_REDIRECT_URI: $(MEDIHUB_KEYCLOAK_REDIRECT_URI)
    scheme:
      testTargets:
        - MediHubPatientTests
      gatherCoverageData: true
      environmentVariables:
        # KC-3: keep scheme defaults hermetic for Run and test actions.
        # Release-Dev/Prod archive values come from Config/*.xcconfig;
        # local live SSO can be enabled by overriding these in an Xcode scheme.
        MEDIHUB_KEYCLOAK_ISSUER: ""
        MEDIHUB_KEYCLOAK_CLIENT_ID: ""
        MEDIHUB_KEYCLOAK_REDIRECT_URI: ""
        MEDIHUB_KEYCLOAK_SSO_ENABLED: "0"

  MediHubPatientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MediHubPatientTests
    dependencies:
      - target: MediHubPatient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitnesttechs.hms.patient.native.tests
        GENERATE_INFOPLIST_FILE: true
