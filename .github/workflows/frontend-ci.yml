name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: hospital-portal

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital-portal/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # v1.0 row 12 — FR completeness gate. FR is held to the spec's
      # 99% floor (was 100% as of the row-12 backfill). ES carries an
      # 89% floor reflecting its current state — backfill to 99% is a
      # tracked follow-up; the gate exists to prevent regression below
      # today's level. Per-locale overrides documented in
      # hospital-portal/scripts/check-i18n-coverage.mjs.
      - name: i18n completeness check
        run: npm run i18n:check
        env:
          I18N_LOCALE_THRESHOLDS: fr:99,es:89

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:headless

  # v1.0 row 10 — axe-core/playwright a11y smoke. Runs in its own job so
  # the Chromium download (≈170 MB) and Angular dev-server startup (≈90 s)
  # don't slow down the lint/build/test path that every PR needs. Fails
  # on `serious` or `critical` violations only — see
  # hospital-portal/e2e/a11y-smoke.spec.ts for the full ruleset and
  # impact-filtering rationale.
  a11y-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital-portal/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run axe-core smoke
        run: npm run e2e:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: hospital-portal/playwright-report/
          retention-days: 7
