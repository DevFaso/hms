name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: hospital-portal

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: hospital-portal/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # v1.0 row 12 + task 22 — i18n key-parity gate. FR and ES were
      # backfilled to 100% of EN (task 22), so the gate now enforces
      # strict parity: any missing key or orphan key in any locale
      # fails the build. Percentage thresholds remain available in the
      # script for local triage during a future backfill — see
      # hospital-portal/scripts/check-i18n-coverage.mjs.
      - name: i18n key-parity check
        run: npm run i18n:parity

      # The parity gate above compares the locales against EACH OTHER, so it is
      # blind to a key missing from ALL of them — that shipped two entire pages
      # (drug-interactions, slot-admin) rendering raw keys while parity stayed
      # green. This one scans the templates and fails on any key handed to
      # ngx-translate that en.json does not define.
      - name: i18n referenced-key check
        run: npm run i18n:referenced

      # Both gates above only ask whether a key EXISTS. A key copied from EN
      # and never translated is present and non-empty, so both stayed green
      # while 1041 French values were still the English string — on a
      # French-first product, that is the whole defect. This one fails when a
      # FR value is byte-identical to EN and is not pinned in
      # scripts/i18n-untranslated-allowlist.json with the exact shared text.
      - name: i18n translation check
        run: npm run i18n:translated

      # And all three of those only see keys that EXIST. The EnumLabelPipe
      # Title-Cases any enum value with no PORTAL.ENUM key, so a value the
      # API can send but nobody keyed renders English and no gate above
      # notices. This one reads the backend enum behind every domain a
      # template pipes and fails when one of its constants has no key.
      - name: i18n enum-coverage check
        run: npm run i18n:enums

      # That gate reads Java, so its parser is the thing most likely to lie
      # quietly: the first version ended the constant list at a semicolon
      # inside a Javadoc sentence and hid seven real prescription statuses.
      - name: Gate script tests
        run: npm run test:scripts

      - name: Build
        run: npm run build

      # Task 21 — coverage ratchet. Tests run with coverage, then the
      # per-module floors in hospital-portal/coverage-thresholds.json are
      # enforced. Floors are pinned at (just below) achieved coverage so a
      # module can only stay level or improve; raise a floor in the same PR
      # that raises its coverage, never lower one to make a build pass.
      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Coverage ratchet check
        run: npm run coverage:check

  # v1.0 row 10 — axe-core/playwright a11y smoke. Runs in its own job so
  # the Chromium download (≈170 MB) and Angular dev-server startup (≈90 s)
  # don't slow down the lint/build/test path that every PR needs. Fails
  # on `serious` or `critical` violations only — see
  # hospital-portal/e2e/a11y.spec.ts for the full ruleset and
  # impact-filtering rationale.
  a11y-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: hospital-portal/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Use the locally-installed playwright binary directly instead of
      # `npx playwright …`. SonarCloud flagged the npx form on PR #286 as
      # a security hotspot ("Define exact package version to avoid
      # installing unverified releases"); this resolves it because the
      # binary is the one resolved by the previous `npm ci` step from
      # the pinned @playwright/test version in package.json. We pass
      # `--with-deps chromium` so apt installs the Chromium browser
      # libs — the `--with-deps` step legitimately needs to run a shell
      # script with sudo, which is why the previous step DID use
      # `--ignore-scripts` for `npm ci` (only the playwright browser
      # install is allowed to run scripts here).
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run axe-core smoke
        run: npm run e2e:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-a11y-report
          path: hospital-portal/playwright-report/
          retention-days: 7
