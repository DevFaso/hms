name: Project Quality Gates

on:
  pull_request:
    branches: [main, develop, uat]
  push:
    branches: [main, develop, uat]

# SonarCloud row 11 / Sonar S6396 + CodeQL actions/missing-workflow-permissions:
# permissions are declared per-job (never at workflow level) so each job's
# GITHUB_TOKEN is capped at least-privilege. For the reusable-workflow jobs
# the caller cap is the ceiling — the callees (`backend-ci`, `frontend-ci`,
# `agent-lint`) each declare `contents: read` themselves, so `contents: read`
# here grants exactly what they need and nothing more.

concurrency:
  group: project-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (JUnit, Jacoco)
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit
    permissions:
      contents: read

  frontend-tests:
    name: Frontend (Jest, Playwright)
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit
    permissions:
      contents: read

  agent-lint:
    name: Agent Lint & Prompt Tests
    uses: ./.github/workflows/agent-lint.yml
    secrets: inherit
    permissions:
      contents: read

  lint-docker-yaml:
    name: Lint Dockerfiles & YAML
    runs-on: ubuntu-latest
    # Per-job least-privilege: only contents:read needed to fetch sources.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          recursive: true

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: '.'
          config_file: '.yamllint.yml'

  require-all-pass:
    name: Require All Jobs Pass
    runs-on: ubuntu-latest
    # require-all-pass only reads the result of `needs:` and does not
    # need repository or write access, so explicitly disable all
    # GITHUB_TOKEN permissions for least privilege.
    permissions: {}
    needs:
      - backend-tests
      - frontend-tests
      - agent-lint
      - lint-docker-yaml
    steps:
      - name: All jobs passed
        run: echo "All required jobs passed. Ready to merge!"
