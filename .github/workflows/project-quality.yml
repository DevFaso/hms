name: Project Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# SonarCloud row 11 / Sonar S6396: permissions declared at the workflow
# level inherit to every job (and to every callable workflow this file
# triggers). Per principle-of-least-privilege we declare permissions on
# the job that actually needs them — reusable callable workflows
# (`backend-tests`, `frontend-tests`, `agent-lint`) carry their own.
# Removed: `permissions: contents: read` at workflow level.

concurrency:
  group: project-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A caller job's `permissions` is the CEILING for the token handed to the
  # reusable workflow — the callee's own block cannot raise it, and omitting
  # one here leaves the job on the repository default rather than
  # least-privilege. Each callee needs only contents:read, so that is the
  # ceiling. (CodeQL actions/missing-workflow-permissions.)
  backend-tests:
    name: Backend (JUnit, Jacoco)
    uses: ./.github/workflows/backend-ci.yml
    permissions:
      contents: read
    secrets: inherit

  # SonarCloud analysis, fed by the backend job's own coverage. This replaced
  # the standalone SonarQube workflow (build.yml), which ran
  # `:hospital-core:build :hospital-core:jacocoTestReport` a second time on
  # every PR and push — the whole backend suite twice per change. The
  # analysis needs bytecode (sonar.gradle.skipCompile=true in build.gradle),
  # so it compiles, but it never runs a test: coverage and test results come
  # from the artifact backend-ci.yml uploads after the suite AND the coverage
  # gate passed. Same two analyses as before: a branch analysis on push to
  # main/develop and a PR analysis (with GitHub decoration) on pull requests.
  # Without SONAR_TOKEN (fork PRs) the analysis steps skip, as before.
  sonar-analysis:
    name: SonarQube analysis
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Sonar blame / new-code detection needs full history

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download the backend job's coverage and test results
        uses: actions/download-artifact@v8
        with:
          name: sonar-inputs
          path: hospital-core/build

      - name: Check the coverage report arrived
        run: test -s hospital-core/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile main and test sources (no tests run)
        run: ./gradlew :hospital-core:classes :hospital-core:testClasses

      - name: SonarQube analysis (branch push)
        if: github.event_name == 'push' && env.SONAR_TOKEN != ''
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          ./gradlew sonar -x test -x jacocoTestReport \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.branch.name="${BRANCH_NAME}"

      - name: SonarQube analysis (pull request)
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN != ''
        env:
          PR_KEY: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./gradlew sonar -x test -x jacocoTestReport \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.pullrequest.key="${PR_KEY}" \
            -Dsonar.pullrequest.branch="${PR_BRANCH}" \
            -Dsonar.pullrequest.base="${PR_BASE}" \
            -Dsonar.pullrequest.github.repository="${GH_REPO}" \
            -Dsonar.pullrequest.provider=github

  frontend-tests:
    name: Frontend (Jest, Playwright)
    uses: ./.github/workflows/frontend-ci.yml
    permissions:
      contents: read
    secrets: inherit

  agent-lint:
    name: Agent Lint & Prompt Tests
    uses: ./.github/workflows/agent-lint.yml
    permissions:
      contents: read
    secrets: inherit

  lint-docker-yaml:
    name: Lint Dockerfiles & YAML
    runs-on: ubuntu-latest
    # Per-job least-privilege: only contents:read needed to fetch sources.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: '.'
          config_file: '.yamllint.yml'

  require-all-pass:
    name: Require All Jobs Pass
    runs-on: ubuntu-latest
    # require-all-pass only reads the result of `needs:` and does not
    # need repository or write access, so explicitly disable all
    # GITHUB_TOKEN permissions for least privilege.
    permissions: {}
    needs:
      - backend-tests
      - frontend-tests
      - agent-lint
      - lint-docker-yaml
    steps:
      - name: All jobs passed
        run: echo "All required jobs passed. Ready to merge!"
