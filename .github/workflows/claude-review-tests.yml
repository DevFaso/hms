# Unit tests for the Claude review script. A separate workflow so they run on
# every PR touching the script, drafts included (the review job skips drafts).
name: Claude review script tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/claude-review*.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the pinned SDK and pytest
        # requirements-dev.in -> uv pip compile --generate-hashes; wheels only.
        run: >-
          pip install --quiet --require-hashes --only-binary ':all:'
          -r .github/scripts/requirements-dev.txt
      - name: Run the tests
        run: python -m pytest -q .github/scripts
