name: Mobile — Android (patient)

# The patient Android app is a self-contained Gradle build under
# patient-android-app/, independent of the root hospital-core build, so it
# gets its own workflow rather than a job in the backend pipeline.
on:
  push:
    branches: [main, develop]
    paths:
      - 'patient-android-app/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'patient-android-app/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:
    inputs:
      release_action:
        # One choice rather than two booleans. It makes the invalid
        # combination — submit for review without uploading anything —
        # unrepresentable instead of rejected at run time, and a choice is a
        # string, so every gate below is an exact comparison rather than
        # GitHub's truthiness, where a non-empty string such as "false"
        # casts to TRUE. That is not theoretical: a `type: boolean` input is
        # a real boolean from the Run-workflow dialog but a string over the
        # API, which is how this repo dispatches.
        #
        # stage_and_submit stays unused until the app has been published
        # once: before that Play refuses to auto-submit and the commit fails.
        description: 'What this dispatch does with the signed bundle'
        type: choice
        options:
          - build_only
          - stage_on_internal
          - stage_and_submit
        default: build_only
      api_environment:
        description: 'API the signed build points at'
        type: choice
        options: [dev, prod]
        # Defaults to dev on purpose. The release bundle is what reaches
        # internal testers, and a tester exercising the appointment-cancel
        # flow against production cancels a real patient's appointment.
        default: dev

permissions:
  contents: read

concurrency:
  # The event name is part of the group so a push to develop cannot land
  # in the same group as a dispatched release and cancel it mid-upload;
  # dispatches are never cancelled, since an interrupted Play upload
  # burns a version code with nothing to show for it.
  group: mobile-android-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    working-directory: patient-android-app

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      - name: Point the SDK at the runner's install
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: patient-android-app/app/build/reports/
          retention-days: 7

  release:
    name: Signed bundle
    # Only on an explicit dispatch: a release build consumes the upload key,
    # and every AAB uploaded to Play burns a version code.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile-release
    steps:
      - uses: actions/checkout@v7

      - name: Check the dispatch asks for something this workflow knows
        env:
          RELEASE_ACTION: ${{ inputs.release_action }}
        run: |
          # The Run-workflow dialog constrains a choice input; an API
          # dispatch does not. Every gate below is written in the positive,
          # so an unrecognised value would quietly do nothing and report
          # success — the silent non-delivery this workflow has been bitten
          # by once already. Fail it here instead: first in the job, before
          # JDK and Gradle setup, so a rejected dispatch costs seconds.
          case "$RELEASE_ACTION" in
            build_only|stage_on_internal|stage_and_submit) ;;
            *)
              echo "::error::unknown release_action '$RELEASE_ACTION' — expected build_only, stage_on_internal or stage_and_submit"
              exit 1
              ;;
          esac
          echo "This dispatch: release_action=$RELEASE_ACTION" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_ACTION: ${{ inputs.release_action }}
        run: |
          # Check every secret up front, and report them TOGETHER: a
          # first-time mobile-release setup otherwise costs a whole build job
          # per missing secret. Missing ones otherwise fail deep inside a
          # full R8 release build with "Keystore was tampered with, or
          # password was incorrect" — an error that points at the keystore
          # rather than at the unset secret.
          required="ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD"
          # The Play key is read only by the very last step, so an unset one
          # is otherwise discovered after the whole signed build has run.
          if [ "$RELEASE_ACTION" != "build_only" ]; then
            required="$required PLAY_SERVICE_ACCOUNT_JSON"
          fi
          missing=
          for v in $required; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::unset in the mobile-release environment:$missing"
            exit 1
          fi
          # Non-empty is not enough for the Play key. The sibling secret in
          # this same environment is base64, so pasting this one base64 — or
          # truncated — is an easy mistake, and it would otherwise surface as
          # an opaque Google auth failure twenty minutes later. jq reads
          # stdin and prints nothing, so the key is never echoed.
          if [ "$RELEASE_ACTION" != "build_only" ]; then
            if ! printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq -e 'has("client_email") and has("private_key")' >/dev/null 2>&1; then
              echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not service-account JSON (expected client_email and private_key) — paste the file contents, not base64"
              exit 1
            fi
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build the signed bundle
        env:
          # Read by signingValue() in app/build.gradle.kts. Deliberately NOT
          # written to local.properties: that file would persist the password
          # on the runner's disk and in any uploaded artifact.
          STORE_FILE: ${{ github.workspace }}/patient-android-app/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_ENVIRONMENT: ${{ inputs.api_environment }}
        run: |
          if [ "$API_ENVIRONMENT" = "prod" ]; then
            API_BASE_URL=https://api.e-keneya.com/api
          else
            API_BASE_URL=https://dev.e-keneya.com/api
          fi
          echo "building against $API_BASE_URL"
          # Play rejects a bundle whose version code it has already accepted,
          # so the code has to rise on every publish. github.run_number does
          # not rise reliably: it is unchanged by a re-run (only run_attempt
          # moves) and it restarts at 1 if the workflow file is renamed. Now
          # that the edit actually commits, a re-run of a successful publish
          # would rebuild a burnt code and be rejected after a 20-minute R8
          # build.
          # Seconds since 2026-01-01 UTC instead: always rising, and — unlike
          # the iOS sibling's yyyymmddHHMM — inside the 2100000000 ceiling
          # Play puts on an Android version code, with about 66 years of head
          # room. Seconds rather than minutes because the concurrency group is
          # keyed on the ref, so two dispatches on different refs run in
          # parallel and can reach this line in the same minute; the second
          # bundle would then be refused as an already-used code after its own
          # 20-minute build.
          #
          # This narrows the collision window rather than closing it: the
          # code is still read off the runner clock, not off Play's state.
          # Choosing it from the highest already-published code needs the
          # readback recorded under Standing platform debt in tasklist.md.
          VERSION_CODE=$(( $(date -u +%s) - 1767225600 ))
          echo "version code $VERSION_CODE"
          # Read back by the publish step, which names the Play release after
          # these so two internal builds can be told apart in the console.
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          ./gradlew :app:bundleRelease --no-daemon \
            -PversionCode="$VERSION_CODE" \
            -PapiBaseUrl="$API_BASE_URL"

      - name: Check the bundle is actually signed
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::no bundle produced"; exit 1; }
          # An unsigned bundle has no META-INF/*.RSA|EC entry. Catch it here
          # rather than at the Play upload, which rejects with a vaguer error.
          if ! unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "::error::$AAB is not signed"
            exit 1
          fi
          echo "signed bundle: $(du -h "$AAB" | cut -f1)"
          # The publish step hands this mapping to Play. In the pinned action
          # a missing one is NOT merely a warning: edits.ts readFileSyncs it
          # after edits.bundles.upload and before edits.commit, so a wrong
          # path burns a version code and leaves the track untouched — the
          # #693 failure exactly. Assert it here, beside the bundle.
          MAP=app/build/outputs/mapping/release/mapping.txt
          test -f "$MAP" || { echo "::error::no R8 mapping at $MAP"; exit 1; }
          echo "mapping: $(du -h "$MAP" | cut -f1)"

      - name: Upload the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: patient-android-aab
          path: patient-android-app/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Publish to Play internal testing
        if: inputs.release_action != 'build_only'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bitnesttechs.hms.patient
          releaseFiles: patient-android-app/app/build/outputs/bundle/release/app-release.aab
          # Play refuses to auto-submit an edit for an app it has never
          # published: the bundle uploads fine and the commit then dies with
          # "Changes cannot be sent for review automatically", leaving
          # nothing on the track. Committing without sending for review gets
          # the build there and leaves the submission to the console.
          #
          # This is NOT a permanent setting. Once the app has been published
          # once, a release that is committed and never sent for review sits
          # in the console unreleased while this job reports success — the
          # same silent non-delivery wearing a later disguise. Switch the
          # dispatch to stage_and_submit at that point.
          changesNotSentForReview: ${{ inputs.release_action != 'stage_and_submit' }}
          # Without this the action names the release after the bundle's
          # versionName, which is "1.0.12" on every CI build, so successive
          # internal releases are indistinguishable in the console. The
          # marketing version is deliberately NOT repeated here: it lives in
          # build.gradle.kts and a copy would go stale at the next bump,
          # leaving the console naming a version the bundle does not carry.
          # The commit is what a tester's bug report actually needs.
          releaseName: '${{ env.VERSION_CODE }} (${{ inputs.api_environment }}, ${{ env.SHORT_SHA }})'
          # The release build runs R8 with isMinifyEnabled, so without the
          # mapping every crash a tester produces reaches the console as
          # a.b.c.d(Unknown Source:0), unrecoverable after the fact.
          mappingFile: patient-android-app/app/build/outputs/mapping/release/mapping.txt
          # NOTE: this pinned version deprecates "track" in favour of
          # "tracks". Migrate when the pin moves, not before: the SHA is
          # fixed, so nothing can remove "track" under us.
          track: internal
          status: completed

      - name: Say what is still owed in the console
        if: inputs.release_action == 'stage_on_internal'
        run: |
          MSG="Version code $VERSION_CODE is on the internal track but NOT submitted. Open Play Console > Testing > Internal testing and send the changes for review — testers do not receive it until you do."
          echo "::notice::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing material from the runner
        if: always()
        # The iOS sibling deletes its App Store Connect key the same way.
        # Nothing uploads the workspace wholesale today, but the decoded
        # upload keystore should not outlive the steps that need it.
        #
        # serviceAccountJson.json is the Play key: the action writes it from
        # serviceAccountJsonPlainText and removes it in a finally, which a
        # cancel or a timeout-minutes kill skips. A JS action's cwd is the
        # workspace root, not this job's working-directory, so it has to be
        # named by absolute path here.
        run: |
          rm -f upload-keystore.jks local.properties
          rm -f "$GITHUB_WORKSPACE/serviceAccountJson.json"
