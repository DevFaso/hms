name: Mobile — Android (patient)

# The patient Android app is a self-contained Gradle build under
# patient-android-app/, independent of the root hospital-core build, so it
# gets its own workflow rather than a job in the backend pipeline.
#
# Release procedure, secrets and the manual Play Console step:
# docs/runbooks/mobile-release.md.
on:
  push:
    branches: [main, develop]
    paths:
      - 'patient-android-app/**'
      - 'scripts/mobile/**'
      - '.github/actions/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'patient-android-app/**'
      - 'scripts/mobile/**'
      - '.github/actions/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:
    inputs:
      release_action:
        # One choice rather than two booleans. It makes the invalid
        # combination — submit for review without uploading anything —
        # unrepresentable instead of rejected at run time, and a choice is a
        # string, so every gate below is an exact comparison rather than
        # GitHub's truthiness, where a non-empty string such as "false"
        # casts to TRUE. That is not theoretical: a `type: boolean` input is
        # a real boolean from the Run-workflow dialog but a string over the
        # API, which is how this repo dispatches.
        #
        # stage_and_submit is REFUSED until the repository variable
        # PLAY_APP_PUBLISHED is 'true' (scripts/mobile/android-release-plan.sh):
        # before the app's first publish Play will not auto-submit, and the
        # commit fails after the bundle has burnt its version code.
        description: 'What this dispatch does with the signed bundle'
        type: choice
        options:
          - build_only
          - stage_on_internal
          - stage_and_submit
        default: build_only
      api_environment:
        description: 'API the signed build points at'
        type: choice
        options: [dev, prod]
        # Defaults to dev on purpose. The release bundle is what reaches
        # internal testers, and a tester exercising the appointment-cancel
        # flow against production cancels a real patient's appointment.
        default: dev

permissions:
  contents: read

concurrency:
  # The event name is part of the group so a push to develop cannot land
  # in the same group as a dispatched release and cancel it mid-upload;
  # dispatches are never cancelled, since an interrupted Play upload
  # burns a version code with nothing to show for it.
  group: mobile-android-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    working-directory: patient-android-app

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Every dispatch input is validated here, in the BUILD job, before the
      # release job (which holds the signing and Play secrets) can start:
      # release declares `needs: build`, so a guard there would only run
      # after lint, unit tests, assembleDebug and the mobile-release
      # environment gate. Here a bad value costs a checkout.
      - name: Check release_action
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/validate-dispatch
        env:
          DISPATCH_VALUE: ${{ inputs.release_action }}
        with:
          input-name: release_action
          allowed: build_only stage_on_internal stage_and_submit

      - name: Check api_environment
        # Before this guard, anything that was not exactly "prod" built a
        # dev-pointing bundle while the Play release name carried the raw
        # value, so `-f api_environment=production` shipped a dev build the
        # console labelled production.
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/validate-dispatch
        env:
          DISPATCH_VALUE: ${{ inputs.api_environment }}
        with:
          input-name: api_environment
          allowed: dev prod

      - name: Check the release plan is allowed
        # The same script the release job reads its gates from, run here so
        # a stage_and_submit before the first publish is refused at second
        # zero rather than after a 20-minute R8 build.
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_ACTION: ${{ inputs.release_action }}
          API_ENVIRONMENT: ${{ inputs.api_environment }}
          PLAY_APP_PUBLISHED: ${{ vars.PLAY_APP_PUBLISHED }}
        run: bash "$GITHUB_WORKSPACE/scripts/mobile/android-release-plan.sh"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test the mobile release scripts
        # The Linux half of scripts/mobile/test: the dispatch policy, the
        # keystore check and the Play readback (against canned responses).
        # The plist half runs in the iOS workflow, on a real plutil.
        run: bash "$GITHUB_WORKSPACE/scripts/mobile/test/run-tests.sh" dispatch keystore readback

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      - name: Point the SDK at the runner's install
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: patient-android-app/app/build/reports/
          retention-days: 7

  release:
    name: Signed bundle
    # Only on an explicit dispatch: a release build consumes the upload key,
    # and every AAB uploaded to Play burns a version code.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile-release
    steps:
      - uses: actions/checkout@v7

      - name: Plan the release
        # The ONE place the gates are decided. Every later step reads
        # steps.plan.outputs rather than re-deriving them from the raw
        # dispatch inputs, so the "does this publish" condition is written
        # once and cannot drift between steps. Positive outputs ('true'),
        # compared exactly: a negative gate fails OPEN toward publishing.
        id: plan
        env:
          RELEASE_ACTION: ${{ inputs.release_action }}
          API_ENVIRONMENT: ${{ inputs.api_environment }}
          PLAY_APP_PUBLISHED: ${{ vars.PLAY_APP_PUBLISHED }}
        run: bash "$GITHUB_WORKSPACE/scripts/mobile/android-release-plan.sh"

      - name: Choose the version code
        # A step output, not $GITHUB_ENV: an env entry would reach every later
        # step, the third-party upload action included, where an output
        # reaches only the steps that name it. The scheme and why it differs
        # from iOS: scripts/mobile/build-number.sh.
        id: version
        run: |
          code=$(bash "$GITHUB_WORKSPACE/scripts/mobile/build-number.sh" android)
          echo "version code $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      - name: Check the signing secrets are set
        # Every dispatch needs these four, so they are reported first, and
        # together.
        uses: ./.github/actions/require-secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          names: ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD

      - name: Check the Play credentials are set
        # Its own step so the key stays out of the environment of a
        # build_only dispatch, which touches nothing at Play.
        if: steps.plan.outputs.publish == 'true'
        uses: ./.github/actions/require-secrets
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          names: PLAY_SERVICE_ACCOUNT_JSON

      - name: Restore the upload keystore and prove the secrets open it
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          # Non-empty is not the same as right: a wrong password otherwise
          # fails deep inside a full R8 release build as "Keystore was
          # tampered with, or password was incorrect". This opens the store
          # and unlocks the key exactly as the signer will, naming which of
          # the four secrets is wrong (never printing any of them).
          java "$GITHUB_WORKSPACE/scripts/mobile/CheckKeystore.java" upload-keystore.jks
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build the signed bundle
        env:
          # Read by signingValue() in app/build.gradle.kts. Deliberately NOT
          # written to local.properties: that file would persist the password
          # on the runner's disk and in any uploaded artifact.
          STORE_FILE: ${{ github.workspace }}/patient-android-app/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ steps.plan.outputs.api_base_url }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          echo "building version code $VERSION_CODE against $API_BASE_URL"
          ./gradlew :app:bundleRelease --no-daemon \
            -PversionCode="$VERSION_CODE" \
            -PapiBaseUrl="$API_BASE_URL"

      - name: Check the bundle is actually signed
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::no bundle produced"; exit 1; }
          # An unsigned bundle has no META-INF/*.RSA|EC entry. Catch it here
          # rather than at the Play upload, which rejects with a vaguer error.
          if ! unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "::error::$AAB is not signed"
            exit 1
          fi
          echo "signed bundle: $(du -h "$AAB" | cut -f1)"

      - name: Upload the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: patient-android-aab
          # One path on purpose. upload-artifact@v4 re-roots the artifact at
          # the least common ancestor of all its search paths, so adding a
          # second one moves app-release.aab out of the artifact root and
          # breaks anyone who unzips it expecting to find it there.
          path: patient-android-app/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Publish to Play internal testing
        if: steps.plan.outputs.publish == 'true'
        # v1.1.5, the newest release (tag verified to resolve to this SHA).
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bitnesttechs.hms.patient
          releaseFiles: patient-android-app/app/build/outputs/bundle/release/app-release.aab
          # `tracks`, not the deprecated `track`. At this SHA the action
          # splits the value on ',' and drops empty items WITHOUT trimming,
          # and an EMPTY `tracks` falls back to ['production'] (see
          # validateTracks in src/input-validation.ts). So this stays a
          # literal: an expression that ever evaluated to '' would publish
          # to production. The readback below also names `internal`
          # literally and fails if the version code is not there.
          tracks: internal
          status: completed
          # Committed but NOT sent for review unless the plan says so
          # (stage_and_submit, allowed only after the first publish). The
          # fail-safe direction: if the output were ever missing, `!= 'true'`
          # is true and the edit waits for a human in the console.
          changesNotSentForReview: ${{ steps.plan.outputs.send_for_review != 'true' }}
          # Without this the action names the release after the bundle's
          # versionName, which is the same on every CI build, so successive
          # internal releases are indistinguishable in the console. The
          # commit is what a tester's bug report actually needs.
          releaseName: '${{ steps.version.outputs.code }} (${{ steps.plan.outputs.api_environment }}, ${{ steps.version.outputs.short_sha }})'

      - name: Read the track back from Play
        # A green upload step proves the action returned, not that the build
        # reached the track. This mints its own token with the same service
        # account (openssl + curl, no new dependency), reads the track in a
        # throwaway edit, deletes the edit, and fails unless this run's
        # version code is there with status completed. What that does and
        # does not prove: scripts/mobile/play-track-readback.sh.
        if: steps.plan.outputs.publish == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-readback.json"
          bash "$GITHUB_WORKSPACE/scripts/mobile/play-track-readback.sh" \
            --credentials "$RUNNER_TEMP/play-readback.json" \
            --package com.bitnesttechs.hms.patient \
            --track internal \
            --version-code "$VERSION_CODE" \
            --expect-status completed

      - name: Say what is still owed in the console
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.send_for_review != 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          MSG="Version code $VERSION_CODE is on the internal track but NOT sent for review. Open Play Console > Testing > Internal testing and send the changes for review — testers do not receive it until you do (docs/runbooks/mobile-release.md)."
          echo "::notice::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing material from the runner
        if: always()
        # The iOS sibling deletes its App Store Connect key the same way.
        # Nothing uploads the workspace wholesale today, but the decoded
        # upload keystore should not outlive the steps that need it.
        #
        # serviceAccountJson.json is the Play key: the action writes it from
        # serviceAccountJsonPlainText and removes it in a finally, which a
        # cancel or a timeout-minutes kill skips. A JS action's cwd is the
        # workspace root, not this job's working-directory, so it has to be
        # named by absolute path here. play-readback.json is the readback's
        # copy of the same key.
        run: |
          rm -f upload-keystore.jks local.properties
          rm -f "$GITHUB_WORKSPACE/serviceAccountJson.json" "$RUNNER_TEMP/play-readback.json"
