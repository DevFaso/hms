# Automatic Claude review on every pull request (replaces the Copilot review
# whose quota ran out on 2026-09-05). Calls the Claude API directly, billed to
# the Console organisation behind the ANTHROPIC_API_KEY repository secret.
#
# Fork PRs and Dependabot PRs are skipped: they get no secrets, and this repo
# is public. The job only reads the diff and posts one sticky comment.
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Anthropic SDK
        # Exact version (published 2026-10-08), wheels only: no setup scripts run.
        run: >-
          pip install --quiet --only-binary ':all:' 'anthropic==1.12.1'
      - name: Review the diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The key belongs to the organisation, so each request names the
          # workspace to bill. An identifier, not a secret.
          ANTHROPIC_WORKSPACE_ID: wrkspc_017mpm6K5JXmC5MHwGH4WQr4
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/claude_review.py
