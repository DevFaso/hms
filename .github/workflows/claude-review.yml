# Automatic Claude review on every pull request (replaces the Copilot review
# whose quota ran out on 2026-09-05). Calls the Claude API directly, billed to
# the Console organisation behind the ANTHROPIC_API_KEY repository secret.
#
# Draft PRs are skipped (review once ready). Fork PRs and Dependabot PRs are skipped: they get no secrets, and this repo
# is public. The job only reads the diff and posts one sticky comment.
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff is built locally: gh pr diff answers 406 above ~20,000 lines.
          fetch-depth: 0
          # The job never pushes; keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the Anthropic SDK
        # anthropic==1.12.1 and its dependencies, locked by hash
        # (requirements.in -> uv pip compile --generate-hashes); wheels only.
        run: >-
          pip install --quiet --require-hashes --only-binary ':all:'
          -r .github/scripts/requirements.txt
      - name: Review the diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The key belongs to the organisation, so each request names the
          # workspace to bill. An identifier, not a secret.
          ANTHROPIC_WORKSPACE_ID: wrkspc_017mpm6K5JXmC5MHwGH4WQr4
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/claude_review.py
