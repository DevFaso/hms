name: Mobile — iOS (patient)

# The Xcode project is NOT committed: patient-ios-app/project.yml is the
# source of truth and XcodeGen regenerates MediHubPatient.xcodeproj here.
# That keeps the project file out of merge conflicts and means CI is the
# only place a build is reproducible from a clean checkout.
on:
  push:
    branches: [main, develop]
    paths:
      - 'patient-ios-app/**'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    paths:
      - 'patient-ios-app/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:
    inputs:
      release_action:
        # A choice, not a boolean, for the reason the Android sibling spells
        # out: a boolean dispatch input is a real boolean from the
        # Run-workflow dialog but a STRING over the API, and GitHub casts
        # every non-empty string to true — so `if: inputs.publish` was TRUE
        # for a dispatch that passed publish=false. On this side that means
        # uploading to TestFlight against the operator's instruction, which
        # burns a build number and notifies testers, and cannot be undone.
        # build_only is the PR build and nothing further: the archive job
        # is skipped, so no signing credential reaches the runner.
        description: 'What this dispatch does with the archive'
        type: choice
        options:
          - build_only
          - upload_to_testflight
        default: build_only
      configuration:
        description: 'Archive configuration'
        type: choice
        options: [Release-Dev, Release-Prod]
        default: Release-Dev

permissions:
  contents: read

concurrency:
  # See the Android workflow: a dispatched TestFlight upload must not be
  # cancelled by an unrelated push to the same ref.
  group: mobile-ios-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    working-directory: patient-ios-app

jobs:
  build:
    name: Generate, build, test
    # macos-26, not macos-15. Apple rejects any upload built with an SDK
    # older than iOS 26, and macos-15 ships Xcode 16.4 / iOS 18.5:
    #   error: exportArchive Validation failed. SDK version issue. This app
    #   was built with the iOS 18.5 SDK. All iOS and iPadOS apps must be
    #   built with the iOS 26 SDK or later, included in Xcode 26 or later.
    # Seen on run 35531289830. macos-26 has been generally available since
    # 2026-02-26 and carries Xcode 26. Both jobs move together so the tests
    # and the archive are built by the same toolchain.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Check the dispatch asks for something this workflow knows
        # The Android sibling's reasoning, and the same placement: in build,
        # so a bad value costs a checkout rather than a macOS archive.
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_ACTION: ${{ inputs.release_action }}
        run: |
          # Without this an unrecognised value — a typo, or the Android
          # vocabulary "stage_on_internal" — would skip the upload and report
          # a green run having shipped nothing. An exact alternation, not a
          # substring test against a joined list, and the value is not echoed
          # back before it has been validated; see the Android sibling.
          case "$RELEASE_ACTION" in
            build_only|upload_to_testflight) ;;
            *)
              # Named where it is safe to name it: $GITHUB_STEP_SUMMARY is a
              # file, not a stream the runner scans for ::workflow commands,
              # so the rejected value can go there even though it must not
              # go into the ::error:: line above.
              echo "Rejected dispatch: release_action=$RELEASE_ACTION" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::unknown release_action — expected build_only or upload_to_testflight"
              exit 1
              ;;
          esac
          echo "This dispatch: release_action=$RELEASE_ACTION" >> "$GITHUB_STEP_SUMMARY"

      - name: Show the selected Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for the simulator
        # Ad-hoc signing ("-"), not CODE_SIGNING_ALLOWED=NO. The gate still
        # needs no certificates, but an unsigned test host has no keychain
        # entitlement, so SecItemAdd fails and every KeychainHelper-backed
        # test reads its token back as nil.
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project MediHubPatient.xcodeproj \
            -scheme MediHubPatient \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            | xcbeautify

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # Model names drift between Xcode releases, so resolve one at run
          # time instead of pinning "iPhone 16" and breaking on the next image.
          UDID=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project MediHubPatient.xcodeproj \
            -scheme MediHubPatient \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            | xcbeautify

  testflight:
    name: Archive and upload
    # Gated at the JOB, not at the upload step. Letting the job run for a
    # build_only dispatch would write the App Store Connect key to the
    # runner and point -allowProvisioningUpdates at Apple — which can create
    # or renew a distribution certificate, and those are capped — for a run
    # that ships nothing. build_only therefore does less here than on
    # Android: there it still produces a signed AAB, here it is the PR build
    # and nothing more. Retaining an .xcarchive is the change that would
    # make the two mean the same thing, and it is not this PR.
    if: github.event_name == 'workflow_dispatch' && inputs.release_action == 'upload_to_testflight'
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    environment: mobile-release
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set in the mobile-release environment."
              exit 1
            fi
          done
          # xcodebuild -allowProvisioningUpdates reads the key from this
          # well-known location, which is what lets automatic signing create
          # and download the distribution profile without a Mac in the loop.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Through env, never interpolated into the script. A ${{ }} in a
          # run: block is substituted as TEXT before bash sees it, so a
          # dispatch input lands inside the command — in the one job that
          # holds the App Store Connect signing key. The Android sibling
          # already passes api_environment this way.
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -o pipefail
          # Date-based rather than the run number: run_number restarts at
          # 1 for a new workflow file, and App Store Connect rejects any
          # build number it has already seen for this marketing version.
          # A UTC timestamp is always higher than the previous one.
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "build number $BUILD_NUMBER"
          xcodebuild archive \
            -project MediHubPatient.xcodeproj \
            -scheme MediHubPatient \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath build/MediHubPatient.xcarchive \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          # ExportOptions.plist already carries method=app-store-connect and
          # destination=upload, so this step both exports and ships the build.
          xcodebuild -exportArchive \
            -archivePath build/MediHubPatient.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify

      - name: Remove the API key from the runner
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
