name: Mobile — iOS (patient)

# The Xcode project is NOT committed: patient-ios-app/project.yml is the
# source of truth and XcodeGen regenerates MediHubPatient.xcodeproj here.
# That keeps the project file out of merge conflicts and means CI is the
# only place a build is reproducible from a clean checkout.
#
# Release procedure and secrets: docs/runbooks/mobile-release.md.
on:
  push:
    branches: [main, develop]
    paths:
      - 'patient-ios-app/**'
      - 'scripts/mobile/**'
      - '.github/actions/**'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    paths:
      - 'patient-ios-app/**'
      - 'scripts/mobile/**'
      - '.github/actions/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:
    inputs:
      release_action:
        # A choice, not a boolean, for the reason the Android sibling spells
        # out: a boolean dispatch input is a real boolean from the
        # Run-workflow dialog but a STRING over the API, and GitHub casts
        # every non-empty string to true — so `if: inputs.publish` was TRUE
        # for a dispatch that passed publish=false. On this side that means
        # uploading to TestFlight against the operator's instruction, which
        # burns a build number and notifies testers, and cannot be undone.
        # build_only is the PR build and nothing further: the archive job
        # is skipped, so no signing credential reaches the runner.
        description: 'What this dispatch does with the archive'
        type: choice
        options:
          - build_only
          - upload_to_testflight
        default: build_only
      configuration:
        description: 'Archive configuration'
        type: choice
        options: [Release-Dev, Release-Prod]
        default: Release-Dev

permissions:
  contents: read

concurrency:
  # See the Android workflow: a dispatched TestFlight upload must not be
  # cancelled by an unrelated push to the same ref.
  group: mobile-ios-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    working-directory: patient-ios-app

jobs:
  build:
    name: Generate, build, test
    # macos-26, not macos-15. Apple rejects any upload built with an SDK
    # older than iOS 26, and macos-15 ships Xcode 16.4 / iOS 18.5:
    #   error: exportArchive Validation failed. SDK version issue. This app
    #   was built with the iOS 18.5 SDK. All iOS and iPadOS apps must be
    #   built with the iOS 26 SDK or later, included in Xcode 26 or later.
    # Seen on run 35531289830. macos-26 has been generally available since
    # 2026-02-26 and carries Xcode 26. Both jobs move together so the tests
    # and the archive are built by the same toolchain.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Every dispatch input is validated here, in build, before the
      # testflight job (which holds the App Store Connect key) can start.
      # `configuration` used to go unchecked until xcodebuild rejected it,
      # after a macOS job holding the key had started. The shared action is
      # the Android workflow's too.
      - name: Check release_action
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/validate-dispatch
        env:
          DISPATCH_VALUE: ${{ inputs.release_action }}
        with:
          input-name: release_action
          allowed: build_only upload_to_testflight

      - name: Check configuration
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/validate-dispatch
        env:
          DISPATCH_VALUE: ${{ inputs.configuration }}
        with:
          input-name: configuration
          allowed: Release-Dev Release-Prod

      - name: Show the selected Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Test the mobile release scripts
        # The plist half of scripts/mobile/test runs here against the real
        # plutil (Linux runs a stand-in), and the dispatch half here checks
        # the BSD date path of the iOS build number.
        run: bash "$GITHUB_WORKSPACE/scripts/mobile/test/run-tests.sh" plist dispatch

      - name: Check the generated Info.plist
        # xcodegen rewrites Info.plist from project.yml's info.properties, so
        # a key dropped, renamed or turned into a literal there is free to
        # catch here and costs an archive, an upload and Apple's processing
        # queue to catch anywhere else. That is how
        # ITSAppUsesNonExemptEncryption was found: build 202609201928 landed
        # in Missing Compliance.
        #
        # The key list is derived from project.yml, and the VALUES are
        # asserted: every $(SETTING) reference arrives as that reference
        # (a literal CFBundleVersion outranks CURRENT_PROJECT_VERSION and
        # made every upload after the first a duplicate), the export
        # declaration is a real <false/> backed by a first-party crypto
        # scan, Face ID has a purpose string, and the OAuth redirect scheme
        # of project.yml and of each Config/*.xcconfig is registered in
        # CFBundleURLTypes. The same script checks the archive below.
        run: |
          bash "$GITHUB_WORKSPACE/scripts/mobile/check-info-plist.sh" \
            --mode source \
            --plist MediHubPatient/Resources/Info.plist \
            --project-yml project.yml \
            --sources MediHubPatient \
            --xcconfig-dir Config

      - name: Build for the simulator
        # Ad-hoc signing ("-"), not CODE_SIGNING_ALLOWED=NO. The gate still
        # needs no certificates, but an unsigned test host has no keychain
        # entitlement, so SecItemAdd fails and every KeychainHelper-backed
        # test reads its token back as nil.
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project MediHubPatient.xcodeproj \
            -scheme MediHubPatient \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            | xcbeautify

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # Model names drift between Xcode releases, so resolve one at run
          # time instead of pinning "iPhone 16" and breaking on the next image.
          UDID=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project MediHubPatient.xcodeproj \
            -scheme MediHubPatient \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            | xcbeautify

  testflight:
    name: Archive and upload
    # Gated at the JOB, not at the upload step. Letting the job run for a
    # build_only dispatch would write the App Store Connect key to the
    # runner and point -allowProvisioningUpdates at Apple — which can create
    # or renew a distribution certificate, and those are capped — for a run
    # that ships nothing. build_only therefore does less here than on
    # Android: there it still produces a signed AAB, here it is the PR build
    # and nothing more. Retaining an .xcarchive is the change that would
    # make the two mean the same thing, and it is not this PR.
    if: github.event_name == 'workflow_dispatch' && inputs.release_action == 'upload_to_testflight'
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    environment: mobile-release
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Choose the build number
        # A step output consumed by the archive and by the archive check,
        # not $GITHUB_ENV. The scheme and why it differs from Android:
        # scripts/mobile/build-number.sh.
        id: version
        run: |
          build_number=$(bash "$GITHUB_WORKSPACE/scripts/mobile/build-number.sh" ios)
          echo "build number $build_number"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Check the App Store Connect secrets are set
        uses: ./.github/actions/require-secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        with:
          names: APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # The key id becomes part of a file path in three steps. App Store
          # Connect key ids are ten upper-case alphanumerics; anything else
          # is refused before it is used (and not printed).
          if ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID is not a ten-character App Store Connect key id"
            exit 1
          fi
          # xcodebuild -allowProvisioningUpdates reads the key from this
          # well-known location, which is what lets automatic signing create
          # and download the distribution profile without a Mac in the loop.
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Through env, never interpolated into the script. A ${{ }} in a
          # run: block is substituted as TEXT before bash sees it, so a
          # dispatch input lands inside the command — in the one job that
          # holds the App Store Connect signing key. (It was validated in the
          # build job too.)
          CONFIGURATION: ${{ inputs.configuration }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MediHubPatient.xcodeproj \
            -scheme MediHubPatient \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath build/MediHubPatient.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify

      - name: Check the ARCHIVED Info.plist
        # The PR-time check reads the SOURCE plist, where values are still
        # $(SETTING) references. This reads the one inside the archive Apple
        # actually receives: Release-* with Config/*.xcconfig resolved, a
        # path the Debug-only PR job never exercises. Same script, archive
        # mode: every declared key present and resolved, CFBundleVersion is
        # THIS run's build number, MEDIHUB_API_BASE_URL is a non-empty https
        # URL, the redirect scheme is registered, Face ID has a purpose
        # string, and the export declaration is <false/>. Failing here costs
        # nothing; failing at Apple costs a build number and a processing
        # cycle.
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/mobile/check-info-plist.sh" \
            --mode archive \
            --plist build/MediHubPatient.xcarchive/Products/Applications/MediHubPatient.app/Info.plist \
            --project-yml project.yml \
            --build-number "$BUILD_NUMBER"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          # ExportOptions.plist already carries method=app-store-connect and
          # destination=upload, so this step both exports and ships the build.
          xcodebuild -exportArchive \
            -archivePath build/MediHubPatient.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify

      - name: Remove the API key from the runner
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
