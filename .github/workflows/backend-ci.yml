name: "Backend Quality Gates & Comprehensive Test Suite"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew :hospital-core:clean :hospital-core:build --stacktrace
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Print failed tests
        if: failure()
        run: |
          find hospital-core/build/test-results -name "TEST-*.xml" \
            | xargs grep -l 'failures="[^0]\|errors="[^0]"' 2>/dev/null \
            | while read f; do
                echo "=== FAILED: $f ===";
                grep -A 20 '<failure\|<error' "$f" | head -60;
              done

      - name: Generate Jacoco Report
        if: always()
        run: ./gradlew :hospital-core:jacocoTestReport

      - name: Verify Test Coverage
        run: ./gradlew :hospital-core:jacocoTestCoverageVerification

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: hospital-core/build/reports/tests/test/

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: hospital-core/build/reports/jacoco/test/html/

      # The SonarQube job in project-quality.yml analyses THIS run's coverage
      # and test results instead of re-running the whole suite. Uploaded only
      # when the suite and the coverage gate passed: the Sonar job `needs`
      # this one, so it never runs against a partial report. The common root
      # of the two paths is hospital-core/build/, which is where the Sonar job
      # downloads it back, so sonar.coverage.jacoco.xmlReportPaths and the
      # default sonar.junit.reportPaths resolve unchanged.
      - name: Upload Sonar inputs (JaCoCo XML + JUnit results)
        uses: actions/upload-artifact@v7
        with:
          name: sonar-inputs
          path: |
            hospital-core/build/reports/jacoco/test/jacocoTestReport.xml
            hospital-core/build/test-results/test/
          if-no-files-found: error
          retention-days: 3
