name: Agent Rules CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # ── 1. Markdown Lint ──────────────────────────────────────────
  lint-agent-files:
    name: Lint AGENT files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # SonarCloud row 11 / Sonar S6321: pin the resolved package
      # version so a malicious or accidentally-broken release upstream
      # cannot land in our CI without a deliberate bump in this file.
      # Refresh cadence: monthly, or whenever Renovate opens a PR.
      - name: Install markdownlint-cli
        # --ignore-scripts: prevent install-time scripts from running
        # (Sonar S6321). markdownlint-cli is pure JS with no postinstall.
        run: npm install -g --ignore-scripts markdownlint-cli@0.48.0

      - name: Lint agent markdown files
        run: markdownlint agent/*.md --config .markdownlint.json

  # ── 2. Forbidden Patterns Check ──────────────────────────────
  check-secrets:
    name: Check forbidden patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for forbidden patterns in agent/ directory..."
          FOUND=0

          # Check for hardcoded passwords / tokens / secrets
          if grep -rniE "(password\s*[:=]\s*['\"][^'\"]+|secret\s*[:=]\s*['\"][^'\"]+|token\s*[:=]\s*['\"][^'\"]+|api_key\s*[:=]\s*['\"][^'\"]+)" agent/ --include="*.md"; then
            echo "::error::Found potential hardcoded secrets in agent/ files"
            FOUND=1
          fi

          # Check for AWS keys, JWTs, private keys
          if grep -rniE "(AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]+\.eyJ|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)" agent/ --include="*.md"; then
            echo "::error::Found potential credentials in agent/ files"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi

          echo "No forbidden patterns found."

  # ── 3. Promptfoo Scenario Tests ──────────────────────────────
  prompt-tests:
    name: Scenario tests (Promptfoo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for scenario files
        id: check_scenarios
        run: |
          if ls scenarios/*.prompt.yaml 1>/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.check_scenarios.outputs.found == 'true'
        with:
          node-version: '20'

      # SonarCloud row 11 / Sonar S6321: pin promptfoo to a specific
      # version so an upstream-malicious release can't run with our
      # OPENAI_API_KEY in scope. Bump in a dedicated PR.
      - name: Install promptfoo
        if: steps.check_scenarios.outputs.found == 'true'
        # --ignore-scripts: prevent install-time scripts from running
        # (Sonar S6321). promptfoo is JS-only; no postinstall needed.
        run: npm install -g --ignore-scripts promptfoo@0.121.11

      - name: Run scenario-based tests
        if: steps.check_scenarios.outputs.found == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: promptfoo run scenarios/*.prompt.yaml
