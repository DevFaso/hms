# Grafana Unified Alerting — alert rules (provisioned).
# These mirror the higher-level Prometheus alerts in grafana/rules/alerts.yml
# but use Grafana's UI-aware alert engine so they show up in the "Alerting" tab
# with state, history, and silences.
#
# Two folders:
#   - HMS – SLO       multi-window burn-rate alerts
#   - HMS – Infra     instance-level health
#
# Re-provisioned on every Grafana restart.

apiVersion: 1

groups:
  - orgId: 1
    name: hms-slo
    folder: "HMS – SLO"
    interval: 1m
    rules:
      - uid: hms-slo-fast-burn
        title: HMS error budget – fast burn
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hms-prometheus
            model:
              refId: A
              expr: app:slo_error_ratio:5m{application="hms"}
              instant: true
              interval: ""
          - refId: B
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: hms-prometheus
            model:
              refId: B
              expr: app:slo_error_ratio:1h{application="hms"}
              instant: true
              interval: ""
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              # Trigger when both 5m and 1h burn rates exceed 14.4 * (1 - 0.999).
              expression: "$A > 0.0144 && $B > 0.0144"
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          severity: page
          service: hms-backend
          slo: availability
        annotations:
          summary: "HMS error budget burning fast (>14x)"
          description: "5m and 1h burn both above 14.4x the 99.9% SLO budget. ~2h until 30d budget exhausted."
          runbook_url: "https://github.com/DevFaso/hms/blob/main/docs/runbooks/grafana-observability.md#hmserrorbudgetfastburn"

      - uid: hms-slo-slow-burn
        title: HMS error budget – slow burn
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: hms-prometheus
            model:
              refId: A
              expr: app:slo_error_ratio:30m{application="hms"}
              instant: true
          - refId: B
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: hms-prometheus
            model:
              refId: B
              expr: app:slo_error_ratio:6h{application="hms"}
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: "$A > 0.006 && $B > 0.006"
        noDataState: NoData
        execErrState: Error
        for: 15m
        labels:
          severity: ticket
          service: hms-backend
          slo: availability
        annotations:
          summary: "HMS error budget burning slowly (>6x)"
          description: "30m and 6h burn both above 6x the 99.9% SLO budget."
          runbook_url: "https://github.com/DevFaso/hms/blob/main/docs/runbooks/grafana-observability.md#hmserrorbudgetslowburn"

  - orgId: 1
    name: hms-infra
    folder: "HMS – Infra"
    interval: 1m
    rules:
      - uid: hms-target-down
        title: HMS scrape target down
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hms-prometheus
            model:
              refId: A
              # Mirrors HmsTargetDown in grafana/rules/alerts.yml — restrict to
              # always-on bare-stack jobs so running without --profile observability
              # doesn't page on intentionally-not-running exporters.
              expr: up{job=~"prometheus|grafana|loki|alloy|integrations/spring-boot"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: "$A"
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  reducer: {type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is DOWN"
          description: "Prometheus has not scraped this target for 5 minutes."
          runbook_url: "https://github.com/DevFaso/hms/blob/main/docs/runbooks/grafana-observability.md#hmstargetdown"

      - uid: hms-hikari-saturated
        title: HMS HikariCP pool saturated
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hms-prometheus
            model:
              refId: A
              expr: app:hikaricp_pool_utilisation{application="hms"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: "$A"
              conditions:
                - evaluator: {type: gt, params: [0.9]}
                  operator: {type: and}
                  reducer: {type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: page
          service: hms-backend
        annotations:
          summary: "HikariCP pool > 90% utilised for 5m"
          description: "Backend may queue or refuse requests. Check long-running queries."
          runbook_url: "https://github.com/DevFaso/hms/blob/main/docs/runbooks/grafana-observability.md#hmsdbpoolsaturated"

  # ── Chat transport ───────────────────────────────────────────────────
  # This file is the path that actually notifies: Alertmanager is commented out
  # in grafana/prometheus.yml, so the rules in grafana/rules/alerts.yml are
  # evaluated but routed nowhere. The burn-rate rules above read SLO ratios that
  # now exclude /ws-chat, so without this rule the notifying path would have
  # LESS chat coverage after the exclusion than it had before it.
  - orgId: 1
    name: hms-ws-transport
    folder: "HMS – SLO"
    interval: 1m
    rules:
      - uid: hms-ws-transport-errors
        title: HMS chat transport failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hms-prometheus
            model:
              refId: A
              expr: app:ws_transport_errors:ratio5m{application="hms"}
              instant: true
              interval: ""
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hms-prometheus
            model:
              refId: B
              expr: app:ws_transport_requests:rate5m{application="hms"}
              instant: true
              interval: ""
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              # Rate floor as well as ratio: a failure ratio over two requests in
              # an idle window is noise, not an outage.
              expression: "$A > 0.25 && $B > 0.1"
        # OK, not NoData, and this one matters: every other rule here watches a series
        # that always exists, but this ratio is absent whenever the transport has taken
        # no traffic at all. With NoData on a page-severity rule, a quiet night — or any
        # environment where nobody is using chat — raises a standing DatasourceNoData
        # page. No data here means nothing is failing, which is the OK state.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: page
          service: hms-backend
        annotations:
          summary: "HMS chat transport failing (>25% 5xx)"
          description: >-
            More than a quarter of /ws-chat requests that reached a handler
            returned 5xx. Clinical chat is degraded for every connected client,
            and this endpoint is excluded from the burn-rate SLO. Chat can also
            be broken WITHOUT this firing — see the runbook.
          runbook_url: "https://github.com/DevFaso/hms/blob/main/docs/runbooks/grafana-observability.md#hmschattransporterrors"
