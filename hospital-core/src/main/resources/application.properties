# ===================== App & Web =====================
spring.application.name=hms
server.servlet.context-path=/api

# Active profile (override with SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local-h2}

# ===================== i18n =====================
spring.messages.basename=messages
spring.messages.always-use-message-format=true
spring.messages.use-code-as-default-message=true
spring.messages.encoding=UTF-8

# ===================== Jackson =====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ===================== JPA / Hibernate =====================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/migration/changelog.xml

# ===================== OpenAPI =====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===================== Logging =====================
logging.level.root=INFO
logging.level.com.example.hms=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %5p [%t] %-40.40logger{39} - %msg%n

# ===================== JWT =====================
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-in-production-minimum-256-bits-long!!}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_MS:172800000}
# RS256 asymmetric signing (Phase 6) — set these env vars to enable RS256 instead of HMAC
app.jwt.private-key=${JWT_PRIVATE_KEY:}
app.jwt.public-key=${JWT_PUBLIC_KEY:}
app.jwt.previous-public-key=${JWT_PREVIOUS_PUBLIC_KEY:}

# ===================== MFA =====================
# Roles that require MFA. Override via MFA_REQUIRED_ROLES env var.
app.mfa.required-roles=${MFA_REQUIRED_ROLES:ROLE_SUPER_ADMIN,ROLE_HOSPITAL_ADMIN,ROLE_DOCTOR,ROLE_PHARMACIST,ROLE_FINANCE}

# Rate limiting (T-40)
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:120}

# ===================== Mail (env-driven) =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# ===================== Actuator =====================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.add-additional-paths=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
management.otlp.metrics.export.enabled=${OTEL_METRICS_ENABLED:false}

# ===================== File Upload =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
# Browser-facing URL prefix for patient-document uploads (PR #315 / Sonar S1075).
# Scope is intentionally limited to PatientUploadedDocument — profile images and
# chat-attachment storage keys still use a hard-coded "/uploads" prefix because
# those values double as persisted storage keys on existing DB rows.
# Normalised at startup (see FileUploadService#normalizePatientDocumentUrlPrefix).
app.upload.patient-document-url-prefix=${PATIENT_DOCUMENT_URL_PREFIX:/uploads}
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8081}
app.frontend.base-url=${FRONTEND_BASE_URL:https://dev.e-keneya.com}
# Appointment-link path fragments concatenated as
# `frontendBaseUrl + reschedule-path + appointmentId` in confirmation emails
# (and same for cancel-path). Both AppointmentServiceImpl and
# PatientPortalServiceImpl read these. Normalised at startup so values can be
# written with or without surrounding slashes.
# These two shapes now have real routes (AppointmentLinkGuard), which they
# did NOT until 2026-08-25 — every emailed link landed on the wildcard route.
# Keep them as PATH FRAGMENTS: UrlPathNormalizer.fragment pins a trailing
# slash, so a query-string form like `/my-appointments?cancel=` would be
# normalised to `?cancel=/` and break the id concatenation downstream.
app.frontend.appointments.reschedule-path=${APPOINTMENT_RESCHEDULE_PATH:/appointments/reschedule/}
app.frontend.appointments.cancel-path=${APPOINTMENT_CANCEL_PATH:/appointments/cancel/}

# ===================== FHIR R4 server =====================
# Optional override of the *absolute* FHIR server base URL advertised in the
# CapabilityStatement (e.g. https://hms.example.com/api/fhir). Only absolute
# URLs starting with http:// or https:// are honored; any other value is
# ignored and the URL is derived from the incoming request, honoring
# X-Forwarded-* headers behind Railway/nginx.
app.fhir.serverBaseUrl=${FHIR_SERVER_BASE_URL:}

# FHIR R4 write API (roadmap row 20 — Patient PUT + conditional-create only).
# Default OFF. When enabled:
#   - PUT /Patient/{id}  updates address/telecom/active on an existing patient.
#   - POST /Patient with If-None-Exist=identifier=<mrn-system>|<mrn> returns
#     the existing patient on a single match. Zero matches → 404. Multiple
#     matches → 412 (kept unreachable by V101 partial unique index).
#   - No auto-provisioning of new Patient rows (per empi-identity skill).
# Encounter and Observation write are deferred to the row-20 follow-on.
app.fhir.write.enabled=${FHIR_WRITE_ENABLED:false}

# ===================== FHIR named operations (rows 21 + 22) =====================
# Two independent flags under app.fhir.operations.*:
#   - bulk-export.enabled  → POST /api/fhir/$export (system) + Patient/$export
#                            (foundation pass — in-memory job map; async NDJSON
#                            runner is the row-21 follow-on).
#   - everything.enabled   → GET /api/fhir/Patient/{id}/$everything Bundle.
# Both default false; explicit ${ENV:default} placeholders so the canonical
# env-var name documented in docs/fhir-bulk.md actually binds (PR #349 review).
app.fhir.operations.bulk-export.enabled=${FHIR_BULK_EXPORT_ENABLED:false}
app.fhir.operations.everything.enabled=${FHIR_EVERYTHING_ENABLED:false}
# Where the bulk-export runner writes NDJSON ({dir}/{jobId}/) — a SIBLING of
# the public upload tree, never inside it (/uploads/** is served permitAll and
# export output is a mass PHI extract; files stream only through the
# authenticated download endpoint). Runner sweep interval in milliseconds.
app.fhir.operations.bulk-export.storage-dir=${FHIR_BULK_EXPORT_DIR:fhir-bulk-exports}
app.fhir.operations.bulk-export.runner-interval-ms=${FHIR_BULK_EXPORT_RUNNER_INTERVAL_MS:60000}

# ===================== Scheduled reports (P3 #25a) =====================
# Aggregate-only CSV reports emailed each closed period. The sweep is
# idempotent per (definition, period) — frequency only affects delivery
# latency after a period closes. Enabled by default: it does nothing until
# an admin creates a definition, so the data is the opt-in.
hms.reports.enabled=${HMS_REPORTS_ENABLED:true}
hms.reports.sweep-interval-ms=${HMS_REPORTS_SWEEP_INTERVAL_MS:3600000}

# ===================== KPI dashboard matview tier (row 32 follow-on) =====================
# When enabled, KpiDashboardServiceImpl routes the three KPI queries to
# the pre-aggregated matviews clinical.kpi_*_daily (created in V105 —
# PostgreSQL-only via Liquibase preCondition; H2-backed tests keep the
# on-the-fly fallback). Off by default; flipping on without also
# flipping refresh-scheduler-enabled lets staleness grow until an
# external cron / DBA owns the refresh cadence. See
# docs/runbooks/kpi-materialized-views.md for the activation playbook.
app.analytics.kpi.materialized-views.enabled=${KPI_MATVIEWS_ENABLED:false}
app.analytics.kpi.materialized-views.refresh-scheduler-enabled=${KPI_MATVIEWS_REFRESH_SCHEDULER_ENABLED:false}
app.analytics.kpi.materialized-views.refresh-interval-ms=${KPI_MATVIEWS_REFRESH_INTERVAL_MS:300000}

# -- Outbound webhooks (Tier 2 item 45) -----------------------------------
# Dispatch defaults ON: registering an endpoint is itself the opt-in; with
# no rows the sweep is a no-op.
app.webhooks.enabled=${WEBHOOKS_ENABLED:true}
app.webhooks.sweep-interval-ms=${WEBHOOKS_SWEEP_INTERVAL_MS:60000}
app.webhooks.max-attempts=${WEBHOOKS_MAX_ATTEMPTS:8}
app.webhooks.retry-after-seconds=${WEBHOOKS_RETRY_AFTER_SECONDS:300}
app.webhooks.batch-size=${WEBHOOKS_BATCH_SIZE:50}
app.webhooks.failure-disable-threshold=${WEBHOOKS_FAILURE_DISABLE_THRESHOLD:20}
app.webhooks.connect-timeout-ms=${WEBHOOKS_CONNECT_TIMEOUT_MS:5000}
app.webhooks.read-timeout-ms=${WEBHOOKS_READ_TIMEOUT_MS:10000}

# ===================== Tenant provisioning wiring (row 33 follow-on) =====================
# REST-callable wrapper for scripts/tenancy/provision-schema.sh. Off by
# default — flipping on exposes POST /api/super-admin/tenancy/provision/{hospitalId}
# (SUPER_ADMIN-gated) so an operator can begin a tenant cutover without
# SSH access to the DB host. Independent of the schema-isolation
# runtime flag; both can be toggled in either order.
app.tenancy.provisioning.enabled=${TENANT_PROVISIONING_ENABLED:false}
app.tenancy.provisioning.app-role=${TENANT_PROVISIONING_APP_ROLE:hms_app}

# ===================== EMPI probabilistic match (row 25) =====================
# Flag-off: POST /empi/candidates returns 404 and the matcher short-circuits.
# Flag-on: the Fellegi-Sunter scorer (shipped in 020719d2) returns real scored
# candidates (name 0.40 / DOB 0.25 / national-ID 0.25 / sex 0.10), scoped to
# the caller's active hospital. Confirm-match navigates; merges are the
# separate admin-only /empi merge endpoints (independent of this flag).
app.empi.probabilistic.enabled=${EMPI_PROBABILISTIC_ENABLED:false}
app.empi.probabilistic.min-score=${EMPI_PROBABILISTIC_MIN_SCORE:0.7}
app.empi.probabilistic.max-candidates=${EMPI_PROBABILISTIC_MAX_CANDIDATES:10}

# ===================== Async dispense + lab pipeline (row 36) =====================
# Foundation pass — properties only; @KafkaListener bodies + producer wiring
# are the row-36 follow-on, gated on row-23 soak.
app.async.pipeline.enabled=${ASYNC_PIPELINE_ENABLED:false}
app.async.pipeline.oru-result-topic=${ASYNC_PIPELINE_ORU_RESULT_TOPIC:hms.oru.result}
app.async.pipeline.dispense-settlement-topic=${ASYNC_PIPELINE_DISPENSE_SETTLEMENT_TOPIC:hms.dispense.settlement}
app.async.pipeline.consumer-group=${ASYNC_PIPELINE_CONSUMER_GROUP:hms-async-pipeline}

# ===================== DICOM proxy (row 42) =====================
# Foundation pass — flag + service skeleton; QIDO-RS / WADO-RS bridge to
# Orthanc/dcm4chee is the row-42 follow-on.
app.imaging.dicom-proxy.enabled=${DICOM_PROXY_ENABLED:false}
app.imaging.dicom-proxy.adapter=${DICOM_PROXY_ADAPTER:orthanc}
app.imaging.dicom-proxy.base-url=${DICOM_PROXY_BASE_URL:}

# ===================== Per-tenant cost observability (row 44) =====================
# Foundation pass — super-admin chargeback rollup from audit-event counts.
# Splunk event-count + Grafana series-cardinality inputs are the row-44 follow-on.
app.observability.tenant-cost.enabled=${TENANT_COST_OBS_ENABLED:false}

# ===================== Portal URL Templates =====================
# Derived from app.frontend.base-url — overridable per environment.
app.portal.profile-completion-url-template=${app.frontend.base-url}/onboarding/role-welcome?assignment=%s
# The route is `admin-assignments`, NOT `super/assignments` — that path has
# never existed in the Angular app, so every assigner-confirmation email ever
# sent linked to the wildcard route. Masked until 2026-08-25 because the base
# URL pointed at a non-production host. `?confirm=<assignmentCode>` lands the
# assigner on the code-filtered list, i.e. the one row they were emailed about.
app.portal.assigner-confirmation-url-template=${app.frontend.base-url}/admin-assignments?confirm=%s

# Public base URL prepended to uploaded-file paths returned to the browser.
# MUST be set to the public-facing origin in production so browsers can
# reach the file (e.g. https://dev.e-keneya.com).
# When empty the service falls back to the current request origin (local dev).
app.public-base-url=${PUBLIC_BASE_URL:}

# ===================== CORS =====================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===================== Auth — refresh-token cookie (S-01) =====================
# The refresh token is delivered via an HttpOnly cookie so it is unreadable
# from JavaScript (mitigates XSS-based token theft).
# Secure=false is only appropriate for plain-HTTP local dev.
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAMESITE:Strict}

# ===================== Keycloak / OIDC resource server (S-03 phase 1) =====================
# When OIDC_ISSUER_URI is set (e.g. https://keycloak.example.com/realms/hms), the app
# becomes an OAuth2 Resource Server that ALSO accepts Keycloak-issued JWTs alongside
# its own internally-issued tokens. Internal tokens (no `iss` claim) continue through
# JwtAuthenticationFilter; tokens whose `iss` matches OIDC_ISSUER_URI are routed to
# the Spring Security oauth2-resource-server stack via IssuerAwareBearerTokenResolver.
# Empty default = OIDC stack is not wired and behaviour is identical to today.
# OIDC_AUDIENCE (optional) enables strict `aud` claim validation when set.
app.auth.oidc.issuer-uri=${OIDC_ISSUER_URI:}
app.auth.oidc.audience=${OIDC_AUDIENCE:}

# KC-5 prep — soak flag that disables the legacy internal token issuer
# (POST /auth/login, POST /auth/token/refresh) without touching the
# resource-server stack. Already-issued tokens continue to validate
# through JwtAuthenticationFilter until they expire naturally. Flip to
# `true` in UAT/prod during the Phase 2.6 soak window; once Grafana
# confirms zero legacy traffic, Phase 3 physically removes the issuer.
# Default `false` preserves today's behaviour exactly.
app.auth.oidc.required=${OIDC_REQUIRED:false}

# ===================== PHI field-level encryption (S-05) =====================
# AES-256-GCM key as Base64 of 32 bytes. Empty in dev = converter is loaded
# but inactive (legacy plaintext rows are returned as-is, encrypt attempts
# fail fast with a clear error). Production (application-prod.yml) MUST
# supply this via env var APP_ENCRYPTION_KEY with no default.
app.encryption.key=${APP_ENCRYPTION_KEY:}

# ===================== Redis (token blacklist) =====================
# Set to true in environments with Redis available to share JWT blacklist
# across instances. When false (default), the in-memory blacklist is used.
# Redis connection properties (spring.data.redis.*) must be configured
# alongside this flag.
app.redis.token-blacklist.enabled=${REDIS_TOKEN_BLACKLIST_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
# Disable the auto-configured Redis health indicator unless Redis is actually
# wired. Otherwise Spring Boot's /actuator/health returns DOWN (503) in envs
# without Redis, which causes Railway's healthcheck to fail the deploy.
# Set REDIS_HEALTH_ENABLED=true alongside REDIS_TOKEN_BLACKLIST_ENABLED=true
# in environments with a real Redis instance.
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# ===================== Idle session timeout (v1.0 row 7) =====================
# Server-side idle-session timeout. Disabled by default so local-h2 and
# integration tests stay unaffected; flip in shared environments via env vars.
# - app.auth.idle-window: ISO-8601 Duration. Reset on every authenticated
#   request via the IdleSessionGate. Default 15 minutes.
# - app.auth.idle-tracking.enabled: pick the Redis-backed tracker when true,
#   the in-memory fallback when false / unset.
# - app.auth.idle-tracking.fail-open: on Redis outage, treat the call as
#   successful (touch becomes a no-op, isIdle returns false) so a Redis
#   blip cannot lock every clinician out of the system. Throttled WARN +
#   counter still fire so ops see the degradation.
# - app.auth.idle-tracking.machine-roles: comma-separated authorities that
#   bypass the gate (service-to-server clients). Empty falls back to the
#   canonical FHIR/HL7/CDS/DHIS2/partner-webhook five.
app.auth.idle-window=${AUTH_IDLE_WINDOW:PT15M}
app.auth.idle-tracking.enabled=${AUTH_IDLE_TRACKING_ENABLED:false}
app.auth.idle-tracking.fail-open=${AUTH_IDLE_TRACKING_FAIL_OPEN:true}
app.auth.idle-tracking.machine-roles=${AUTH_IDLE_TRACKING_MACHINE_ROLES:}

# ===================== Connection Pool (write primary) =====================
# Hikari sizing for the WRITE pool. Sized via docs/runbooks/postgres-pool-replica-sizing.md
# (roadmap row 35 — keep this in sync with the runbook's formula). Defaults match an
# 8-core app instance against a 4-core Postgres primary at ~60 concurrent active users.
# Override per-deployment via env vars; the keys here also bind through
# spring.datasource.hikari.* on the writeDataSource bean.
spring.datasource.hikari.pool-name=${HIKARI_PRIMARY_POOL_NAME:hms-primary-pool}
spring.datasource.hikari.maximum-pool-size=${HIKARI_PRIMARY_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_PRIMARY_MIN_IDLE:5}
# Below the database server's wal_sender_timeout / idle_in_transaction_session_timeout so
# Hikari closes idle connections before Postgres does — avoids the "connection has been
# closed" jitter under low load.
spring.datasource.hikari.idle-timeout=${HIKARI_PRIMARY_IDLE_TIMEOUT_MS:600000}
# Hard cap on connection age. 30 min recycles before any cloud-side TCP keep-alive expires.
spring.datasource.hikari.max-lifetime=${HIKARI_PRIMARY_MAX_LIFETIME_MS:1800000}
# Get-connection from pool. Must be longer than the slowest legitimate read or write under
# soak; stays at 30s to mirror the pre-row-35 baseline.
spring.datasource.hikari.connection-timeout=${HIKARI_PRIMARY_CONNECTION_TIMEOUT_MS:30000}
# Leak detection (0 = off). Production should set this to 10000 (10s) to surface long-held
# connections; left at 0 by default so it never trips on a slow integration test.
spring.datasource.hikari.leak-detection-threshold=${HIKARI_PRIMARY_LEAK_DETECTION_MS:0}

# ===================== Read Replica (optional, roadmap row 35) ==============
# Foundation pass for read-replica routing. Disabled by default; flipping
# APP_DATASOURCE_REPLICA_ENABLED=true also requires the URL + credentials below.
# When enabled, methods annotated @Transactional(readOnly=true) route to the replica;
# everything else stays on the write primary. See
# docs/runbooks/postgres-pool-replica-sizing.md for the activation playbook.
app.datasource.replica.enabled=${APP_DATASOURCE_REPLICA_ENABLED:false}
app.datasource.replica.url=${APP_DATASOURCE_REPLICA_URL:}
app.datasource.replica.username=${APP_DATASOURCE_REPLICA_USERNAME:}
app.datasource.replica.password=${APP_DATASOURCE_REPLICA_PASSWORD:}
app.datasource.replica.driver-class-name=${APP_DATASOURCE_REPLICA_DRIVER:org.postgresql.Driver}
app.datasource.replica.hikari.pool-name=${HIKARI_REPLICA_POOL_NAME:hms-replica-pool}
app.datasource.replica.hikari.maximum-pool-size=${HIKARI_REPLICA_MAX_POOL_SIZE:10}
app.datasource.replica.hikari.minimum-idle=${HIKARI_REPLICA_MIN_IDLE:2}
app.datasource.replica.hikari.idle-timeout-ms=${HIKARI_REPLICA_IDLE_TIMEOUT_MS:600000}
app.datasource.replica.hikari.max-lifetime-ms=${HIKARI_REPLICA_MAX_LIFETIME_MS:1800000}
# Faster fail than primary — replicas are advisory, so a slow replica should fail open
# to the primary rather than block a dashboard request for 30 s.
app.datasource.replica.hikari.connection-timeout-ms=${HIKARI_REPLICA_CONNECTION_TIMEOUT_MS:5000}
app.datasource.replica.hikari.leak-detection-threshold-ms=${HIKARI_REPLICA_LEAK_DETECTION_MS:0}

# ===================== Splunk HEC logging =====================
# Off by default — the appender is registered but no-ops when enabled=false, so local dev needs
# zero Splunk config. Production/UAT enable via SPLUNK_HEC_ENABLED=true; URL+token must then be
# set via Railway env vars (SplunkLoggingProperties enforces this at boot). Source/sourcetype
# default to values that play well with Splunk's spring-boot dashboard pack.
app.observability.splunk.enabled=${SPLUNK_HEC_ENABLED:false}
app.observability.splunk.hec.url=${SPLUNK_HEC_URL:}
app.observability.splunk.hec.token=${SPLUNK_HEC_TOKEN:}
app.observability.splunk.hec.index=${SPLUNK_HEC_INDEX:main}
app.observability.splunk.hec.source=${SPLUNK_HEC_SOURCE:hms-backend}
app.observability.splunk.hec.source-type=${SPLUNK_HEC_SOURCETYPE:spring-boot:json}
app.observability.splunk.hec.host=${SPLUNK_HEC_HOST:}
# Local-only escape hatch — leave false in UAT/prod (Railway env vars should not set this).
app.observability.splunk.hec.allow-insecure-url=${SPLUNK_HEC_ALLOW_INSECURE_URL:false}

# ===================== IKODDI SMS / OTP (phone-first flows) =====================
# Off by default — the gateway reports unconfigured, MockSmsServiceImpl keeps handling
# SmsService calls, and the portal hides the verify-phone action. Enabling requires
# IKODDI_ENABLED=true plus api-key, organization-id and otp-app-id; the Ikoddi-backed
# SmsService then becomes @Primary and every existing SMS consumer goes live.
app.ikoddi.enabled=${IKODDI_ENABLED:false}
app.ikoddi.base-url=${IKODDI_BASE_URL:https://api.ikoddi.com/api/v1}
app.ikoddi.api-key=${IKODDI_API_KEY:}
app.ikoddi.organization-id=${IKODDI_ORGANIZATION_ID:}
app.ikoddi.otp-app-id=${IKODDI_OTP_APP_ID:}
app.ikoddi.sms-sender=${IKODDI_SMS_SENDER:HMS}
app.ikoddi.country-string-code=${IKODDI_COUNTRY_STRING_CODE:BF}
app.ikoddi.country-number-code=${IKODDI_COUNTRY_NUMBER_CODE:226}
app.ikoddi.otp-ttl-seconds=${IKODDI_OTP_TTL_SECONDS:300}
app.ikoddi.connect-timeout-ms=${IKODDI_CONNECT_TIMEOUT_MS:5000}
app.ikoddi.read-timeout-ms=${IKODDI_READ_TIMEOUT_MS:15000}

# ===================== Critical-value escalation (P0 #5) =====================
# Enabled by default: critical results notify the ordering provider in-app on
# save, and this sweep escalates results still unacknowledged after the delay.
# SMS piggybacks on the IKODDI channel and stays inert while it is disabled.
hms.lab.critical-escalation.enabled=${LAB_CRITICAL_ESCALATION_ENABLED:true}
hms.lab.critical-escalation.interval-ms=${LAB_CRITICAL_ESCALATION_INTERVAL_MS:300000}
hms.lab.critical-escalation.escalate-after-minutes=${LAB_CRITICAL_ESCALATION_AFTER_MINUTES:30}

# ===================== Appointment reminders (P1 #7) =====================
# Enabled by default: in-app reminders are always safe, and SMS piggybacks on
# the IKODDI channel (inert until app.ikoddi.enabled). One reminder per
# appointment (reminder_sent_at stamp, V112); the stored APPOINTMENT_REMINDER
# notification preferences are honoured per channel (absent rows = enabled).
hms.appointments.reminder.enabled=${APPOINTMENT_REMINDER_ENABLED:true}
hms.appointments.reminder.interval-ms=${APPOINTMENT_REMINDER_INTERVAL_MS:900000}
hms.appointments.reminder.lead-hours=${APPOINTMENT_REMINDER_LEAD_HOURS:24}
hms.appointments.reminder.locale=${APPOINTMENT_REMINDER_LOCALE:fr}

# ===================== Kafka Topics =====================
app.kafka.chat-topic=${KAFKA_CHAT_TOPIC:hms.chat}
app.kafka.empi-identity-topic=${KAFKA_EMPI_TOPIC:hms.empi.identity}
app.kafka.patient-movement-topic=${KAFKA_PATIENT_MOVEMENT_TOPIC:hms.patient.movement}
app.kafka.platform-registry-topic=${KAFKA_PLATFORM_REGISTRY_TOPIC:hms.platform.registry}
app.kafka.enabled=${KAFKA_ENABLED:false}
