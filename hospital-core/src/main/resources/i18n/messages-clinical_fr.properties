cds.bpa.MALARIA_FEVER.name=Paludisme — bilan du patient fébrile
cds.bpa.MALARIA_FEVER.summary=Fièvre documentée ≥ 38,5 °C dans les dernières 24 h sans traitement antipaludique en cours. Prescrire un test de diagnostic rapide ou une goutte épaisse et un frottis ; traiter selon les recommandations de l''OMS si positif.
cds.bpa.SEPSIS_QSOFA.name=Sepsis — bundle de la première heure (qSOFA ≥ 2)
cds.bpa.SEPSIS_QSOFA.summary=Au moins deux critères qSOFA dans les 6 dernières heures (FR ≥ 22, PAS ≤ 100, altération de la conscience). Prélever hémocultures et lactates, administrer une antibiothérapie à large spectre dans l''heure, débuter le remplissage vasculaire.
cds.bpa.OB_HEMORRHAGE.name=Hémorragie du post-partum — activation du protocole
cds.bpa.OB_HEMORRHAGE.summary=Patiente en post-partum avec FC > 100 ou PAS < 90 dans les 6 h suivant l''accouchement. Activer le protocole HPP : massage utérin, utérotoniques, deux voies veineuses, groupage et compatibilité, appeler l''équipe obstétricale.
cds.bpa.NEWS2_EWS.name=NEWS2 — score d''alerte précoce
cds.bpa.NEWS2_EWS.summary=Les dernières constantes cliniques du patient donnent un score NEWS2 élevé. Réévaluer le patient, augmenter la fréquence de surveillance selon la procédure d''escalade locale et envisager une évaluation clinique urgente si NEWS2 ≥ 5 ou si un paramètre isolé vaut 3.
