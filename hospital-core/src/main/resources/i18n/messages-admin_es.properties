clinicalRules.rule.OBSTETRIC_ELIGIBILITY.title=Registros obstétricos: elegibilidad (sexo, edad), nunca rechazados en urgencia
clinicalRules.rule.OBSTETRIC_ELIGIBILITY.description=Un registro obstétrico se rechaza para un paciente registrado como varón o fuera de la edad obstétrica; un sexo o una fecha de nacimiento desconocidos no rechazan nada, y una ecografía URGENTE o STAT o una derivación urgente a ginecología-obstetricia nunca se rechazan (se señalan para revisión y se auditan).
clinicalRules.rule.OBSTETRIC_ELIGIBILITY.approver=Responsable de obstetricia
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.title=Frecuencias a horas fijas en el plan de administración
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.description=Una frecuencia escrita en horas (« 7 h 13 h 19 h », « a las 9 h ») se administra a esas horas del día, nunca repartida a intervalos iguales desde la firma de la prescripción.
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.approver=Responsable clínico y supervisor de enfermería
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.title=Informes de ecografía firmados antes de exigir los hallazgos
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.description=Un informe firmado y revisado antes de que los hallazgos fueran obligatorios aún puede marcarse como comunicado al paciente; cualquier otro informe exige primero sus hallazgos.
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.approver=Radiólogo o director médico
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.title=Corrección de una tarifa el mismo día
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.description=Una tarifa introducida hoy y vigente desde hoy puede corregirse el mismo día, salvo que una línea de factura ya la haya utilizado.
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.approver=Director de la clínica y responsable financiero
clinicalRules.read.staffOnly=Las reglas clínicas de un establecimiento las lee su propio personal, con un rol en ese establecimiento.
clinicalRules.impersonation.signoff=Una sesión de soporte no puede registrar ni revocar la validación de una regla clínica en nombre de este usuario.
assignment.patientInvitation.notFound=No hay ninguna invitación al portal pendiente para este paciente en su hospital.
