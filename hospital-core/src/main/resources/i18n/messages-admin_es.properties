# V356: los conjuntos de reglas provisionales de ClinicalRuleRegistry (título, descripción, aprobador).
clinicalRules.rule.BLOOD_EMERGENCY_RELEASE.title=Compatibilidad sanguínea y liberación de urgencia
clinicalRules.rule.BLOOD_EMERGENCY_RELEASE.description=Un circuito de urgencia separado registra el clínico responsable, la urgencia, el motivo y las pruebas pendientes; la liberación pese a una prueba incompatible la autoriza un médico o el director del laboratorio.
clinicalRules.rule.BLOOD_EMERGENCY_RELEASE.approver=Responsable de transfusión
clinicalRules.rule.NEWBORN_VITALS.title=Constantes vitales del recién nacido
clinicalRules.rule.NEWBORN_VITALS.description=Los valores anormales del recién nacido se guardan, se señalan y se escalan, nunca se rechazan; cada signo de peligro posnatal de la OMS (temperatura superior a 37,5 °C, respiración por encima de 60/min, mala alimentación, convulsiones, tiraje subcostal grave, ausencia de movimiento espontáneo) genera una alerta urgente.
clinicalRules.rule.NEWBORN_VITALS.approver=Responsable de neonatología o pediatría y farmacéutico
clinicalRules.rule.PARACETAMOL_LIMITS.title=Límites del paracetamol
clinicalRules.rule.PARACETAMOL_LIMITS.description=Adulto: 1 g por dosis, 4 g en 24 h sumando todos los productos y vías, 4 h entre dosis; niño desde 1 mes: 15 mg/kg por dosis, 60 mg/kg/día (10 y 40 antes de 1 mes); un exceso solo se firma con la excepción explícita del prescriptor.
clinicalRules.rule.PARACETAMOL_LIMITS.approver=Responsable de neonatología o pediatría y farmacéutico
clinicalRules.rule.PAEDIATRIC_DOSE_LIMITS.title=Límites de dosis pediátricas y revisión
clinicalRules.rule.PAEDIATRIC_DOSE_LIMITS.description=Los límites pediátricos del catálogo del establecimiento se aplican por vía, franja de edad y peso; antes de 3 meses el veredicto en mg/kg se suspende para una revisión, y el techo diario absoluto se sigue controlando; una vía ausente da « revisión necesaria ».
clinicalRules.rule.PAEDIATRIC_DOSE_LIMITS.approver=Responsable de neonatología o pediatría y farmacéutico
clinicalRules.rule.AL_WHO_WEIGHT_BANDS.title=Arteméter-lumefantrina, niño: franjas de peso de la OMS
clinicalRules.rule.AL_WHO_WEIGHT_BANDS.description=De 5 a menos de 15 kg 1 comprimido, de 15 a menos de 25 kg 2, de 25 a menos de 35 kg 3, 35 kg o más 4 comprimidos de 20/120 mg, 2 veces al día durante 3 días, solo si el catálogo no tiene límite pediátrico; cualquier otra concentración pasa a revisión.
clinicalRules.rule.AL_WHO_WEIGHT_BANDS.approver=Pediatra o responsable de pediatría y farmacéutico responsable
clinicalRules.rule.PERINATAL_CLASSIFICATION.title=Clasificación perinatal de las muertes
clinicalRules.rule.PERINATAL_CLASSIFICATION.description=Perinatal: desde 22 semanas de gestación cumplidas hasta los días 0 a 6 tras el nacimiento; neonatal: días 0 a 27; una edad gestacional ausente da « información insuficiente »; la muerte se registra siempre.
clinicalRules.rule.PERINATAL_CLASSIFICATION.approver=Responsable de obstetricia o neonatología y autoridad de codificación
clinicalRules.rule.STILLBIRTH_COUNTING.title=Recuento de mortinatos
clinicalRules.rule.STILLBIRTH_COUNTING.description=Una muerte fetal se cuenta según el indicador de la OMS (28 semanas cumplidas), la cifra perinatal y el nivel CIE (22 semanas); una edad gestacional ausente da una clasificación incompleta.
clinicalRules.rule.STILLBIRTH_COUNTING.approver=Responsable de obstetricia y autoridad de codificación
clinicalRules.rule.STILLBIRTH_CORRECTION.title=Corrección de mortinato a nacido vivo
clinicalRules.rule.STILLBIRTH_CORRECTION.description=La corrección se permite con un motivo obligatorio pese a un certificado de defunción; el conflicto abre una tarea urgente de conciliación y se cuenta una vez, sin reactivación automática del paciente.
clinicalRules.rule.STILLBIRTH_CORRECTION.approver=Responsable de obstetricia y autoridad de codificación
clinicalRules.rule.STILLBORN_NEONATAL_ALERTS.title=Alertas neonatales de un mortinato
clinicalRules.rule.STILLBORN_NEONATAL_ALERTS.description=Las alertas de Apgar y de prematuridad no se generan para un mortinato confirmado; se señala un conflicto si el desenlace es incierto.
clinicalRules.rule.STILLBORN_NEONATAL_ALERTS.approver=Responsable de obstetricia o neonatología
clinicalRules.rule.DEATH_RECORD_DISPUTE.title=Impugnación de un registro de defunción
clinicalRules.rule.DEATH_RECORD_DISPUTE.description=Un médico autorizado del hospital tratante documenta que el paciente está vivo; el registro pasa a « defunción impugnada », se conserva la declaración original, se levantan los bloqueos por defunción en el ámbito de atención autorizado y se abre una revisión administrativa urgente.
clinicalRules.rule.DEATH_RECORD_DISPUTE.approver=Responsable clínico
clinicalRules.rule.ORDER_REVIEW_HOLD.title=Prescripciones suspendidas durante una impugnación
clinicalRules.rule.ORDER_REVIEW_HOLD.description=Las dosis no iniciadas, los medicamentos no dispensados y las solicitudes de sangre pendientes quedan suspendidos hasta que un prescriptor autorizado los reconfirme, sustituya o detenga; las perfusiones en curso exigen una evaluación clínica inmediata.
clinicalRules.rule.ORDER_REVIEW_HOLD.approver=Responsable clínico
clinicalRules.rule.MIDWIFE_LABOUR_ADMISSION.title=Ingreso de una mujer en trabajo de parto por una matrona
clinicalRules.rule.MIDWIFE_LABOUR_ADMISSION.description=Una matrona del hospital ingresa a una mujer en trabajo de parto, y ningún otro tipo de ingreso; un médico ingresa cualquier tipo.
clinicalRules.rule.MIDWIFE_LABOUR_ADMISSION.approver=Responsable de obstetricia
clinicalRules.rule.ALLERGY_OVERRIDE_REASON.title=Motivo obligatorio para firmar pese a una alerta de alergia
clinicalRules.rule.ALLERGY_OVERRIDE_REASON.description=Una prescripción en conflicto con una alergia registrada solo se firma con el motivo documentado del prescriptor, que queda auditado.
clinicalRules.rule.ALLERGY_OVERRIDE_REASON.approver=Responsable clínico y farmacéutico
clinicalRules.rule.ALLERGY_CONFLICT_REVIEW.title=Conflicto alérgico en la administración y la dispensación
clinicalRules.rule.ALLERGY_CONFLICT_REVIEW.description=Una alergia registrada después de la firma detiene la administración y la dispensación hasta la revisión de un prescriptor habilitado; no hay vía de urgencia sin protocolo aprobado.
clinicalRules.rule.ALLERGY_CONFLICT_REVIEW.approver=Responsable clínico y farmacéutico
clinicalRules.rule.LABOUR_TRANSFER.title=Traslado de un trabajo de parto entre hospitales
clinicalRules.rule.LABOUR_TRANSFER.description=Un trabajo de parto activo se entrega a otro hospital con un traspaso, o continúa allí sin él; cada hospital conserva su propio episodio, vinculado, y lee el partograma del otro en solo lectura.
clinicalRules.rule.LABOUR_TRANSFER.approver=Responsable de obstetricia
clinicalRules.rule.UNSIGNED_NOTE_WORKFLOW.title=Nota clínica sin firmar al cerrar una visita
clinicalRules.rule.UNSIGNED_NOTE_WORKFLOW.description=La visita puede cerrarse; la nota vuelve a su autor, sigue un recordatorio a las 24 h, la lista del administrador a las 72 h, y el resumen indica « no finalizado ».
clinicalRules.rule.UNSIGNED_NOTE_WORKFLOW.approver=Responsable clínico
clinicalRules.rule.SEVERE_HYPERTENSION_OBSTETRIC.title=Hipertensión grave en el embarazo y tras el parto
clinicalRules.rule.SEVERE_HYPERTENSION_OBSTETRIC.description=Una sistólica de 160 mmHg o más, o una diastólica de 110 o más, durante el embarazo o en los 42 días tras un parto, genera una alerta URGENTE « revisión obstétrica urgente »; nunca bloqueante.
clinicalRules.rule.SEVERE_HYPERTENSION_OBSTETRIC.approver=Responsable de obstetricia
clinicalRules.rule.SEVERE_HYPERTENSION_ADULT.title=Hipertensión grave del adulto
clinicalRules.rule.SEVERE_HYPERTENSION_ADULT.description=Una sistólica de 180 mmHg o más, o una diastólica de 120 o más (18 años o más, o una madre después del día 42), genera un AVISO para volver a medir en reposo; URGENTE solo con un signo de daño de órgano marcado.
clinicalRules.rule.SEVERE_HYPERTENSION_ADULT.approver=Responsable clínico / medicina interna
clinicalRules.rule.MINOR_LABOUR_SAFEGUARDING.title=Ingreso en trabajo de parto de una menor
clinicalRules.rule.MINOR_LABOUR_SAFEGUARDING.description=El ingreso nunca se bloquea; con menos de 13 años al ingreso se abren una revisión URGENTE de protección de la infancia y una revisión obstétrica sénior, visibles solo para el equipo asistencial y los administradores del hospital.
clinicalRules.rule.MINOR_LABOUR_SAFEGUARDING.approver=Responsable de obstetricia y responsable de protección de la infancia
clinicalRules.rule.IMAGING_URGENT_PREAUTHORISATION.title=Imagen urgente nunca bloqueada por la preautorización
clinicalRules.rule.IMAGING_URGENT_PREAUTHORISATION.description=Un examen URGENTE o STAT empieza sin su número de preautorización, señalado « preautorización pendiente » con una tarea de facturación; un examen de rutina sigue rechazado sin él.
clinicalRules.rule.IMAGING_URGENT_PREAUTHORISATION.approver=Responsable de radiología; confirmación de la regla CNAMU
clinicalRules.rule.IMAGING_DUPLICATE_OVERRIDE.title=Motivo para « Pedir de todos modos » en imagen
clinicalRules.rule.IMAGING_DUPLICATE_OVERRIDE.description=Pedir pese a la alerta de duplicado exige un motivo de una lista fija (otro: nota obligatoria), guardado en la solicitud y en la auditoría.
clinicalRules.rule.IMAGING_DUPLICATE_OVERRIDE.approver=Responsable de radiología
clinicalRules.rule.SENSITIVE_CATEGORIES.title=Categorías sensibles ocultas al acceso familiar
clinicalRules.rule.SENSITIVE_CATEGORIES.description=VIH, ITS, hepatitis B/C, embarazo, anticoncepción/aborto, violencia, salud mental, adicciones, pruebas genéticas y drepanocitosis del adulto se ocultan a los familiares; la tuberculosis tiene acceso restringido.
clinicalRules.rule.SENSITIVE_CATEGORIES.approver=Jurista burkinés y un clínico
clinicalRules.rule.MINOR_HIV_RESULT_RELEASE.title=Resultado de VIH de un menor comunicado a un progenitor
clinicalRules.rule.MINOR_HIV_RESULT_RELEASE.description=Oculto hasta que un médico o una matrona que atiende al paciente lo comunique a un progenitor o tutor verificado, con un motivo, auditado; solo un resultado de VIH es comunicable, uno relacionado con violencia nunca.
clinicalRules.rule.MINOR_HIV_RESULT_RELEASE.approver=Jurista burkinés
clinicalRules.rule.ADOLESCENT_CONFIDENTIALITY_AGE.title=Edad de confidencialidad de los adolescentes
clinicalRules.rule.ADOLESCENT_CONFIDENTIALITY_AGE.description=Desde los 12 años (ajustable por establecimiento, 0 a 18), los registros sensibles de un menor se ocultan a los padres salvo que un clínico los comunique.
clinicalRules.rule.ADOLESCENT_CONFIDENTIALITY_AGE.approver=Jurista burkinés
clinicalRules.rule.RECOMMENDED_SENSITIVE_LAB_TESTS.title=Lista recomendada de pruebas sensibles
clinicalRules.rule.RECOMMENDED_SENSITIVE_LAB_TESTS.description=La correspondencia establecida entre las pruebas del catálogo y las categorías sensibles, que el director del laboratorio puede aplicar al catálogo.
clinicalRules.rule.RECOMMENDED_SENSITIVE_LAB_TESTS.approver=Director del laboratorio o director médico
clinicalRules.rule.MIDWIFE_NEWBORN_CARE.title=Matrona y recién nacido
clinicalRules.rule.MIDWIFE_NEWBORN_CARE.description=Una matrona ingresa al recién nacido de un parto en el que participó, hasta 28 días de vida, y es su clínica responsable; asigna camas y cunas de maternidad; una cuna de neonatología que asigna crea una tarea urgente para los médicos.
clinicalRules.rule.MIDWIFE_NEWBORN_CARE.approver=Obstetra o matrona designados, con el organigrama de la maternidad
clinicalRules.rule.IMAGING_TECHNICIAN_SCOPE.title=Técnico de imagen
clinicalRules.rule.IMAGING_TECHNICIAN_SCOPE.description=El técnico recibe al paciente, inicia, termina o interrumpe el examen con un motivo, y registra el contraste, la dosis y las imágenes clave; nunca prescribe, informa ni firma.
clinicalRules.rule.IMAGING_TECHNICIAN_SCOPE.approver=Radiólogo o director médico del establecimiento
clinicalRules.rule.NON_PHYSICIAN_ULTRASOUND.title=Ecografía por un no médico
clinicalRules.rule.NON_PHYSICIAN_ULTRASOUND.description=Por defecto solo los médicos realizan una ecografía; un establecimiento puede confiarla a su técnico de imagen; el informe sigue siendo del médico.
clinicalRules.rule.NON_PHYSICIAN_ULTRASOUND.approver=Radiólogo o director médico; ministerio
clinicalRules.rule.PRESCRIPTION_RENEWAL.title=Renovación de receta
clinicalRules.rule.PRESCRIPTION_RENEWAL.description=Solo un prescriptor autorizado aprueba una renovación: un médico para todas las listas, un enfermero o una matrona para los medicamentos no controlados, nunca un farmacéutico; los medicamentos controlados nunca se renuevan.
clinicalRules.rule.PRESCRIPTION_RENEWAL.approver=Colegio nacional de farmacéuticos o dirección del medicamento; jurista
clinicalRules.rule.DEFERRED_BILLING.title=Dispensación « a facturar »
clinicalRules.rule.DEFERRED_BILLING.description=Una dispensación sale sin pagar solo con cargo a una estancia abierta, una cobertura verificada por facturación, un crédito concedido por contabilidad o una excepción urgente del farmacéutico registrada y revisada después; nunca aprobada por quien la pidió o la entrega.
clinicalRules.rule.DEFERRED_BILLING.approver=Director de la clínica y responsable financiero
clinicalRules.rule.CONSULTATION_FEE.title=Una consulta por visita
clinicalRules.rule.CONSULTATION_FEE.description=Una consulta se factura una vez por visita en la que tuvo lugar; ninguna automáticamente en un ingreso programado, de hospital de día, de recién nacido, de parto o por traslado (ajuste por establecimiento, desactivado por defecto).
clinicalRules.rule.CONSULTATION_FEE.approver=Director de la clínica y responsable financiero
clinicalRules.rule.EMERGENCY_EPISODE_CONSULTATION.title=Una consulta por episodio de urgencia
clinicalRules.rule.EMERGENCY_EPISODE_CONSULTATION.description=Un ingreso de urgencia, urgente o en observación tras una visita a urgencias ya facturada el mismo día no recibe una segunda línea de consulta; un ingreso directo conserva la suya.
clinicalRules.rule.EMERGENCY_EPISODE_CONSULTATION.approver=Director de la clínica y responsable financiero
clinicalRules.rule.MATERNAL_EARLY_WARNING.title=Puntuación de alerta temprana materna (MEWS)
clinicalRules.rule.MATERNAL_EARLY_WARNING.description=El MEWS nacional (seis constantes, 0 a 12, cuatro niveles, preocupaciones adicionales) sustituye a NEWS2 durante el embarazo y en los 42 días posteriores a un parto.
clinicalRules.rule.MATERNAL_EARLY_WARNING.approver=Obstetra o matrona designados
clinicalRules.rule.MATERNAL_EWS_ESCALATION.title=Alerta temprana materna: escalado
clinicalRules.rule.MATERNAL_EWS_ESCALATION.description=En los niveles medio y alto, el médico sénior es el jefe del servicio de la estancia más los médicos de guardia; todos los médicos solo si no hay guardia.
clinicalRules.rule.MATERNAL_EWS_ESCALATION.approver=Obstetra o matrona designados, con el organigrama de la maternidad
clinicalRules.rule.CRADLE_SHOCK_INDEX.title=Complemento CRADLE: índice de choque
clinicalRules.rule.CRADLE_SHOCK_INDEX.description=Un índice de choque de 0,9 o más es amarillo, de 1,7 o más rojo; una tensión de 160/110 o más es roja; una alerta roja se atiende como el nivel alto.
clinicalRules.rule.CRADLE_SHOCK_INDEX.approver=Obstetra o matrona designados
clinicalRules.rule.LABOUR_ALERT_VALUES.title=Valores de alerta durante el parto
clinicalRules.rule.LABOUR_ALERT_VALUES.description=Durante el parto, los valores de alerta del pulso, la tensión y la temperatura de la Guía de atención del parto de la OMS.
clinicalRules.rule.LABOUR_ALERT_VALUES.approver=Obstetra o matrona designados
clinicalRules.rule.MEWS_PAGE_COOL_DOWN.title=Alerta temprana materna: intervalo entre avisos
clinicalRules.rule.MEWS_PAGE_COOL_DOWN.description=En los 30 minutos siguientes a un aviso, no se vuelve a avisar del mismo nivel o de uno inferior para esa paciente; un nivel superior siempre pasa y una alerta ROJA nunca se retiene.
clinicalRules.rule.MEWS_PAGE_COOL_DOWN.approver=Obstetra o matrona designados, con el organigrama de la maternidad
clinicalRules.rule.TAKE_HOME_ORDER_WINDOW.title=Receta de alta redactada tras el alta
clinicalRules.rule.TAKE_HOME_ORDER_WINDOW.description=Una receta de alta redactada en las 24 h posteriores al alta, antes de cualquier nuevo ingreso, se une al resumen de esa estancia; detenida o anulada, se retira mientras el resumen no esté finalizado.
clinicalRules.rule.TAKE_HOME_ORDER_WINDOW.approver=Jefe de servicio y responsable de calidad / informática
clinicalRules.rule.LAB_DUPLICATE_WINDOW.title=Ventana de alerta de duplicado en el laboratorio
clinicalRules.rule.LAB_DUPLICATE_WINDOW.description=Una solicitud activa de la misma prueba hecha en las últimas 24 h convierte una nueva en un posible duplicado: se avisa, nunca se bloquea.
clinicalRules.rule.LAB_DUPLICATE_WINDOW.approver=Director del laboratorio
