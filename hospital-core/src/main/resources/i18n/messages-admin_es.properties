# Track I (QA r65 D2500, D2501, D2764): código, moneda y zona horaria del hospital; código de activación entregado en mano.
hospital.code.invalid=El código del hospital tiene de 2 a 20 caracteres: mayúsculas, cifras y guiones, empezando y terminando por una letra o una cifra (por ejemplo TWP o CMT-01).
hospital.code.exists=El código {0} ya lo utiliza otro establecimiento.
