clinicalRules.sign.adminsOnly=Solo el administrador de este hospital (o el superadministrador que actúa por él) registra una validación.
clinicalRules.revoke.adminsOnly=Solo el administrador de este hospital (o el superadministrador que actúa por él) revoca una validación.
