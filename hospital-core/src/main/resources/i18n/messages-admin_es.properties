clinicalRules.signerNotAtHospital=El firmante elegido como usuario no es un miembro activo del personal de este hospital. Deje la cuenta vacía y escriba su nombre.
clinicalRules.alreadySigned=Este conjunto de reglas ya está validado en su versión actual. Revoque primero la validación para registrar otra.
clinicalRules.nothingToRevoke=Este conjunto de reglas no tiene ninguna validación que revocar en su versión actual.
