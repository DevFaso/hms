clinicalRules.pack.intro=Cada regla siguiente la aplica e-Keneya y sigue siendo « provisional » en este establecimiento hasta la firma del aprobador designado. La firma registra la decisión; no cambia el comportamiento de la regla. Para una regla modificada o rechazada, escriba la decisión: el equipo de la plataforma modifica la regla y la nueva versión se vuelve a someter.
