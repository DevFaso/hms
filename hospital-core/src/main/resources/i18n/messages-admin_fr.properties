# V356 : les ensembles de règles provisoires de ClinicalRuleRegistry (titre, description, approbateur).
clinicalRules.rule.BLOOD_EMERGENCY_RELEASE.title=Compatibilité sanguine et délivrance en urgence
clinicalRules.rule.BLOOD_EMERGENCY_RELEASE.description=Un circuit d’urgence distinct enregistre le clinicien responsable, l’urgence, le motif et les tests en attente ; une délivrance malgré une épreuve incompatible est autorisée par un médecin ou le directeur de laboratoire.
clinicalRules.rule.BLOOD_EMERGENCY_RELEASE.approver=Responsable de la transfusion
clinicalRules.rule.NEWBORN_VITALS.title=Constantes du nouveau-né
clinicalRules.rule.NEWBORN_VITALS.description=Les valeurs anormales du nouveau-né sont enregistrées, signalées et escaladées, jamais refusées ; chaque signe de danger postnatal de l’OMS (température supérieure à 37,5 °C, respiration au-dessus de 60/min, mauvaise alimentation, convulsions, tirage sous-costal sévère, absence de mouvement spontané) déclenche une alerte urgente.
clinicalRules.rule.NEWBORN_VITALS.approver=Responsable de néonatologie ou de pédiatrie et pharmacien
clinicalRules.rule.PARACETAMOL_LIMITS.title=Limites du paracétamol
clinicalRules.rule.PARACETAMOL_LIMITS.description=Adulte : 1 g par dose, 4 g par 24 h tous produits et toutes voies confondus, 4 h entre deux doses ; enfant à partir de 1 mois : 15 mg/kg par dose, 60 mg/kg/jour (10 et 40 avant 1 mois) ; un dépassement n’est signé qu’avec l’exception explicite du prescripteur. Lorsque le catalogue de l’établissement n’enregistre aucune limite pédiatrique pour le paracétamol seul, les limites de l’enfant s’appliquent par défaut à la voie orale, avec le dernier poids au dossier ; une dose conforme reste soumise à la revue de dose. Un poids de plus de 30 jours doit être confirmé (nouvelle pesée, revue de dose, ou exception explicite et motivée du prescripteur).
clinicalRules.rule.PARACETAMOL_LIMITS.approver=Responsable de néonatologie ou de pédiatrie et pharmacien
clinicalRules.rule.PAEDIATRIC_DOSE_LIMITS.title=Limites de dose pédiatriques et revue
clinicalRules.rule.PAEDIATRIC_DOSE_LIMITS.description=Les limites pédiatriques du catalogue de l’établissement s’appliquent par voie, tranche d’âge et poids ; avant 3 mois, le verdict en mg/kg est suspendu pour une revue, le plafond quotidien absolu restant contrôlé ; une voie absente donne « examen requis ».
clinicalRules.rule.PAEDIATRIC_DOSE_LIMITS.approver=Responsable de néonatologie ou de pédiatrie et pharmacien
clinicalRules.rule.AL_WHO_WEIGHT_BANDS.title=Artéméther-luméfantrine, enfant : tranches de poids OMS
clinicalRules.rule.AL_WHO_WEIGHT_BANDS.description=5 à moins de 15 kg 1 comprimé, 15 à moins de 25 kg 2, 25 à moins de 35 kg 3, 35 kg et plus 4 comprimés de 20/120 mg, 2 fois par jour pendant 3 jours, seulement si le catalogue n’a aucune limite pédiatrique ; tout autre dosage est mis en revue.
clinicalRules.rule.AL_WHO_WEIGHT_BANDS.approver=Pédiatre ou responsable de pédiatrie et pharmacien responsable
clinicalRules.rule.PERINATAL_CLASSIFICATION.title=Classification périnatale des décès
clinicalRules.rule.PERINATAL_CLASSIFICATION.description=Périnatal : de 22 semaines de gestation révolues aux jours 0 à 6 après la naissance ; néonatal : jours 0 à 27 ; un âge gestationnel manquant donne « informations insuffisantes » ; le décès lui-même est toujours enregistré.
clinicalRules.rule.PERINATAL_CLASSIFICATION.approver=Responsable d’obstétrique ou de néonatologie et autorité de codage
clinicalRules.rule.STILLBIRTH_COUNTING.title=Comptage des mortinaissances
clinicalRules.rule.STILLBIRTH_COUNTING.description=Un décès fœtal est compté selon l’indicateur OMS (28 semaines révolues), le chiffre périnatal et le niveau CIM (22 semaines) ; un âge gestationnel manquant donne une classification incomplète.
clinicalRules.rule.STILLBIRTH_COUNTING.approver=Responsable d’obstétrique et autorité de codage
clinicalRules.rule.STILLBIRTH_CORRECTION.title=Correction mort-né en né vivant
clinicalRules.rule.STILLBIRTH_CORRECTION.description=La correction est permise avec un motif obligatoire malgré un certificat de décès ; le conflit ouvre une tâche urgente de rapprochement et n’est compté qu’une fois, sans réactivation automatique du patient.
clinicalRules.rule.STILLBIRTH_CORRECTION.approver=Responsable d’obstétrique et autorité de codage
clinicalRules.rule.STILLBORN_NEONATAL_ALERTS.title=Alertes néonatales d’un mort-né
clinicalRules.rule.STILLBORN_NEONATAL_ALERTS.description=Les alertes d’Apgar et de prématurité ne sont pas levées pour un mort-né confirmé ; un conflit est signalé si l’issue est incertaine.
clinicalRules.rule.STILLBORN_NEONATAL_ALERTS.approver=Responsable d’obstétrique ou de néonatologie
clinicalRules.rule.DEATH_RECORD_DISPUTE.title=Contestation d’un dossier de décès
clinicalRules.rule.DEATH_RECORD_DISPUTE.description=Un médecin autorisé de l’hôpital traitant documente que le patient est vivant ; le dossier passe à « décès contesté », la déclaration d’origine est conservée, les blocages liés au décès sont levés dans le périmètre de soins autorisé et un examen administratif urgent est ouvert.
clinicalRules.rule.DEATH_RECORD_DISPUTE.approver=Responsable clinique
clinicalRules.rule.ORDER_REVIEW_HOLD.title=Prescriptions suspendues pendant une contestation
clinicalRules.rule.ORDER_REVIEW_HOLD.description=Les doses non commencées, les médicaments non délivrés et les demandes de sang en attente restent suspendus jusqu’à ce qu’un prescripteur autorisé les reconfirme, les remplace ou les arrête ; les perfusions en cours exigent une évaluation clinique immédiate.
clinicalRules.rule.ORDER_REVIEW_HOLD.approver=Responsable clinique
clinicalRules.rule.MIDWIFE_LABOUR_ADMISSION.title=Admission d’une femme en travail par une sage-femme
clinicalRules.rule.MIDWIFE_LABOUR_ADMISSION.description=Une sage-femme de l’hôpital admet une femme en travail, et aucun autre type d’admission ; un médecin admet tout type.
clinicalRules.rule.MIDWIFE_LABOUR_ADMISSION.approver=Responsable d’obstétrique
clinicalRules.rule.ALLERGY_OVERRIDE_REASON.title=Motif obligatoire pour signer malgré une alerte d’allergie
clinicalRules.rule.ALLERGY_OVERRIDE_REASON.description=Une prescription en conflit avec une allergie enregistrée n’est signée qu’avec le motif documenté du prescripteur, tracé dans l’audit.
clinicalRules.rule.ALLERGY_OVERRIDE_REASON.approver=Responsable clinique et pharmacien
clinicalRules.rule.ALLERGY_CONFLICT_REVIEW.title=Conflit allergique à l’administration et à la délivrance
clinicalRules.rule.ALLERGY_CONFLICT_REVIEW.description=Une allergie enregistrée après la signature arrête l’administration et la délivrance jusqu’à la revue d’un prescripteur habilité ; aucune voie d’urgence sans protocole approuvé.
clinicalRules.rule.ALLERGY_CONFLICT_REVIEW.approver=Responsable clinique et pharmacien
clinicalRules.rule.LABOUR_TRANSFER.title=Transfert d’un travail en cours entre hôpitaux
clinicalRules.rule.LABOUR_TRANSFER.description=Un travail en cours est confié à un autre hôpital avec une transmission, ou poursuivi là-bas sans transmission ; chaque hôpital garde son propre épisode, lié à l’autre, dont il lit le partogramme en lecture seule.
clinicalRules.rule.LABOUR_TRANSFER.approver=Responsable d’obstétrique
clinicalRules.rule.UNSIGNED_NOTE_WORKFLOW.title=Note clinique non signée à la clôture d’une visite
clinicalRules.rule.UNSIGNED_NOTE_WORKFLOW.description=La visite peut être clôturée ; la note est renvoyée à son auteur, un rappel suit après 24 h, la liste de l’administrateur après 72 h, et le résumé porte « non finalisé ».
clinicalRules.rule.UNSIGNED_NOTE_WORKFLOW.approver=Responsable clinique
clinicalRules.rule.SEVERE_HYPERTENSION_OBSTETRIC.title=Hypertension sévère pendant la grossesse et après la naissance
clinicalRules.rule.SEVERE_HYPERTENSION_OBSTETRIC.description=Une systolique de 160 mmHg ou plus, ou une diastolique de 110 ou plus, pendant la grossesse ou dans les 42 jours suivant un accouchement, déclenche une alerte URGENTE « avis obstétrical urgent requis » ; jamais bloquante.
clinicalRules.rule.SEVERE_HYPERTENSION_OBSTETRIC.approver=Responsable d’obstétrique
clinicalRules.rule.SEVERE_HYPERTENSION_ADULT.title=Hypertension sévère de l’adulte
clinicalRules.rule.SEVERE_HYPERTENSION_ADULT.description=Une systolique de 180 mmHg ou plus, ou une diastolique de 120 ou plus (18 ans et plus, ou une mère après le jour 42), déclenche un AVERTISSEMENT pour recontrôler au repos ; URGENT seulement avec un signe d’atteinte d’organe coché.
clinicalRules.rule.SEVERE_HYPERTENSION_ADULT.approver=Responsable clinique / médecine interne
clinicalRules.rule.MINOR_LABOUR_SAFEGUARDING.title=Admission en travail d’une mineure
clinicalRules.rule.MINOR_LABOUR_SAFEGUARDING.description=L’admission n’est jamais bloquée ; avant 13 ans à l’admission, une revue URGENTE de vigilance protection de l’enfance et une revue obstétricale senior sont ouvertes, visibles seulement par l’équipe soignante et les administrateurs de l’hôpital.
clinicalRules.rule.MINOR_LABOUR_SAFEGUARDING.approver=Responsable d’obstétrique et responsable de la protection de l’enfance
clinicalRules.rule.IMAGING_URGENT_PREAUTHORISATION.title=Imagerie urgente jamais bloquée par la préautorisation
clinicalRules.rule.IMAGING_URGENT_PREAUTHORISATION.description=Un examen URGENT ou STAT démarre sans son numéro de préautorisation, signalé « Préautorisation en attente » avec une tâche de facturation ; un examen de routine reste refusé sans numéro.
clinicalRules.rule.IMAGING_URGENT_PREAUTHORISATION.approver=Responsable de radiologie ; confirmation de la règle CNAMU
clinicalRules.rule.IMAGING_DUPLICATE_OVERRIDE.title=Motif pour « Commander quand même » en imagerie
clinicalRules.rule.IMAGING_DUPLICATE_OVERRIDE.description=Commander malgré l’alerte de doublon exige un motif d’une liste fixe (autre : note obligatoire), conservé sur la demande et dans la piste d’audit.
clinicalRules.rule.IMAGING_DUPLICATE_OVERRIDE.approver=Responsable de radiologie
clinicalRules.rule.SENSITIVE_CATEGORIES.title=Catégories sensibles masquées à l’accès famille
clinicalRules.rule.SENSITIVE_CATEGORIES.description=VIH, IST, hépatites B/C, grossesse, contraception/IVG, violences, santé mentale, addictologie, tests génétiques et drépanocytose de l’adulte sont masqués aux proches ; la tuberculose est en accès restreint.
clinicalRules.rule.SENSITIVE_CATEGORIES.approver=Juriste burkinabè et clinicien
clinicalRules.rule.MINOR_HIV_RESULT_RELEASE.title=Résultat VIH d’un mineur communiqué à un parent
clinicalRules.rule.MINOR_HIV_RESULT_RELEASE.description=Masqué jusqu’à ce qu’un médecin ou une sage-femme qui prend en charge le patient le communique à un parent ou tuteur vérifié, avec un motif, tracé ; seul un résultat VIH est communicable, un résultat lié à des violences jamais.
clinicalRules.rule.MINOR_HIV_RESULT_RELEASE.approver=Juriste burkinabè
clinicalRules.rule.ADOLESCENT_CONFIDENTIALITY_AGE.title=Âge de confidentialité des adolescents
clinicalRules.rule.ADOLESCENT_CONFIDENTIALITY_AGE.description=À partir de 12 ans (réglable par établissement, 0 à 18), les dossiers sensibles d’un mineur sont masqués aux parents sauf communication par un clinicien.
clinicalRules.rule.ADOLESCENT_CONFIDENTIALITY_AGE.approver=Juriste burkinabè
clinicalRules.rule.RECOMMENDED_SENSITIVE_LAB_TESTS.title=Liste recommandée des examens sensibles
clinicalRules.rule.RECOMMENDED_SENSITIVE_LAB_TESTS.description=La correspondance établie entre les examens du catalogue et les catégories sensibles, que le directeur de laboratoire peut appliquer au catalogue.
clinicalRules.rule.RECOMMENDED_SENSITIVE_LAB_TESTS.approver=Directeur de laboratoire ou directeur médical
clinicalRules.rule.MIDWIFE_NEWBORN_CARE.title=Sage-femme et nouveau-né
clinicalRules.rule.MIDWIFE_NEWBORN_CARE.description=Une sage-femme admet le nouveau-né d’un accouchement auquel elle a participé, jusqu’à 28 jours de vie, et en est la clinicienne responsable ; elle attribue les lits et berceaux de maternité ; un berceau de néonatologie qu’elle attribue crée une tâche urgente pour les médecins.
clinicalRules.rule.MIDWIFE_NEWBORN_CARE.approver=Obstétricien ou sage-femme désigné, avec l’organigramme de la maternité
clinicalRules.rule.IMAGING_TECHNICIAN_SCOPE.title=Technicien d’imagerie
clinicalRules.rule.IMAGING_TECHNICIAN_SCOPE.description=Le technicien accueille le patient, démarre, termine ou interrompt l’examen avec un motif, et enregistre le contraste, la dose et les images clés ; jamais de prescription, de compte rendu ni de signature.
clinicalRules.rule.IMAGING_TECHNICIAN_SCOPE.approver=Radiologue ou directeur médical de l’établissement
clinicalRules.rule.NON_PHYSICIAN_ULTRASOUND.title=Échographie par un non-médecin
clinicalRules.rule.NON_PHYSICIAN_ULTRASOUND.description=Par défaut, seuls les médecins réalisent une échographie ; un établissement peut la confier à son technicien d’imagerie ; le compte rendu reste au médecin.
clinicalRules.rule.NON_PHYSICIAN_ULTRASOUND.approver=Radiologue ou directeur médical ; ministère
clinicalRules.rule.PRESCRIPTION_RENEWAL.title=Renouvellement d’ordonnance
clinicalRules.rule.PRESCRIPTION_RENEWAL.description=Seul un prescripteur autorisé approuve un renouvellement : un médecin pour toutes les listes, un infirmier ou une sage-femme pour les médicaments non contrôlés, jamais un pharmacien ; les médicaments contrôlés ne sont jamais renouvelés. Une demande de renouvellement est annoncée à son seul prescripteur (ou, s’il n’est plus actif ou ne peut plus renouveler dans cet établissement, au chef de son service, qui y répond à sa place), et l’annonce ne nomme jamais le médicament.
clinicalRules.rule.PRESCRIPTION_RENEWAL.approver=Ordre national des pharmaciens ou direction du médicament ; juriste
clinicalRules.rule.DEFERRED_BILLING.title=Délivrance « à facturer »
clinicalRules.rule.DEFERRED_BILLING.description=Une délivrance ne sort non payée que sur le compte d’un séjour ouvert, une prise en charge vérifiée par la facturation, un crédit accordé par la comptabilité ou une dérogation d’urgence du pharmacien journalisée et revue ensuite ; jamais approuvée par qui a demandé ou remet.
clinicalRules.rule.DEFERRED_BILLING.approver=Directeur de la clinique et responsable financier
clinicalRules.rule.CONSULTATION_FEE.title=Une consultation par visite
clinicalRules.rule.CONSULTATION_FEE.description=Une consultation est facturée une fois par visite où elle a eu lieu ; aucune automatiquement sur une admission programmée, en hôpital de jour, d’un nouveau-né, en travail ou par transfert (réglage par établissement, désactivé par défaut).
clinicalRules.rule.CONSULTATION_FEE.approver=Directeur de la clinique et responsable financier
clinicalRules.rule.EMERGENCY_EPISODE_CONSULTATION.title=Une consultation par épisode d’urgence
clinicalRules.rule.EMERGENCY_EPISODE_CONSULTATION.description=Une admission en urgence, urgente ou en observation qui suit un passage aux urgences déjà facturé le même jour ne reçoit pas de seconde ligne de consultation ; une admission directe garde la sienne.
clinicalRules.rule.EMERGENCY_EPISODE_CONSULTATION.approver=Directeur de la clinique et responsable financier
clinicalRules.rule.MATERNAL_EARLY_WARNING.title=Score d’alerte précoce maternelle (MEWS)
clinicalRules.rule.MATERNAL_EARLY_WARNING.description=Le MEWS national (six constantes, 0 à 12, quatre niveaux, préoccupations supplémentaires) remplace NEWS2 pendant la grossesse et dans les 42 jours suivant un accouchement.
clinicalRules.rule.MATERNAL_EARLY_WARNING.approver=Obstétricien ou sage-femme désigné
clinicalRules.rule.MATERNAL_EWS_ESCALATION.title=Alerte précoce maternelle : escalade
clinicalRules.rule.MATERNAL_EWS_ESCALATION.description=Aux niveaux moyen et élevé, le médecin senior est le chef du service du séjour plus les médecins de garde ; tous les médecins seulement en l’absence de garde. Un appel au niveau moyen, au niveau élevé ou pour une alerte rouge est aussi déposé comme alerte urgente à acquitter (un élément critique dans la boîte de réception des médecins et sages-femmes de garde, avec rappels jusqu’à ce qu’une autre personne que celle qui a saisi les constantes l’acquitte) ; l’appel de niveau faible à moyen reste une notification.
clinicalRules.rule.MATERNAL_EWS_ESCALATION.approver=Obstétricien ou sage-femme désigné, avec l’organigramme de la maternité
clinicalRules.rule.CRADLE_SHOCK_INDEX.title=Complément CRADLE : indice de choc
clinicalRules.rule.CRADLE_SHOCK_INDEX.description=Un indice de choc de 0,9 ou plus est jaune, de 1,7 ou plus rouge ; une tension de 160/110 ou plus est rouge ; une alerte rouge est traitée comme le niveau élevé.
clinicalRules.rule.CRADLE_SHOCK_INDEX.approver=Obstétricien ou sage-femme désigné
clinicalRules.rule.LABOUR_ALERT_VALUES.title=Valeurs d’alerte pendant le travail
clinicalRules.rule.LABOUR_ALERT_VALUES.description=Pendant le travail, les valeurs d’alerte du pouls, de la tension et de la température du Guide OMS de soins du travail.
clinicalRules.rule.LABOUR_ALERT_VALUES.approver=Obstétricien ou sage-femme désigné
clinicalRules.rule.MEWS_PAGE_COOL_DOWN.title=Alerte précoce maternelle : délai entre deux appels
clinicalRules.rule.MEWS_PAGE_COOL_DOWN.description=Dans les 30 minutes qui suivent un appel, un appel de même niveau ou de niveau inférieur n’est pas renvoyé pour cette patiente ; un niveau supérieur passe toujours, une alerte ROUGE n’est jamais retenue.
clinicalRules.rule.MEWS_PAGE_COOL_DOWN.approver=Obstétricien ou sage-femme désigné, avec l’organigramme de la maternité
clinicalRules.rule.TAKE_HOME_ORDER_WINDOW.title=Ordonnance de sortie rédigée après la sortie
clinicalRules.rule.TAKE_HOME_ORDER_WINDOW.description=Une ordonnance de sortie rédigée dans les 24 h après la sortie, avant toute nouvelle admission, rejoint le résumé de ce séjour ; arrêtée ou annulée, elle en est retirée tant que le résumé n’est pas finalisé.
clinicalRules.rule.TAKE_HOME_ORDER_WINDOW.approver=Médecin chef de service et responsable qualité / DSI
clinicalRules.rule.LAB_DUPLICATE_WINDOW.title=Fenêtre d’alerte de doublon au laboratoire
clinicalRules.rule.LAB_DUPLICATE_WINDOW.description=Une demande active du même examen passée dans les dernières 24 h fait d’une nouvelle demande un doublon possible : avertie, jamais bloquée.
clinicalRules.rule.LAB_DUPLICATE_WINDOW.approver=Directeur de laboratoire
