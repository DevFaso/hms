clinicalRules.rule.OBSTETRIC_ELIGIBILITY.title=Dossiers obstétricaux : éligibilité (sexe, âge), jamais refusés en urgence
clinicalRules.rule.OBSTETRIC_ELIGIBILITY.description=Un dossier obstétrical est refusé pour un patient enregistré de sexe masculin ou hors de l’âge obstétrical ; un sexe ou une date de naissance inconnus ne refusent rien, et une échographie URGENTE ou STAT ou un adressage urgent en gynécologie-obstétrique ne sont jamais refusés (ils sont signalés pour revue et tracés).
clinicalRules.rule.OBSTETRIC_ELIGIBILITY.approver=Responsable d’obstétrique
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.title=Fréquences en heures fixes sur le plan d’administration
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.description=Une fréquence écrite en heures (« 7 h 13 h 19 h », « à 9 h ») est donnée à ces heures de la journée, jamais répartie à intervalles égaux depuis la signature de la prescription.
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.approver=Responsable clinique et cadre infirmier
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.title=Comptes rendus d’échographie signés avant l’obligation des constatations
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.description=Un compte rendu signé et revu avant que les constatations soient obligatoires peut encore être marqué comme communiqué au patient ; tout autre compte rendu exige d’abord ses constatations.
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.approver=Radiologue ou directeur médical
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.title=Correction d’un tarif le jour même
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.description=Un tarif saisi aujourd’hui et en vigueur depuis aujourd’hui peut être corrigé le jour même, sauf si une ligne de facture l’a déjà utilisé.
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.approver=Directeur de la clinique et responsable financier
clinicalRules.read.staffOnly=Les règles cliniques d’un établissement sont lues par son propre personnel, dans un rôle détenu dans cet établissement.
clinicalRules.impersonation.signoff=Une session de support ne peut pas enregistrer ni révoquer la validation d’une règle clinique au nom de cet utilisateur.
clinicalRules.rule.PREGNANCY_REVEALING_IMAGING.title=Imagerie pouvant révéler une grossesse (accès des proches)
clinicalRules.rule.PREGNANCY_REVEALING_IMAGING.description=Un proche ne voit jamais un examen d’imagerie pouvant révéler une grossesse : un examen du catalogue marqué par l’administrateur de l’établissement ou un radiologue ; un examen obstétrical, pelvien ou gynécologique, reconnu à son nom, sa région et sa question clinique, ou au compte rendu diffusé et aux légendes d’images que le proche lirait ; et, tant que l’examen du catalogue n’est pas explicitement déclaré sans risque (la déclaration ne vaut que pour les demandes qui portent encore le nom actuel de l’examen), toute échographie, tout examen abdominal ou pelvien et tout examen qui ne dit pas de quelle partie du corps il s’agit, pour une personne non enregistrée de sexe masculin, âgée de 10 à 55 ans ou d’âge inconnu ou invraisemblable (sauf pour le parent ou tuteur vérifié d’un enfant sous l’âge de confidentialité). La facture d’un tel examen est masquée aussi ; la mammographie reste visible ; le patient voit tous ses examens.
clinicalRules.rule.PREGNANCY_REVEALING_IMAGING.approver=Radiologue ou responsable médical, avec le responsable de la confidentialité
clinicalRules.rule.PREGNANCY_REVEALING_IMAGING.source=Décision de la plateforme du 21/11/2026, révisée le 22/11/2026, après les règles des catégories sensibles (la grossesse est une catégorie sensible) ; tranche d’âge élargie à partir de la définition OMS des femmes en âge de procréer (15-49 ans) et du taux de natalité des adolescentes de l’OMS, qui compte les filles de 10 à 14 ans
assignment.patientInvitation.notFound=Aucune invitation au portail en attente pour ce patient dans votre établissement.
assignment.codeActivation.tooManyAttempts=Trop de codes incorrects. Si ce code était le vôtre, il n’est plus valable : demandez-en un nouveau à la personne qui vous a inscrit, ou réessayez dans {0} minutes.
assignment.patientInvitation.resendTooSoon=L’activation a été envoyée il y a moins de {0} minutes. Patientez avant de la renvoyer, ou affichez le code.
clinicalRules.rule.TRANSFUSION_POSITIVE_ANTIBODY_SCREEN.title=RAI positive : patients allo-immunisés et globules rouges
clinicalRules.rule.TRANSFUSION_POSITIVE_ANTIBODY_SCREEN.description=Une RAI positive rend le patient allo-immunisé définitivement : seul le biologiste enregistre l’anticorps, et une RAI négative ultérieure ne lève jamais l’alerte. Les globules rouges hors urgence vitale (demandes urgentes comprises) sont retenus tant que l’anticorps n’est pas identifié, ou que le biologiste n’a pas enregistré l’adressage au CNTS/CRTS avec le motif pour servir cette demande, et tant qu’une épreuve de compatibilité en test indirect à l’antiglobuline, compatible, sur un prélèvement de 72 heures au plus, n’est pas enregistrée sur une poche attestée antigène-négative et respectant le phénotype RH-KEL1 ; personne ne passe outre, pas même un super-administrateur. En urgence vitale (UVI ou UV, jamais une urgence relative), le prescripteur déclare le niveau, le motif et que le prélèvement est fait avant la première poche ; du groupe O est alors délivré selon la règle d’urgence, le biologiste reçoit la tâche de l’épreuve a posteriori, l’avertissement d’hémolyse est affiché et le contrôle au lit du malade reste obligatoire. Chaque RAI positive sollicite de nouveau le biologiste : une identification antérieure à une RAI positive plus récente ne la couvre pas (il peut s’agir d’un nouvel anticorps), et les globules rouges hors urgence vitale sont retenus tant que le biologiste n’a pas enregistré l’identification, ou un adressage, depuis cette RAI. Une demande en urgence vitale servie sur une épreuve de compatibilité non « compatibilisée » donne lieu de la même façon à l’épreuve a posteriori. L’alerte suit le patient dans tous les établissements de la plateforme, quel que soit son choix de partage du dossier : un anticorps peut devenir indétectable, et une RAI négative ultérieure, ici ou dans un autre établissement, ne lève rien. Un autre établissement voit seulement qu’une RAI positive ou un anticorps identifié est au dossier, l’anticorps, la date et le nom de l’établissement qui le détient, et uniquement sur les écrans de transfusion (laboratoire, demande, épreuve de compatibilité, délivrance, administration) ; chaque consultation est tracée et figure dans « Qui a consulté mon dossier ». Provisoire : ce partage exige une validation clinique et juridique (base légale au regard de la loi 001-2021/AN du Burkina Faso sur les données personnelles à confirmer).
clinicalRules.rule.TRANSFUSION_POSITIVE_ANTIBODY_SCREEN.source=HAS 2014 (Transfusion de globules rouges homologues, argumentaire : « compatibilisé » obligatoire en cas de RAI positive ou d’antécédent ; RAI valable 72 h, RAI positive jamais prolongée) ; ARS Centre-Val de Loire 2022 (UVI/UV : « ne pas retarder la transfusion même si RAI positives », épreuve a posteriori) ; BSH, recommandations de compatibilité pré-transfusionnelle (épreuve à l’antiglobuline, exclusion définitive de la délivrance électronique) ; Australian Red Cross Lifeblood ; Société canadienne du sang ; North Bristol NHS Trust (délivrance urgente en présence d’anticorps) ; SHOT (erreurs informatiques) — tels que cités dans le rapport de recherche « Transfusion and critical result cover » (2026-11-22), section 1. Aucun texte burkinabè n’a été trouvé : les règles françaises sont appliquées par inférence. Partage entre établissements : SNBTS NATP CLIN 004 (poches antigène-négatives lorsqu’un anticorps déjà identifié n’est plus détectable) ; arrêté du 15 mai 2018 (résultats antérieurs de RAI sur le compte rendu) ; Tormey & Hendrickson, Blood 2019 (évanescence : environ la moitié indétectable à 6 mois) ; exposé des motifs néerlandais Kamerstuk 37 055 nr. 3 (TRIX, registre national, enregistrement sans consentement préalable) — tels que cités dans la note de recherche « antibody history sharing » (2026-11-22). Aucune règle du Burkina Faso ou de la CEDEAO sur le partage des données d’anticorps n’a été trouvée.
clinicalRules.rule.TRANSFUSION_POSITIVE_ANTIBODY_SCREEN.approver=Biologiste ou médecin responsable de la transfusion (avec l’accord d’adressage CNTS/CRTS) ; un conseiller en protection des données pour le partage entre établissements
clinicalRules.rule.CRITICAL_RESULT_ESCALATION.title=Résultats de laboratoire critiques : escalade jusqu’à l’accusé de réception d’un clinicien
clinicalRules.rule.CRITICAL_RESULT_ESCALATION.description=Un résultat critique validé est signalé aussitôt au prescripteur et à l’infirmier responsable ; un prescripteur déclaré absent est sauté et la couverture prévenue aussitôt. Sans accusé de réception après 15 minutes : le médecin de couverture (garde, sinon les médecins en poste, sinon tous les médecins de l’établissement), le prescripteur restant en copie. Après 30 minutes : le médecin-chef et le biologiste responsable. Après 60 minutes : « résultat critique non résolu », une alerte finale à toute la chaîne et un enregistrement d’incident ; les rappels continuent ensuite, en s’espaçant jusqu’à un par jour, sans plafond de tours. Seul l’accusé de réception d’un clinicien (valeur relue ; nom, rôle, heure et canal enregistrés) y met fin. Les administrateurs de l’établissement ne reçoivent aucune valeur : seulement le signalement qu’un incident est ouvert. Pour un patient externe, le médecin qui accuse réception décide s’il faut contacter le patient ; un résultat n’est jamais envoyé automatiquement par SMS à un patient. Les minutes sont réglées par établissement. Les SMS d’une étape partent une fois l’étape enregistrée, jamais avant. Un résultat déjà en attente à l’activation de cette règle est relancé dans l’application seulement : aucun SMS n’est envoyé à son sujet. Un incident se clôt aussi, sans nom de clinicien, lorsque le résultat est modifié ou n’est plus critique ; un résultat modifié en une autre valeur critique repart de la première étape.
clinicalRules.rule.CRITICAL_RESULT_ESCALATION.source=ISO 15189:2022 §7.4.1.3 (procédure d’escalade lorsqu’un responsable ne peut être joint, selon la formation European Accreditation) ; RCPath G158 (2026 : résultats de catégorie A sous 2 heures, jamais un simple courriel, nom et fonction de la personne qui reçoit le résultat) ; The Joint Commission NPSG.02.03.01 (2024) ; OMS LQSI (« continue d’essayer de joindre le clinicien jusqu’à ce que le contact soit établi ») ; SFBC 2016 (résultats urgents, 60 minutes) ; Guarner et al., AJCP 2025, procédures Asante et ChristianaCare (passage de relais en 15 à 45 minutes) ; revue CDC LMBP ; Davids et al., Afr J Lab Med 2024 (Tygerberg) — tels que cités dans le rapport de recherche « Transfusion and critical result cover » (2026-11-22), section 2. Aucune norme ne fixe les minutes : 15, 30 et 60 sont la recommandation du rapport.
clinicalRules.rule.CRITICAL_RESULT_ESCALATION.approver=Médecin-chef et biologiste responsable
clinicalRules.rule.DISPENSED_PRODUCT_SUBSTITUTION.title=Délivrance : le produit délivré est celui prescrit, ou un substitut de même principe actif et même dosage
clinicalRules.rule.DISPENSED_PRODUCT_SUBSTITUTION.description=Chaque délivrance prend son produit du lot choisi (jamais du texte envoyé par l’écran) et le compare à l’ordonnance. L’article du catalogue de l’ordonnance, ou un autre article de même principe actif, même dosage et même forme, est délivré comme prescrit et enregistré sous son propre nom. Pour une ordonnance saisie en texte libre : la molécule qu’elle nomme, au dosage qu’elle indique (tout dosage si elle n’en indique aucun). Le même principe actif au même dosage sous une autre forme (comprimés pour gélules) n’est délivré que comme substitution enregistrée, avec son motif : une unité pour une unité prescrite. Un autre dosage, ou un dosage que le catalogue n’enregistre pas, est refusé même en substitution, car les délivrances se comptent en unités prescrites (10 comprimés de 200 mg clôtureraient une ordonnance de 10 × 400 mg à la moitié de la dose) : le prescripteur modifie l’ordonnance. Un autre principe actif est toujours refusé. Un substitut est relu contre les allergies actuelles du patient et ne passe que si le prescripteur a déjà maintenu l’ordonnance malgré cette même allergie. Le dossier, le prix, la file, la fiche de remise, la ligne de paiement et l’avis au prescripteur nomment le produit délivré.
clinicalRules.rule.DISPENSED_PRODUCT_SUBSTITUTION.source=Décision de la plateforme après la recette r77 (D3940) : le catalogue ne porte aucun lien d’équivalence, un substitut est donc limité au même principe actif (code ATC, sinon nom générique) au même dosage. Pratique de substitution générique à confirmer par le pharmacien de l’établissement.
clinicalRules.rule.DISPENSED_PRODUCT_SUBSTITUTION.approver=Pharmacien responsable
