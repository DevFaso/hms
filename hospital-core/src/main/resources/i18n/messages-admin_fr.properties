# Affectations
# QA D941: role descriptions and onboarding checklists in the reader's language.
role.description.ROLE_SUPER_ADMIN=Super administrateur de la plateforme, avec accès complet à toutes les organisations, à tous les établissements et aux paramètres du système
role.description.ROLE_HOSPITAL_ADMIN=Administrateur de l’établissement, chargé du personnel, des services, de la facturation et de la configuration de l’établissement
role.description.ROLE_DOCTOR=Médecin habilité à poser un diagnostic, prescrire, demander des examens et conduire le traitement des patients
role.description.ROLE_NURSE=Infirmier ou infirmière diplômé(e) qui dispense les soins, administre les médicaments et relève les constantes
role.description.ROLE_PHYSICIAN=Médecin généraliste habilité à consulter et à traiter les patients
role.description.ROLE_MIDWIFE=Sage-femme diplômée : suivi de la grossesse, accompagnement de l’accouchement et examen du nouveau-né
role.description.ROLE_ANESTHESIOLOGIST=Médecin anesthésiste : consultation préopératoire, sédation et prise en charge de la douleur
role.description.ROLE_LAB_SCIENTIST=Biologiste chargé(e) du traitement des prélèvements, de la réalisation des analyses et de la publication des résultats
role.description.ROLE_LAB_TECHNICIAN=Technicien(ne) de laboratoire : prélèvement, réception, traitement des échantillons et saisie des résultats préliminaires
role.description.ROLE_LAB_MANAGER=Responsable du laboratoire : organisation du travail, validation des résultats, contrôle qualité et fonctionnement du laboratoire
role.description.ROLE_PHARMACIST=Pharmacien(ne) diplômé(e) : dispensation des médicaments, contrôle des interactions et gestion des stocks
role.description.ROLE_RECEPTIONIST=Agent d’accueil : enregistrement des patients, rendez-vous et orientation des visiteurs
role.description.ROLE_ADMIN=Utilisateur administratif disposant de droits de gestion étendus
role.description.ROLE_PATIENT=Patient inscrit, qui consulte lui-même son dossier médical, ses rendez-vous et ses ordonnances
role.description.ROLE_ACCOUNTANT=Comptable : écritures, suivi des dépenses et rapprochements financiers
role.description.ROLE_RADIOLOGIST=Radiologue : interprétation des radiographies, scanners et IRM, et rédaction des comptes rendus
role.description.ROLE_SURGEON=Chirurgien(ne) : interventions, planification opératoire et suivi postopératoire
role.description.ROLE_BILLING_SPECIALIST=Spécialiste de la facturation : factures, demandes de remboursement, encaissements et rapports financiers
role.description.ROLE_PHYSIOTHERAPIST=Kinésithérapeute : programmes de rééducation, séances et bilans de mobilité
role.description.ROLE_STAFF=Personnel de soutien de l’établissement, qui voit les plannings et les rendez-vous
role.description.ROLE_PHARMACY_VERIFIER=Vérificateur en pharmacie : double contrôle des dispensations et orientation des stocks
role.description.ROLE_CLAIMS_REVIEWER=Contrôleur des demandes de remboursement : instruction des demandes d’assurance et des litiges de facturation
