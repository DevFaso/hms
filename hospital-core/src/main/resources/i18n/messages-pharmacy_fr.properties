# QA D887: the seeded drug-interaction texts (V63, V120) in every language. The English line IS the seeded text: a row an admin has since edited no longer matches it and is shown as typed.
ddi.seed.11289.1191.description=Warfarine + aspirine : risque hémorragique additif.
ddi.seed.11289.1191.recommendation=À éviter sauf indication documentée (p. ex. stent coronaire) ; surveiller l''INR chaque semaine et renforcer les conseils de prévention des saignements.
ddi.seed.11289.5640.description=Warfarine + AINS : risque accru d''hémorragie digestive et variabilité de l''INR.
ddi.seed.11289.5640.recommendation=Préférer le paracétamol ; si un AINS est nécessaire, se limiter à une cure courte sous couverture par IPP.
ddi.seed.2551.36567.description=Simvastatine + clarithromycine : l''inhibition du CYP3A4 augmente le risque de rhabdomyolyse.
ddi.seed.2551.36567.recommendation=Changer de macrolide (azithromycine) ou suspendre la statine pendant l''antibiothérapie.
ddi.seed.10689.4493.description=Fluoxétine + tramadol : risque de syndrome sérotoninergique et abaissement du seuil épileptogène.
ddi.seed.10689.4493.recommendation=Choisir un antalgique sans interaction avec l''ISRS ; si les deux sont nécessaires, surveiller l''état mental et éviter les doses maximales.
ddi.seed.10180.6851.description=Méthotrexate + cotrimoxazole : myélosuppression profonde.
ddi.seed.10180.6851.recommendation=Utiliser un autre antibiotique (amoxicilline / céfuroxime) chez le patient traité par méthotrexate.
ddi.seed.29046.8588.description=Lisinopril + supplément potassique : risque d''hyperkaliémie.
ddi.seed.29046.8588.recommendation=Contrôler la kaliémie avant de débuter ; éviter l''association si K+ > 4,5 mmol/L.
ddi.seed.3407.703.description=Digoxine + amiodarone : l''amiodarone double environ la digoxinémie.
ddi.seed.3407.703.recommendation=Réduire de moitié la dose de digoxine à l''instauration et contrôler la digoxinémie à J7.
ddi.seed.36437.8123.description=IMAO + ISRS : crise hypertensive et syndrome sérotoninergique.
ddi.seed.36437.8123.recommendation=Respecter une fenêtre thérapeutique de 14 jours lors du passage d''une classe à l''autre.
ddi.seed.5933.6809.description=Metformine + produit de contraste iodé : risque d''acidose lactique en cas d''insuffisance rénale.
ddi.seed.5933.6809.recommendation=Suspendre la metformine dès le jour de l''injection et la reprendre après 48 h, après contrôle de la fonction rénale.
ddi.seed.29046.9997.description=Spironolactone + IEC : risque d''hyperkaliémie.
ddi.seed.29046.9997.recommendation=Surveiller la kaliémie à la première semaine et après chaque adaptation de dose.
ddi.seed.10355.309394.description=Théophylline + ciprofloxacine : la ciprofloxacine double la théophyllinémie (toxicité, convulsions).
ddi.seed.10355.309394.recommendation=Utiliser la lévofloxacine ou la moxifloxacine si une fluoroquinolone est nécessaire.
ddi.seed.6851.8331.description=Pénicilline V + méthotrexate : les pénicillines réduisent la clairance du méthotrexate.
ddi.seed.6851.8331.recommendation=Renforcer la surveillance de la toxicité du méthotrexate (NFS, bilan hépatique) pendant l''antibiothérapie.
ddi.seed.11289.4450.description=Le fluconazole inhibe le CYP2C9 : l''effet de la warfarine augmente fortement, souvent en 2 à 3 jours.
ddi.seed.11289.4450.recommendation=Recontrôler l''INR à 3 jours et anticiper une réduction de la dose de warfarine.
ddi.seed.10829.11289.description=Cotrimoxazole + warfarine : inhibition du CYP2C9 et perte de la vitamine K d''origine intestinale ; de fortes hausses de l''INR sont rapportées.
ddi.seed.10829.11289.recommendation=Préférer un autre antibiotique. En cas d''utilisation, recontrôler l''INR dans les 3 jours.
ddi.seed.2551.6902.description=Allongement additif du QT, avec une inhibition du CYP3A4 qui élève les concentrations de méthadone.
ddi.seed.2551.6902.recommendation=ECG avant et pendant le traitement ; envisager l''azithromycine, qui agit moins sur le CYP3A4.
ddi.seed.2551.733.description=Deux médicaments allongeant le QT associés : risque de torsades de pointes.
ddi.seed.2551.733.recommendation=Éviter l''association ; si elle est inévitable, surveiller l''ECG et les électrolytes.
ddi.seed.11289.733.description=L''amiodarone inhibe le métabolisme de la warfarine ; l''effet s''installe sur plusieurs semaines et persiste après l''arrêt.
ddi.seed.11289.733.recommendation=Réduire la dose de warfarine d''environ un tiers et surveiller l''INR chaque semaine pendant 6 semaines.
ddi.seed.3355.9384.description=La rifampicine induit le CYP3A4 et annule l''efficacité de la contraception hormonale.
ddi.seed.3355.9384.recommendation=Utiliser une méthode non hormonale (DIU au cuivre) pendant le traitement et 28 jours après.
ddi.seed.11289.9384.description=L''induction par la rifampicine peut réduire de moitié l''effet de la warfarine ; l''INR baisse et le risque de thrombose augmente.
ddi.seed.11289.9384.recommendation=Prévoir une augmentation importante de la dose et surveiller l''INR chaque semaine pendant et après le traitement.
ddi.seed.10582.9384.description=La rifampicine accélère l''élimination de la lévothyroxine ; les symptômes d''hypothyroïdie réapparaissent.
ddi.seed.10582.9384.recommendation=Recontrôler la TSH 4 à 6 semaines après le début ou l''arrêt de la rifampicine.
ddi.seed.35617.9384.description=La rifampicine abaisse les concentrations de névirapine, avec un risque d''échec virologique et de résistance.
ddi.seed.35617.9384.recommendation=Utiliser un traitement antirétroviral à base d''éfavirenz pendant un traitement antituberculeux contenant de la rifampicine.
ddi.seed.29046.6809.description=L''IEC peut renforcer l''effet hypoglycémiant et, en cas d''insuffisance rénale aiguë, augmente le risque d''acidose lactique.
ddi.seed.29046.6809.recommendation=Suspendre la metformine en cas de maladie intercurrente avec déshydratation ; contrôler la fonction rénale.
ddi.seed.10689.36437.description=ISRS + tramadol : syndrome sérotoninergique, et le tramadol abaisse le seuil épileptogène.
ddi.seed.10689.36437.recommendation=Préférer un antalgique non sérotoninergique ; en cas d''association, informer le patient des signes du syndrome sérotoninergique.
ddi.seed.1191.36437.description=Les ISRS altèrent l''agrégation plaquettaire ; associés à l''aspirine, ils doublent environ le risque d''hémorragie digestive.
ddi.seed.1191.36437.recommendation=Envisager une gastroprotection, surtout après 65 ans ou en cas d''antécédent d''hémorragie digestive.
ddi.seed.8591.9997.description=Diurétique épargneur de potassium et supplément potassique : hyperkaliémie dangereuse.
ddi.seed.8591.9997.recommendation=Éviter la supplémentation systématique ; si les deux sont indispensables, contrôler la kaliémie dans la semaine.
ddi.seed.4109.6835.description=L''hypokaliémie due au diurétique de l''anse potentialise la toxicité de la digoxine, même à digoxinémie normale.
ddi.seed.4109.6835.recommendation=Surveiller K+ et Mg2+ ; les corriger avant d''attribuer les symptômes à la dose de digoxine.
ddi.seed.6835.733.description=L''amiodarone double environ la concentration de digoxine.
ddi.seed.6835.733.recommendation=Réduire de moitié la dose de digoxine à l''introduction de l''amiodarone et contrôler la digoxinémie.
ddi.seed.36567.4450.description=L''inhibition du CYP3A4 par l''azolé élève les concentrations de statine et le risque de myopathie.
ddi.seed.36567.4450.recommendation=Suspendre la statine pendant les traitements antifongiques courts.
ddi.seed.6058.6835.description=La quinine augmente la concentration plasmatique de digoxine.
ddi.seed.6058.6835.recommendation=Réduire la dose de digoxine et surveiller la toxicité pendant le traitement par quinine.
