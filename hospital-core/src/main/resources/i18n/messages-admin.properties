clinicalRules.rule.OBSTETRIC_ELIGIBILITY.source=Clinical safety choice of the platform
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.source=Operational choice of the platform
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.source=Operational choice of the platform
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.source=Platform owner’s decision, 16 November 2026
clinicalRules.rule.OBSTETRIC_ELIGIBILITY.title=Obstetric records: sex and age eligibility, never refused in an emergency
clinicalRules.rule.OBSTETRIC_ELIGIBILITY.description=An obstetric record is refused for a patient recorded as male or outside the obstetric age; an unknown sex or birth date refuses nothing, and an URGENT or STAT ultrasound or an urgent OB/GYN referral is never refused (it is flagged for review and audited).
clinicalRules.rule.OBSTETRIC_ELIGIBILITY.approver=Obstetric lead
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.title=Clock-time frequencies on the medication chart
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.description=A frequency written as clock times (« 7 h 13 h 19 h », « à 9 h ») is given at those times of day, never spread evenly from the moment the order was signed.
clinicalRules.rule.CLOCK_TIME_FREQUENCIES.approver=Clinical lead and head nurse
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.title=Ultrasound reports signed before findings were required
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.description=A report signed and reviewed before findings became required can still be marked as told to the patient; every other report needs its findings first.
clinicalRules.rule.LEGACY_ULTRASOUND_REPORTS.approver=Radiologist or medical director
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.title=Same-day price correction
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.description=A price entered today and in force since today may be corrected the same day, unless an invoice line has already used it.
clinicalRules.rule.SAME_DAY_PRICE_CORRECTION.approver=Clinic director and finance lead
clinicalRules.read.staffOnly=The clinical rules of a hospital are read by its own staff, in a role held at that hospital.
clinicalRules.impersonation.signoff=A support session cannot record or revoke the sign-off of a clinical rule in this user’s name.
clinicalRules.rule.PREGNANCY_REVEALING_IMAGING.title=Imaging that may reveal a pregnancy (family access)
clinicalRules.rule.PREGNANCY_REVEALING_IMAGING.description=A family member never sees an imaging study that may reveal a pregnancy: a catalogue exam the hospital administrator or a radiologist flagged; an obstetric, pelvic or gynaecological study, matched on its name, body region and clinical question, or on the released report and the image captions the family member would read; and, until its catalogue exam is explicitly cleared (a clearance counts only for orders still named as the exam is), any ultrasound, any abdominal or pelvic study and any study that does not say which part of the body it is of, for a patient not recorded as male, aged 10 to 55 or of unknown or implausible age (except for the verified parent or guardian of a child under the confidentiality age). The invoice that bills such a study is withheld too; mammography is shown; the patient sees every study.
clinicalRules.rule.PREGNANCY_REVEALING_IMAGING.approver=Radiologist or medical lead, with the privacy lead
clinicalRules.rule.PREGNANCY_REVEALING_IMAGING.source=Platform decision 2026-11-21, revised 2026-11-22, after the sensitive-category rules (pregnancy is a sensitive category); age band widened from the WHO definition of women of reproductive age (15-49 years) and the WHO adolescent birth rate, which counts girls aged 10-14
assignment.patientInvitation.notFound=No pending portal invitation for this patient at your hospital.
assignment.codeActivation.tooManyAttempts=Too many incorrect codes. If this code was yours it no longer works: ask the person who registered you for a new one, or try again in {0} minutes.
assignment.patientInvitation.resendTooSoon=The activation was sent less than {0} minutes ago. Wait before sending it again, or show the code.
clinicalRules.rule.TRANSFUSION_POSITIVE_ANTIBODY_SCREEN.title=Positive antibody screen (RAI): allo-immunised patients and red cells
clinicalRules.rule.TRANSFUSION_POSITIVE_ANTIBODY_SCREEN.description=A positive antibody screen makes the patient allo-immunised for good: only the biologist records the antibody, and a later negative screen never clears the flag. Routine and planned red cells (urgent requests included) are held until the antibody is identified, or the biologist recorded the referral to CNTS/CRTS with the reason for serving that request, and until a compatible indirect antiglobulin crossmatch on a sample of 72 hours or less is recorded on a unit attested antigen-negative and RH-KEL1 matched; nobody overrides this, a super-admin included. In a life-threatening emergency (UVI or UV, never a relative urgency) the prescriber declares the level, the reason and that the sample is drawn first; group O is then released under the emergency rule, the biologist gets the task of the crossmatch afterwards, the haemolysis warning is shown and the bedside check stays mandatory. Every positive screen asks the biologist again: an identification made before a later positive screen does not cover it (it may be a further antibody), and routine red cells are held until the biologist has recorded the identification, or a referral, since that screen. An emergency request that leaves on a crossmatch which is not « compatibilisé » owes the crossmatch afterwards in the same way. The flag follows the patient to every hospital of the platform, whatever the patient chose about record sharing: an antibody can become undetectable, so a later negative screen, here or at another hospital, clears nothing. Another hospital sees only that a positive screen or an identified antibody is on record, the antibody, the date and the name of the hospital that holds it, and only on the transfusion screens (laboratory, request, crossmatch, issue, bedside); each such read is logged and appears in the patient’s own access log. Provisional: this sharing needs clinical and legal sign-off (the legal basis under Burkina Faso’s personal data law, loi 001-2021/AN, is to be confirmed).
clinicalRules.rule.TRANSFUSION_POSITIVE_ANTIBODY_SCREEN.source=HAS 2014 (Transfusion de globules rouges homologues, argumentaire: « compatibilisé » obligatory with a positive RAI or a history of one; RAI valid 72 h, a positive RAI never extended); ARS Centre-Val de Loire 2022 (UVI/UV: « ne pas retarder la transfusion même si RAI positives », crossmatch afterwards); BSH pre-transfusion compatibility guidelines (antiglobulin crossmatch, permanent exclusion from electronic issue); Australian Red Cross Lifeblood; Canadian Blood Services; North Bristol NHS Trust (urgent release with antibodies present); SHOT (IT errors) — as cited in the research report « Transfusion and critical result cover » (2026-11-22), section 1. No Burkina Faso text was found: French rules applied by inference. Sharing between hospitals: SNBTS NATP CLIN 004 (antigen-negative units when an antibody identified before is no longer detectable); arrêté du 15 mai 2018 (earlier antibody results on the report); Tormey & Hendrickson, Blood 2019 (evanescence: about half undetectable at 6 months); Dutch explanatory memorandum Kamerstuk 37 055 nr. 3 (TRIX, the national register, registration without prior consent) — as cited in the research note « antibody history sharing » (2026-11-22). No Burkina Faso or ECOWAS rule on sharing antibody data was found.
clinicalRules.rule.TRANSFUSION_POSITIVE_ANTIBODY_SCREEN.approver=Biologist or transfusion physician (with the CNTS/CRTS referral arrangement); a data-protection adviser for the sharing between hospitals
clinicalRules.rule.CRITICAL_RESULT_ESCALATION.title=Critical laboratory results: escalation until a clinician acknowledges
clinicalRules.rule.CRITICAL_RESULT_ESCALATION.description=A released critical result is told to the prescriber and the nurse in charge at once; a prescriber marked absent is skipped and the cover told at once. Unacknowledged after 15 minutes: the covering doctor (on-call roster, else the doctors on duty, else every doctor of the hospital), the prescriber staying copied. After 30 minutes: the médecin-chef and the responsible biologist. After 60 minutes: « unresolved critical result », a final alert to the whole chain and an incident record; reminders then continue, slowing down to once a day, with no round cap. Only a clinician’s acknowledgement (the value read back; name, role, time and channel recorded) ends it. Hospital administrators receive no value: only a flag that an incident is open. For an outpatient, the doctor who acknowledges decides whether to contact the patient; a result is never sent to a patient by SMS automatically. The minutes are set per hospital. The SMS of a step are sent once the step is recorded, never before. A result already waiting when this rule was switched on is chased in the application only: no SMS is sent about it. An incident also closes, with no clinician named, when the result is amended or no longer grades as critical; a result amended to another critical value starts again from the first step.
clinicalRules.rule.CRITICAL_RESULT_ESCALATION.source=ISO 15189:2022 §7.4.1.3 (an escalation procedure when a responsible person cannot be contacted, as paraphrased in the European Accreditation training); RCPath G158 (2026: category A results within 2 hours, never simply e-mailed, name and job title of the person receiving the result); The Joint Commission NPSG.02.03.01 (2024); WHO LQSI (« keeps trying to contact the clinician until contact has been made »); SFBC 2016 (urgent results, 60 minutes); Guarner et al., AJCP 2025, Asante and ChristianaCare policies (hand-over in 15 to 45 minutes); CDC LMBP review; Davids et al., Afr J Lab Med 2024 (Tygerberg) — as cited in the research report « Transfusion and critical result cover » (2026-11-22), section 2. No standard fixes the minutes: 15, 30 and 60 are the report’s recommendation.
clinicalRules.rule.CRITICAL_RESULT_ESCALATION.approver=Médecin-chef and responsible biologist
clinicalRules.rule.DISPENSED_PRODUCT_SUBSTITUTION.title=Dispensing: the product dispensed is the prescribed one, or a substitute of the same ingredient and strength
clinicalRules.rule.DISPENSED_PRODUCT_SUBSTITUTION.description=Every fill takes its product from the lot chosen (never from the text the screen sends) and compares it with the order. The order’s own catalogue item, or another item with the same active ingredient, strength and form, is dispensed as prescribed and recorded under its own name. For an order typed as free text: the molecule it names at the strength it states (any strength when it states none). The same active ingredient at the same strength in another form (tablets for capsules) leaves only as a recorded substitution with its reason: one unit for one prescribed unit. Another strength, or a strength the catalogue does not record, is refused even as a substitution, because fills are counted in prescribed units (10 tablets of 200 mg would close a 10 × 400 mg order on half the dose): the prescriber changes the order. Another active ingredient is always refused. A substitute is read again against the patient’s current allergies and passes only when the prescriber already continued the order despite that very allergy. The record, the price, the queue, the hand-over card, the payment line and the prescriber’s notice name the product dispensed.
clinicalRules.rule.DISPENSED_PRODUCT_SUBSTITUTION.source=Platform decision after the r77 test round (D3940): the catalogue holds no equivalence links, so a substitute is limited to the same active ingredient (ATC code, else the generic name) at the same strength. Generic substitution practice to be confirmed by the hospital’s pharmacist.
clinicalRules.rule.DISPENSED_PRODUCT_SUBSTITUTION.approver=Pharmacist in charge
clinicalRules.rule.NEWS2_ESCALATION.title=Adult NEWS2 in the high band: an urgent alert to acknowledge
clinicalRules.rule.NEWS2_ESCALATION.description=A vital set whose adult NEWS2 is in the high band (7 or more, the RCP band this platform already paged for) is filed as an urgent alert to acknowledge, through the same path as the maternal early warning: a CRITICAL in-basket item for the stay’s responsible doctor, the visit’s clinician and the nurse in charge (the nurses on duty, else every nurse), and the covering doctor (on call, else on duty, else every doctor) whenever no doctor other than the recorder is among them. Unacknowledged, it is re-sent every 15 minutes, up to 3 reminders, to the responsible doctor, the covering doctor and every doctor and nurse of the hospital. Only an acknowledgement by somebody other than the recorder ends it; a later complete vital set scored below the high band also closes it. While one is still reminding, a new high reading of the same patient files no second alert. No threshold is new.
clinicalRules.rule.NEWS2_ESCALATION.source=Royal College of Physicians, National Early Warning Score (NEWS) 2, 2017: a score of 7 or more calls for an emergency response by a clinical team with critical-care competencies. The recipients and the 15-minute reminders are a platform decision after the r77 test round (D3862), mirroring the maternal early-warning escalation.
clinicalRules.rule.NEWS2_ESCALATION.approver=Médecin-chef and nurse in charge

# QA D4020: one answer for an unknown, out-of-reach or patient-only holder
assignment.holder.unavailable=No account you can assign matches this identifier. Register a new staff member with the staff registration form.
assignment.patientRow.staysPatient=A patient''s assignment cannot be changed into a staff role. Register the staff member with the staff registration form.
