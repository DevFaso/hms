# V356: the provisional rule sets of ClinicalRuleRegistry (title, description, approver role).
clinicalRules.rule.BLOOD_EMERGENCY_RELEASE.title=Blood compatibility and emergency release
clinicalRules.rule.BLOOD_EMERGENCY_RELEASE.description=A separate emergency path records the responsible clinician, the urgency, the reason and the pending tests; a release despite an incompatible crossmatch is authorised by a physician or the laboratory director.
clinicalRules.rule.BLOOD_EMERGENCY_RELEASE.approver=Transfusion lead
clinicalRules.rule.NEWBORN_VITALS.title=Newborn vital signs
clinicalRules.rule.NEWBORN_VITALS.description=Abnormal newborn values are saved, flagged and escalated, never refused; the WHO postnatal danger signs (temperature above 37.5 °C, breathing above 60/min, poor feeding, convulsions, severe chest indrawing, no spontaneous movement) each raise an urgent finding.
clinicalRules.rule.NEWBORN_VITALS.approver=Neonatal or paediatric lead and pharmacist
clinicalRules.rule.PARACETAMOL_LIMITS.title=Paracetamol limits
clinicalRules.rule.PARACETAMOL_LIMITS.description=Adult: 1 g per dose, 4 g per 24 h from every product and route, 4 h apart; child from 1 month: 15 mg/kg per dose, 60 mg/kg/day (10 and 40 under 1 month); an excess is signed only with the prescriber’s explicit exception. Where the hospital’s catalogue records no paediatric limit for paracetamol alone, the child limits apply by default to the oral route, with the latest weight on the chart; a dose under them is still held for the dose review. A weight older than 30 days must be confirmed (a new weighing, the dose review, or the prescriber’s explicit exception with a reason).
clinicalRules.rule.PARACETAMOL_LIMITS.approver=Neonatal or paediatric lead and pharmacist
clinicalRules.rule.PAEDIATRIC_DOSE_LIMITS.title=Paediatric dose limits and review
clinicalRules.rule.PAEDIATRIC_DOSE_LIMITS.description=The hospital catalogue’s paediatric limits apply by route, age band and weight; under 3 months the mg/kg verdict is suspended for a review while the absolute daily ceiling is still checked; a missing route means « review required ».
clinicalRules.rule.PAEDIATRIC_DOSE_LIMITS.approver=Neonatal or paediatric lead and pharmacist
clinicalRules.rule.AL_WHO_WEIGHT_BANDS.title=Artemether-lumefantrine, child: WHO weight bands
clinicalRules.rule.AL_WHO_WEIGHT_BANDS.description=5 to under 15 kg 1 tablet, 15 to under 25 kg 2, 25 to under 35 kg 3, 35 kg and over 4 tablets of 20/120 mg, twice daily for 3 days, only when the catalogue has no paediatric limit; any other strength goes to review.
clinicalRules.rule.AL_WHO_WEIGHT_BANDS.approver=Paediatrician or paediatric lead and responsible pharmacist
clinicalRules.rule.PERINATAL_CLASSIFICATION.title=Perinatal death classification
clinicalRules.rule.PERINATAL_CLASSIFICATION.description=Perinatal: from 22 completed weeks of gestation to days 0 to 6 after birth; neonatal: days 0 to 27; a missing gestational age gives « insufficient information »; the death itself is always recorded.
clinicalRules.rule.PERINATAL_CLASSIFICATION.approver=Obstetric or neonatal lead and the coding authority
clinicalRules.rule.STILLBIRTH_COUNTING.title=Stillbirth counting
clinicalRules.rule.STILLBIRTH_COUNTING.description=A fetal death is counted against the WHO indicator (28 completed weeks), the perinatal figure and the ICD level (22 weeks); a missing gestational age gives an incomplete classification.
clinicalRules.rule.STILLBIRTH_COUNTING.approver=Obstetric lead and the coding authority
clinicalRules.rule.STILLBIRTH_CORRECTION.title=Stillbirth corrected to live birth
clinicalRules.rule.STILLBIRTH_CORRECTION.description=The correction is allowed with a mandatory reason despite a death certificate; the conflict opens an urgent reconciliation task and is counted once, with no automatic reactivation of the patient.
clinicalRules.rule.STILLBIRTH_CORRECTION.approver=Obstetric lead and the coding authority
clinicalRules.rule.STILLBORN_NEONATAL_ALERTS.title=Neonatal alerts of a stillborn baby
clinicalRules.rule.STILLBORN_NEONATAL_ALERTS.description=Apgar and prematurity alerts are not raised for a confirmed stillborn baby; a conflict is flagged when the outcome is uncertain.
clinicalRules.rule.STILLBORN_NEONATAL_ALERTS.approver=Obstetric or neonatal lead
clinicalRules.rule.DEATH_RECORD_DISPUTE.title=Disputed death record
clinicalRules.rule.DEATH_RECORD_DISPUTE.description=An authorised physician of the treating hospital documents that the patient is alive; the record becomes « death disputed », the original declaration is kept, the death blocks are lifted within the authorised care scope and an urgent administrative review opens.
clinicalRules.rule.DEATH_RECORD_DISPUTE.approver=Clinical lead
clinicalRules.rule.ORDER_REVIEW_HOLD.title=Orders on hold during a death dispute
clinicalRules.rule.ORDER_REVIEW_HOLD.description=Doses not started, undispensed medicines and pending blood requests stay on hold until an authorised prescriber reconfirms, replaces or stops them; running infusions need an immediate clinical review.
clinicalRules.rule.ORDER_REVIEW_HOLD.approver=Clinical lead
clinicalRules.rule.MIDWIFE_LABOUR_ADMISSION.title=Midwife admits a woman in labour
clinicalRules.rule.MIDWIFE_LABOUR_ADMISSION.description=A midwife at the hospital admits a woman in labour, and no other admission type; a physician admits any type.
clinicalRules.rule.MIDWIFE_LABOUR_ADMISSION.approver=Obstetric lead
clinicalRules.rule.ALLERGY_OVERRIDE_REASON.title=Reason required to sign despite an allergy alert
clinicalRules.rule.ALLERGY_OVERRIDE_REASON.description=A prescription that conflicts with a recorded allergy is signed only with the prescriber’s documented reason, which is audited.
clinicalRules.rule.ALLERGY_OVERRIDE_REASON.approver=Clinical lead and pharmacist
clinicalRules.rule.ALLERGY_CONFLICT_REVIEW.title=Allergy conflict at administration and dispensing
clinicalRules.rule.ALLERGY_CONFLICT_REVIEW.description=An allergy recorded after the signature stops administration and dispensing until an authorised prescriber reviews it; there is no emergency path without an approved protocol.
clinicalRules.rule.ALLERGY_CONFLICT_REVIEW.approver=Clinical lead and pharmacist
clinicalRules.rule.LABOUR_TRANSFER.title=Labour transfer between hospitals
clinicalRules.rule.LABOUR_TRANSFER.description=An active labour is handed to another hospital with a handover, or continued there without one; each hospital keeps its own linked episode and reads the other’s partograph read-only.
clinicalRules.rule.LABOUR_TRANSFER.approver=Obstetric lead
clinicalRules.rule.UNSIGNED_NOTE_WORKFLOW.title=Unsigned clinical note at visit close
clinicalRules.rule.UNSIGNED_NOTE_WORKFLOW.description=The visit may close; the note goes back to its author, a reminder follows after 24 h, the administrator’s list after 72 h, and the summary reads « not finalised ».
clinicalRules.rule.UNSIGNED_NOTE_WORKFLOW.approver=Clinical lead
clinicalRules.rule.SEVERE_HYPERTENSION_OBSTETRIC.title=Severe hypertension in pregnancy and after birth
clinicalRules.rule.SEVERE_HYPERTENSION_OBSTETRIC.description=Systolic 160 mmHg or more, or diastolic 110 or more, during pregnancy or within 42 days of a birth raises an URGENT « urgent obstetric review » alert; never blocking.
clinicalRules.rule.SEVERE_HYPERTENSION_OBSTETRIC.approver=Obstetric lead
clinicalRules.rule.SEVERE_HYPERTENSION_ADULT.title=Severe hypertension in adults
clinicalRules.rule.SEVERE_HYPERTENSION_ADULT.description=Systolic 180 mmHg or more, or diastolic 120 or more (18 and over, or a mother after day 42), raises a WARNING to recheck at rest; URGENT only with a ticked sign of organ damage.
clinicalRules.rule.SEVERE_HYPERTENSION_ADULT.approver=Clinical lead / internal medicine
clinicalRules.rule.MINOR_LABOUR_SAFEGUARDING.title=Admission in labour of a minor
clinicalRules.rule.MINOR_LABOUR_SAFEGUARDING.description=Admission is never blocked; under 13 at admission, an URGENT child-protection vigilance review and a senior obstetric review open, visible only to the care team and the hospital’s administrators.
clinicalRules.rule.MINOR_LABOUR_SAFEGUARDING.approver=Obstetric lead and child-protection lead
clinicalRules.rule.IMAGING_URGENT_PREAUTHORISATION.title=Urgent imaging never blocked by pre-authorisation
clinicalRules.rule.IMAGING_URGENT_PREAUTHORISATION.description=An URGENT or STAT exam starts without its pre-authorisation number, flagged « pre-authorisation pending » with a billing task; a routine exam is still refused without it.
clinicalRules.rule.IMAGING_URGENT_PREAUTHORISATION.approver=Radiology lead; CNAMU confirmation
clinicalRules.rule.IMAGING_DUPLICATE_OVERRIDE.title=Reason for « Order anyway » in imaging
clinicalRules.rule.IMAGING_DUPLICATE_OVERRIDE.description=Ordering despite the duplicate warning needs a reason from a fixed list (other: a note is required), kept on the order and in the audit trail.
clinicalRules.rule.IMAGING_DUPLICATE_OVERRIDE.approver=Radiology lead
clinicalRules.rule.SENSITIVE_CATEGORIES.title=Sensitive categories hidden from family access
clinicalRules.rule.SENSITIVE_CATEGORIES.description=HIV, STI, hepatitis B/C, pregnancy, contraception/abortion, violence, mental health, addiction, genetic tests and adult sickle-cell disease are hidden from family proxies; tuberculosis is restricted.
clinicalRules.rule.SENSITIVE_CATEGORIES.approver=Burkinabè jurist and a clinician
clinicalRules.rule.MINOR_HIV_RESULT_RELEASE.title=A minor’s HIV result released to a parent
clinicalRules.rule.MINOR_HIV_RESULT_RELEASE.description=Hidden until a doctor or midwife caring for the patient releases it to a verified parent or guardian, with a reason, audited; only an HIV result is releasable, a violence-related one never.
clinicalRules.rule.MINOR_HIV_RESULT_RELEASE.approver=Burkinabè jurist
clinicalRules.rule.ADOLESCENT_CONFIDENTIALITY_AGE.title=Adolescent confidentiality age
clinicalRules.rule.ADOLESCENT_CONFIDENTIALITY_AGE.description=From 12 (adjustable per hospital, 0 to 18), a minor’s sensitive records are hidden from the parents unless a clinician releases them.
clinicalRules.rule.ADOLESCENT_CONFIDENTIALITY_AGE.approver=Burkinabè jurist
clinicalRules.rule.RECOMMENDED_SENSITIVE_LAB_TESTS.title=Recommended list of sensitive lab tests
clinicalRules.rule.RECOMMENDED_SENSITIVE_LAB_TESTS.description=The curated mapping of catalogue tests to sensitive categories, which the laboratory director may apply to the catalogue.
clinicalRules.rule.RECOMMENDED_SENSITIVE_LAB_TESTS.approver=Laboratory director or medical director
clinicalRules.rule.MIDWIFE_NEWBORN_CARE.title=Midwife and newborn
clinicalRules.rule.MIDWIFE_NEWBORN_CARE.description=A midwife admits the newborn of a delivery she attended, up to 28 days of life, and is its responsible clinician; she assigns maternity beds and cots; a neonatal cot she assigns creates an urgent task for the physicians.
clinicalRules.rule.MIDWIFE_NEWBORN_CARE.approver=Named obstetrician or midwife, with the maternity organisation chart
clinicalRules.rule.IMAGING_TECHNICIAN_SCOPE.title=Imaging technician
clinicalRules.rule.IMAGING_TECHNICIAN_SCOPE.description=The technician checks the patient in, starts, completes or interrupts the exam with a reason, and records contrast, dose and key images; never orders, reports or signs.
clinicalRules.rule.IMAGING_TECHNICIAN_SCOPE.approver=Radiologist or medical director of the hospital
clinicalRules.rule.NON_PHYSICIAN_ULTRASOUND.title=Ultrasound by a non-physician
clinicalRules.rule.NON_PHYSICIAN_ULTRASOUND.description=By default only physicians perform an ultrasound; a hospital may let its imaging technician perform it; the report stays the physician’s.
clinicalRules.rule.NON_PHYSICIAN_ULTRASOUND.approver=Radiologist or medical director; ministry
clinicalRules.rule.PRESCRIPTION_RENEWAL.title=Prescription renewal
clinicalRules.rule.PRESCRIPTION_RENEWAL.description=Only an authorised prescriber approves a renewal: a physician for every list, a nurse or midwife for non-controlled medicines, never a pharmacist; controlled drugs are never renewed. A renewal request is announced to its prescriber alone (or, when the prescriber is no longer active or may no longer renew at that hospital, to the head of their department, who answers it in their place), and the announcement never names the medicine.
clinicalRules.rule.PRESCRIPTION_RENEWAL.approver=Ordre national des pharmaciens or the medicines directorate; jurist
clinicalRules.rule.DEFERRED_BILLING.title=Dispensing « to be billed »
clinicalRules.rule.DEFERRED_BILLING.description=A fill leaves unpaid only on an open stay’s account, a third-party cover verified by billing, a credit granted by finance, or a logged pharmacist urgency override reviewed afterwards; never approved by the person who asked or hands over.
clinicalRules.rule.DEFERRED_BILLING.approver=Clinic director and finance lead
clinicalRules.rule.CONSULTATION_FEE.title=One consultation fee per visit
clinicalRules.rule.CONSULTATION_FEE.description=A consultation is billed once per visit where it took place; none automatically on a planned, day-case, newborn, labour or transfer admission (a per-hospital setting, off by default).
clinicalRules.rule.CONSULTATION_FEE.approver=Clinic director and finance lead
clinicalRules.rule.EMERGENCY_EPISODE_CONSULTATION.title=One consultation per emergency episode
clinicalRules.rule.EMERGENCY_EPISODE_CONSULTATION.description=An emergency, urgent or observation admission after an emergency visit already billed the same day gets no second consultation line; a direct admission keeps its own.
clinicalRules.rule.EMERGENCY_EPISODE_CONSULTATION.approver=Clinic director and finance lead
clinicalRules.rule.MATERNAL_EARLY_WARNING.title=Maternal early warning score (MEWS)
clinicalRules.rule.MATERNAL_EARLY_WARNING.description=The national MEWS (six vital signs, 0 to 12, four levels, additional concerns) replaces NEWS2 during pregnancy and for 42 days after a birth.
clinicalRules.rule.MATERNAL_EARLY_WARNING.approver=Named obstetrician or midwife
clinicalRules.rule.MATERNAL_EWS_ESCALATION.title=Maternal early warning: escalation
clinicalRules.rule.MATERNAL_EWS_ESCALATION.description=At the medium and high levels, the senior physician is the head of the stay’s department plus the on-call physicians; every physician only when there is no on-call rota. A page at the medium level, the high level or for a red alert is also filed as an urgent alert to acknowledge (a critical in-basket item for the doctors and midwives on call, with reminders until somebody other than the recorder acknowledges it); the low-medium page stays a notice.
clinicalRules.rule.MATERNAL_EWS_ESCALATION.approver=Named obstetrician or midwife, with the maternity organisation chart
clinicalRules.rule.CRADLE_SHOCK_INDEX.title=CRADLE add-on: shock index
clinicalRules.rule.CRADLE_SHOCK_INDEX.description=Shock index 0.9 or more is yellow, 1.7 or more red; blood pressure 160/110 or more is red; a red alert is answered as the high level.
clinicalRules.rule.CRADLE_SHOCK_INDEX.approver=Named obstetrician or midwife
clinicalRules.rule.LABOUR_ALERT_VALUES.title=Labour alert values
clinicalRules.rule.LABOUR_ALERT_VALUES.description=During labour, the pulse, blood pressure and temperature alert values of the WHO Labour Care Guide.
clinicalRules.rule.LABOUR_ALERT_VALUES.approver=Named obstetrician or midwife
clinicalRules.rule.MEWS_PAGE_COOL_DOWN.title=Maternal early warning: page cool-down
clinicalRules.rule.MEWS_PAGE_COOL_DOWN.description=Within 30 minutes of a page, the same or a lower level is not paged again for that woman; a higher level always is, and a RED alert is never withheld.
clinicalRules.rule.MEWS_PAGE_COOL_DOWN.approver=Named obstetrician or midwife, with the maternity organisation chart
clinicalRules.rule.TAKE_HOME_ORDER_WINDOW.title=Take-home order written after discharge
clinicalRules.rule.TAKE_HOME_ORDER_WINDOW.description=A take-home order written within 24 h of the discharge, before any new admission, joins that stay’s summary; a stopped or cancelled one leaves it while the summary is not finalised.
clinicalRules.rule.TAKE_HOME_ORDER_WINDOW.approver=Head of department and quality / IT lead
clinicalRules.rule.LAB_DUPLICATE_WINDOW.title=Lab duplicate-order warning window
clinicalRules.rule.LAB_DUPLICATE_WINDOW.description=An active order of the same test placed in the last 24 h makes a new one a possible duplicate: warned, never blocked.
clinicalRules.rule.LAB_DUPLICATE_WINDOW.approver=Laboratory director
