# QA D887: the seeded drug-interaction texts (V63, V120) in every language. The English line IS the seeded text: a row an admin has since edited no longer matches it and is shown as typed.
ddi.seed.11289.1191.description=Warfarin + aspirin: additive bleeding risk.
ddi.seed.11289.1191.recommendation=Avoid unless the indication is documented (e.g. cardiac stent); monitor INR weekly and reinforce bleeding-precaution counselling.
ddi.seed.11289.5640.description=Warfarin + NSAID: elevated GI bleed and INR variability.
ddi.seed.11289.5640.recommendation=Prefer paracetamol; if NSAID required, limit to short course with PPI cover.
ddi.seed.2551.36567.description=Simvastatin + clarithromycin: CYP3A4 inhibition raises rhabdomyolysis risk.
ddi.seed.2551.36567.recommendation=Switch macrolide (azithromycin) or hold statin during the antibiotic course.
ddi.seed.10689.4493.description=Fluoxetine + tramadol: serotonin-syndrome risk and reduced seizure threshold.
ddi.seed.10689.4493.recommendation=Choose non-SSRI analgesic ladder; if both needed, monitor mental status and avoid maximum doses.
ddi.seed.10180.6851.description=Methotrexate + TMP/SMX: profound bone-marrow suppression.
ddi.seed.10180.6851.recommendation=Use an alternative antibiotic (amoxicillin / cefuroxime) for the methotrexate-treated patient.
ddi.seed.29046.8588.description=Lisinopril + potassium supplement: hyperkalaemia risk.
ddi.seed.29046.8588.recommendation=Verify serum K+ before initiating; avoid combination if K+ > 4.5 mmol/L.
ddi.seed.3407.703.description=Digoxin + amiodarone: amiodarone roughly doubles digoxin levels.
ddi.seed.3407.703.recommendation=Halve the digoxin dose at initiation and check level at day 7.
ddi.seed.36437.8123.description=MAOI + SSRI: hypertensive crisis and serotonin syndrome.
ddi.seed.36437.8123.recommendation=Allow a 14-day washout when switching between these classes.
ddi.seed.5933.6809.description=Metformin + iodinated contrast: lactic-acidosis risk in renal impairment.
ddi.seed.5933.6809.recommendation=Hold metformin from the day of contrast and resume after 48 h with renal-function check.
ddi.seed.29046.9997.description=Spironolactone + ACE inhibitor: hyperkalaemia risk.
ddi.seed.29046.9997.recommendation=Monitor K+ at week 1 and after each dose adjustment.
ddi.seed.10355.309394.description=Theophylline + ciprofloxacin: ciprofloxacin doubles theophylline levels (toxicity, seizure).
ddi.seed.10355.309394.recommendation=Use levofloxacin or moxifloxacin if a fluoroquinolone is needed.
ddi.seed.6851.8331.description=Penicillin V + methotrexate: penicillins reduce methotrexate clearance.
ddi.seed.6851.8331.recommendation=Increase MTX-toxicity surveillance (FBC, LFT) during the antibiotic course.
ddi.seed.11289.4450.description=Fluconazole inhibits CYP2C9: warfarin effect rises sharply, often within 2-3 days.
ddi.seed.11289.4450.recommendation=Recheck INR at 3 days and anticipate a warfarin dose reduction.
ddi.seed.10829.11289.description=Co-trimoxazole + warfarin: CYP2C9 inhibition plus gut-flora vitamin K loss; large INR rises reported.
ddi.seed.10829.11289.recommendation=Prefer an alternative antibiotic. If used, recheck INR within 3 days.
ddi.seed.2551.6902.description=Additive QT prolongation with CYP3A4 inhibition raising methadone levels.
ddi.seed.2551.6902.recommendation=ECG before and during; consider azithromycin, which carries less CYP3A4 effect.
ddi.seed.2551.733.description=Two QT-prolonging agents together: torsades de pointes risk.
ddi.seed.2551.733.recommendation=Avoid the combination; if unavoidable, ECG and electrolyte monitoring.
ddi.seed.11289.733.description=Amiodarone inhibits warfarin metabolism; the effect builds over weeks and persists after stopping.
ddi.seed.11289.733.recommendation=Reduce the warfarin dose by roughly a third and monitor INR weekly for 6 weeks.
ddi.seed.3355.9384.description=Rifampicin induces CYP3A4 and abolishes hormonal contraceptive efficacy.
ddi.seed.3355.9384.recommendation=Use a non-hormonal method (copper IUD) during treatment and for 28 days after.
ddi.seed.11289.9384.description=Rifampicin induction can halve warfarin effect; INR falls, thrombosis risk rises.
ddi.seed.11289.9384.recommendation=Expect a substantial dose increase and monitor INR weekly through and after treatment.
ddi.seed.10582.9384.description=Rifampicin accelerates levothyroxine clearance; hypothyroid symptoms return.
ddi.seed.10582.9384.recommendation=Recheck TSH 4-6 weeks after starting or stopping rifampicin.
ddi.seed.35617.9384.description=Rifampicin lowers nevirapine concentrations, risking virological failure and resistance.
ddi.seed.35617.9384.recommendation=Use efavirenz-based ART during rifampicin-containing TB treatment.
ddi.seed.29046.6809.description=ACE inhibitor may enhance hypoglycaemic effect and, in acute kidney injury, raises lactic-acidosis risk.
ddi.seed.29046.6809.recommendation=Hold metformin during intercurrent illness with dehydration; check renal function.
ddi.seed.10689.36437.description=SSRI + tramadol: serotonin syndrome, and tramadol lowers the seizure threshold.
ddi.seed.10689.36437.recommendation=Prefer a non-serotonergic analgesic; counsel on serotonin-syndrome symptoms if combined.
ddi.seed.1191.36437.description=SSRIs impair platelet aggregation; combined with aspirin the GI-bleeding risk roughly doubles.
ddi.seed.1191.36437.recommendation=Consider gastroprotection, particularly over 65 or with prior GI bleed.
ddi.seed.8591.9997.description=Potassium-sparing diuretic plus potassium supplement: dangerous hyperkalaemia.
ddi.seed.8591.9997.recommendation=Avoid routine supplementation; if both are essential, check K+ within a week.
ddi.seed.4109.6835.description=Loop-diuretic hypokalaemia potentiates digoxin toxicity at normal digoxin levels.
ddi.seed.4109.6835.recommendation=Monitor K+ and Mg2+; replace before attributing symptoms to digoxin dose.
ddi.seed.6835.733.description=Amiodarone roughly doubles digoxin concentration.
ddi.seed.6835.733.recommendation=Halve the digoxin dose when starting amiodarone and check levels.
ddi.seed.36567.4450.description=Azole inhibition of CYP3A4 raises statin levels and myopathy risk.
ddi.seed.36567.4450.recommendation=Suspend the statin during short antifungal courses.
ddi.seed.6058.6835.description=Quinine raises plasma digoxin concentration.
ddi.seed.6058.6835.recommendation=Reduce digoxin dose and monitor for toxicity during quinine treatment.
