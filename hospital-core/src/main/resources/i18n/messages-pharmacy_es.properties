# QA D887: the seeded drug-interaction texts (V63, V120) in every language. The English line IS the seeded text: a row an admin has since edited no longer matches it and is shown as typed.
ddi.seed.11289.1191.description=Warfarina + aspirina: riesgo hemorrágico aditivo.
ddi.seed.11289.1191.recommendation=Evitar salvo indicación documentada (p. ej., stent coronario); controlar el INR semanalmente y reforzar los consejos de prevención de hemorragias.
ddi.seed.11289.5640.description=Warfarina + AINE: mayor riesgo de hemorragia digestiva y variabilidad del INR.
ddi.seed.11289.5640.recommendation=Preferir paracetamol; si se necesita un AINE, limitarlo a un ciclo corto con protección con IBP.
ddi.seed.2551.36567.description=Simvastatina + claritromicina: la inhibición del CYP3A4 aumenta el riesgo de rabdomiólisis.
ddi.seed.2551.36567.recommendation=Cambiar de macrólido (azitromicina) o suspender la estatina durante el tratamiento antibiótico.
ddi.seed.10689.4493.description=Fluoxetina + tramadol: riesgo de síndrome serotoninérgico y descenso del umbral convulsivo.
ddi.seed.10689.4493.recommendation=Elegir un analgésico sin interacción con el ISRS; si se necesitan ambos, vigilar el estado mental y evitar las dosis máximas.
ddi.seed.10180.6851.description=Metotrexato + cotrimoxazol: mielosupresión profunda.
ddi.seed.10180.6851.recommendation=Usar otro antibiótico (amoxicilina / cefuroxima) en el paciente tratado con metotrexato.
ddi.seed.29046.8588.description=Lisinopril + suplemento de potasio: riesgo de hiperpotasemia.
ddi.seed.29046.8588.recommendation=Comprobar el potasio sérico antes de iniciar; evitar la combinación si K+ > 4,5 mmol/L.
ddi.seed.3407.703.description=Digoxina + amiodarona: la amiodarona duplica aproximadamente los niveles de digoxina.
ddi.seed.3407.703.recommendation=Reducir a la mitad la dosis de digoxina al iniciar y controlar el nivel al día 7.
ddi.seed.36437.8123.description=IMAO + ISRS: crisis hipertensiva y síndrome serotoninérgico.
ddi.seed.36437.8123.recommendation=Respetar un periodo de lavado de 14 días al cambiar entre estas clases.
ddi.seed.5933.6809.description=Metformina + contraste yodado: riesgo de acidosis láctica en la insuficiencia renal.
ddi.seed.5933.6809.recommendation=Suspender la metformina desde el día del contraste y reanudarla a las 48 h tras comprobar la función renal.
ddi.seed.29046.9997.description=Espironolactona + IECA: riesgo de hiperpotasemia.
ddi.seed.29046.9997.recommendation=Vigilar el potasio en la primera semana y tras cada ajuste de dosis.
ddi.seed.10355.309394.description=Teofilina + ciprofloxacino: el ciprofloxacino duplica los niveles de teofilina (toxicidad, convulsiones).
ddi.seed.10355.309394.recommendation=Usar levofloxacino o moxifloxacino si se necesita una fluoroquinolona.
ddi.seed.6851.8331.description=Penicilina V + metotrexato: las penicilinas reducen el aclaramiento del metotrexato.
ddi.seed.6851.8331.recommendation=Reforzar la vigilancia de la toxicidad del metotrexato (hemograma, pruebas hepáticas) durante el tratamiento antibiótico.
ddi.seed.11289.4450.description=El fluconazol inhibe el CYP2C9: el efecto de la warfarina aumenta bruscamente, a menudo en 2-3 días.
ddi.seed.11289.4450.recommendation=Volver a controlar el INR a los 3 días y prever una reducción de la dosis de warfarina.
ddi.seed.10829.11289.description=Cotrimoxazol + warfarina: inhibición del CYP2C9 y pérdida de vitamina K de la flora intestinal; se han descrito grandes aumentos del INR.
ddi.seed.10829.11289.recommendation=Preferir otro antibiótico. Si se usa, volver a controlar el INR en 3 días.
ddi.seed.2551.6902.description=Prolongación aditiva del QT, con inhibición del CYP3A4 que eleva los niveles de metadona.
ddi.seed.2551.6902.recommendation=ECG antes y durante el tratamiento; considerar la azitromicina, con menor efecto sobre el CYP3A4.
ddi.seed.2551.733.description=Dos fármacos que prolongan el QT asociados: riesgo de torsades de pointes.
ddi.seed.2551.733.recommendation=Evitar la combinación; si es inevitable, vigilar el ECG y los electrolitos.
ddi.seed.11289.733.description=La amiodarona inhibe el metabolismo de la warfarina; el efecto aumenta durante semanas y persiste tras suspenderla.
ddi.seed.11289.733.recommendation=Reducir la dosis de warfarina en aproximadamente un tercio y controlar el INR semanalmente durante 6 semanas.
ddi.seed.3355.9384.description=La rifampicina induce el CYP3A4 y anula la eficacia de la anticoncepción hormonal.
ddi.seed.3355.9384.recommendation=Usar un método no hormonal (DIU de cobre) durante el tratamiento y 28 días después.
ddi.seed.11289.9384.description=La inducción por rifampicina puede reducir a la mitad el efecto de la warfarina; el INR baja y aumenta el riesgo de trombosis.
ddi.seed.11289.9384.recommendation=Prever un aumento importante de la dosis y controlar el INR semanalmente durante y después del tratamiento.
ddi.seed.10582.9384.description=La rifampicina acelera el aclaramiento de la levotiroxina; reaparecen los síntomas de hipotiroidismo.
ddi.seed.10582.9384.recommendation=Volver a controlar la TSH 4-6 semanas después de iniciar o suspender la rifampicina.
ddi.seed.35617.9384.description=La rifampicina reduce las concentraciones de nevirapina, con riesgo de fracaso virológico y resistencia.
ddi.seed.35617.9384.recommendation=Usar un tratamiento antirretroviral con efavirenz durante el tratamiento antituberculoso con rifampicina.
ddi.seed.29046.6809.description=El IECA puede potenciar el efecto hipoglucemiante y, en la lesión renal aguda, aumenta el riesgo de acidosis láctica.
ddi.seed.29046.6809.recommendation=Suspender la metformina durante una enfermedad intercurrente con deshidratación; controlar la función renal.
ddi.seed.10689.36437.description=ISRS + tramadol: síndrome serotoninérgico, y el tramadol reduce el umbral convulsivo.
ddi.seed.10689.36437.recommendation=Preferir un analgésico no serotoninérgico; si se combinan, informar sobre los síntomas del síndrome serotoninérgico.
ddi.seed.1191.36437.description=Los ISRS alteran la agregación plaquetaria; combinados con aspirina, el riesgo de hemorragia digestiva se duplica aproximadamente.
ddi.seed.1191.36437.recommendation=Considerar la gastroprotección, sobre todo en mayores de 65 años o con hemorragia digestiva previa.
ddi.seed.8591.9997.description=Diurético ahorrador de potasio más suplemento de potasio: hiperpotasemia peligrosa.
ddi.seed.8591.9997.recommendation=Evitar la suplementación sistemática; si ambos son imprescindibles, controlar el potasio en una semana.
ddi.seed.4109.6835.description=La hipopotasemia por diurético de asa potencia la toxicidad de la digoxina con niveles normales de digoxina.
ddi.seed.4109.6835.recommendation=Vigilar K+ y Mg2+; reponerlos antes de atribuir los síntomas a la dosis de digoxina.
ddi.seed.6835.733.description=La amiodarona duplica aproximadamente la concentración de digoxina.
ddi.seed.6835.733.recommendation=Reducir a la mitad la dosis de digoxina al iniciar la amiodarona y controlar los niveles.
ddi.seed.36567.4450.description=La inhibición del CYP3A4 por el azol eleva los niveles de estatina y el riesgo de miopatía.
ddi.seed.36567.4450.recommendation=Suspender la estatina durante los tratamientos antifúngicos cortos.
ddi.seed.6058.6835.description=La quinina aumenta la concentración plasmática de digoxina.
ddi.seed.6058.6835.recommendation=Reducir la dosis de digoxina y vigilar la toxicidad durante el tratamiento con quinina.
