# Read by Spring's SpringProperties from the test classpath, so the cap below
# applies under Gradle, IntelliJ's native runner and any other launcher alike.
#
# Bound Spring's test context cache (default 32) so the test JVM's heap is a
# real ceiling. Each full @SpringBootTest / whole-model @DataJpaTest context
# stays resident at roughly 80-130 MB once built, and the cache never closes
# one before the JVM exits, so live heap grew with every distinct context in a
# fork: measured 315 MB after the first and 1.9 GB after the 21st in the fork
# CI runs second. Whichever context came next then starved -
# PatientRepositoryRegistrationScopeTest (#740, #748, #750), all five tests
# failing on "OutOfMemoryError: Java heap space" while loading the context,
# on PRs that never touched it.
#
# With 8, the least-recently-used context is closed (and its heap released)
# once a ninth is needed. That is only safe because every context has its OWN
# H2 database - see spring.datasource.url in application-test.yml; a closing
# context runs create-drop's drop against its database.
spring.test.context.cache.maxSize=8
