plugins {
    id 'org.springframework.boot'
}

dependencies {
    // --- Spring Boot starters ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Boot 4: RestTemplateBuilder / RestClient live in their own module.
    implementation 'org.springframework.boot:spring-boot-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-registry-otlp'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Liquibase
    // Boot 4 runs Liquibase only through its starter (liquibase-core alone is inert).
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    // Distributed scheduler locks: one instance runs a sweep, the others skip it.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // TOTP (MFA)
    implementation 'dev.samstevens.totp:totp:1.7.1'

    // Rate limiting
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    // swagger-annotations-jakarta is provided transitively by springdoc — do NOT add swagger-annotations separately

    // Jackson Hibernate module
    implementation 'tools.jackson.datatype:jackson-datatype-hibernate7'

    // Hypersistence Utils (Hibernate JSON types)
    implementation 'io.hypersistence:hypersistence-utils-hibernate-73:3.16.0'

    // PDF generation
    implementation 'com.itextpdf:kernel:8.0.2'
    implementation 'com.itextpdf:layout:8.0.2'
    implementation 'com.itextpdf:barcodes:8.0.2'
    implementation 'org.apache.pdfbox:pdfbox:2.0.34'

    // QR / Barcode
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.zxing:javase:3.5.4'

    // Twilio SMS
    implementation 'com.twilio.sdk:twilio:13.0.1'

    // HAPI FHIR (R4) — interoperability layer (mounted at /fhir/*)
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-base:8.12.1'
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-server:8.12.1'
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:8.12.1'

    // Apache Commons
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Annotation processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    // Boot 4's per-technology test starters, one per main starter above,
    // instead of spring-boot-starter-test-classic (the pre-4.0 all-in-one
    // bundle kept only for migration). Each pulls spring-boot-starter-test
    // (JUnit, AssertJ, Mockito, spring-test) plus that technology's test
    // auto-configuration and slices (@WebMvcTest, @DataJpaTest, ...).
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    // TestRestTemplate (@AutoConfigureTestRestTemplate) lives in its own module.
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // Testcontainers — drives LiquibaseSchemaIT against real PostgreSQL so
    // PG-specific migration bugs (PL/pgSQL DO blocks, dollar quoting,
    // splitStatements config) surface pre-merge instead of on dev deploy.
    // Version from Boot 4's BOM (testcontainers.version, 2.0.x).
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}
