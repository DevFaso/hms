# Enable Gradle toolchain auto-provisioning (works on any machine)
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# Gradle daemon settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Build-JVM heap. Without this, Gradle's daemon (including the single-use
# daemon forked under --no-daemon, as in the Dockerfile) runs on the 512 MiB
# default - and compileJava for this codebase no longer fits: the Railway
# builder died with "Gradle build daemon has been stopped: since the JVM
# garbage collector is thrashing" on 2026-09-04 (the build.gradle
# maxHeapSize=2048m applies only to the TEST JVM, which -x test never
# starts). 2 GiB fits comfortably on the Railway builders and CI runners.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
