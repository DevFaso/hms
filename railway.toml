[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# Only rebuild the backend service when files that actually affect the
# bootJar or its runtime image change. Without this, Railway redeploys
# the backend on every push to the watched branch — including pure
# frontend, Keycloak, docs, or CI-config changes. See PR description.
watchPatterns = [
    "hospital-core/**",
    "Dockerfile",
    ".dockerignore",
    "build.gradle",
    "settings.gradle",
    "gradle.properties",
    "gradle/**",
    "gradlew",
    "railway.toml",
]

[deploy]
healthcheckPath = "/api/actuator/health"
healthcheckTimeout = 180
# Always restart: with ExitOnOutOfMemoryError (Dockerfile) a heap OOM exits the
# JVM, and on_failure's 3-retry budget would otherwise leave the backend
# CRASHED after the third one until a manual redeploy.
restartPolicyType = "always"

[deploy.healthcheck]
path = "/api/actuator/health"
interval = 30
timeout = 30
