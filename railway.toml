[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# Only rebuild the backend service when files that actually affect the
# bootJar or its runtime image change. Without this, Railway redeploys
# the backend on every push to the watched branch — including pure
# frontend, Keycloak, docs, or CI-config changes. See PR description.
watchPatterns = [
    "hospital-core/**",
    "Dockerfile",
    ".dockerignore",
    "build.gradle",
    "settings.gradle",
    "gradle.properties",
    "gradle/**",
    "gradlew",
    "railway.toml",
]

[deploy]
healthcheckPath = "/api/actuator/health"
healthcheckTimeout = 180
# A heap OOM exits the JVM (JAVA_TOOL_OPTIONS in the Dockerfile), so allow
# more restarts than 3 before the service is left CRASHED; still bounded, so a
# failing boot (bad migration, missing variable) stops instead of looping.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/api/actuator/health"
interval = 30
timeout = 30
