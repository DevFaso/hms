# HTTP security headers for everything nginx serves itself (the SPA shell,
# its hashed bundles, translations, icons, redirects, /health).
#
# nginx drops every server-level add_header in a location that declares its
# own add_header, so these live here and are included in EACH location that
# does not proxy to the API (the API sets its own headers in SecurityConfig).
# scripts/nginx-security-headers.test.mjs fails if a location forgets it.
#
# The script-src hash placeholder is replaced at image build time by
# scripts/write-csp-script-hashes.mjs with the sha256 of every inline
# <script> in the built index.html (the font/boot loaders and the critical
# CSS swap), so the policy needs neither 'unsafe-inline' nor 'unsafe-eval'.
#
# The CSP ships as Report-Only first: violations are logged in the browser
# console without blocking anything. Rename the header to
# Content-Security-Policy once the deployed portal shows none.
#
# connect-src / frame-src origins: the Faro RUM collector (environment.prod.ts)
# and the per-environment Keycloak issuers (environment.dev.ts / .prod.ts,
# silent refresh runs in an iframe). The test above checks they stay in sync.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera: patient photo and eMAR barcode capture. Microphone: chat voice notes.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=(), bluetooth=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://faro-collector-prod-us-east-2.grafana.net https://hms-keycloak-dev-dev.up.railway.app https://hms-keycloak-prod-prod.up.railway.app; frame-src 'self' blob: https://hms-keycloak-dev-dev.up.railway.app https://hms-keycloak-prod-prod.up.railway.app; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
