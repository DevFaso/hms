<div class="mfa-enroll-page">
  <div class="mfa-card">
    <div class="mfa-header">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
        <path
          d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"
          fill="currentColor"
        />
      </svg>
      <h1>{{ 'MFA.CHALLENGE_TITLE' | translate }}</h1>
      @if (username) {
        <p class="subtitle">
          {{ 'MFA.CHALLENGE_SIGNED_IN_AS' | translate: { username: username } }}
        </p>
      }
    </div>

    @if (error()) {
      <div class="error-banner" role="alert">
        <span>{{ error() }}</span>
      </div>
    }

    @if (!mfaEnrolled) {
      <!-- User has MFA required but not enrolled — redirect to enrollment -->
      <div class="step-content">
        <p>{{ 'MFA.CHALLENGE_NOT_ENROLLED' | translate }}</p>
        <button class="btn-primary" (click)="backToLogin()">
          {{ 'RESET.BACK_TO_LOGIN' | translate }}
        </button>
      </div>
    } @else {
      <div class="step-content">
        <p>{{ 'MFA.CHALLENGE_CODE_HINT' | translate }}</p>
        <form (ngSubmit)="submitCode()" class="verify-form">
          <input
            type="text"
            [(ngModel)]="code"
            name="mfaCode"
            maxlength="8"
            placeholder="000000"
            class="totp-input"
            autocomplete="one-time-code"
            inputmode="numeric"
          />
          <button class="btn-primary" type="submit" [disabled]="loading()">
            {{
              loading()
                ? ('MFA.CHALLENGE_VERIFYING' | translate)
                : ('MFA.CHALLENGE_VERIFY' | translate)
            }}
          </button>
        </form>
        <button class="btn-link" (click)="backToLogin()">
          ← {{ 'RESET.BACK_TO_LOGIN' | translate }}
        </button>
      </div>
    }
  </div>
</div>
