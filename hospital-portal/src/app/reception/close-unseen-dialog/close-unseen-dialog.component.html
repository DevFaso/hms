<div
  class="dialog-overlay"
  role="button"
  tabindex="0"
  [attr.aria-label]="'RECEPTION.CLOSE_DIALOG' | translate"
  (click)="dismissed.emit()"
  (keydown.enter)="dismissed.emit()"
  (keydown.escape)="dismissed.emit()"
></div>
<div
  class="dialog-box"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'RECEPTION.CLOSE_UNSEEN_TITLE' | translate"
>
  <div class="dialog-header">
    <span class="material-symbols-outlined header-icon">event_busy</span>
    <h2>{{ 'RECEPTION.CLOSE_UNSEEN_TITLE' | translate }}</h2>
    <button
      class="btn-close"
      (click)="dismissed.emit()"
      [attr.aria-label]="'COMMON.CLOSE' | translate"
    >
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="dialog-body">
    <p>
      @if (patientName) {
        <strong>{{ patientName }}</strong> —
      }
      {{ 'RECEPTION.CLOSE_UNSEEN_EXPLAIN' | translate }}
    </p>

    <div class="field-group">
      <label for="closeUnseenOutcome">{{ 'RECEPTION.CLOSE_UNSEEN_OUTCOME' | translate }}</label>
      <select
        id="closeUnseenOutcome"
        class="form-control"
        [ngModel]="outcome()"
        (ngModelChange)="outcome.set($event)"
      >
        @for (o of outcomes; track o) {
          <option [value]="o">{{ 'RECEPTION.UNSEEN_OUTCOME.' + o | translate }}</option>
        }
      </select>
    </div>

    <div class="field-group">
      <label for="closeUnseenReason"
        >{{ 'RECEPTION.CLOSE_UNSEEN_REASON' | translate }} <span class="required">*</span></label
      >
      <textarea
        id="closeUnseenReason"
        class="form-control"
        rows="3"
        maxlength="500"
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
      ></textarea>
    </div>

    @if (error()) {
      <p class="error-text" role="alert">{{ error() }}</p>
    }
  </div>

  <div class="dialog-footer">
    <button class="btn-secondary" (click)="dismissed.emit()" [disabled]="saving()">
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button class="btn-primary" [disabled]="saving()" (click)="submit()">
      @if (saving()) {
        <span class="material-symbols-outlined spin">progress_activity</span>
      }
      {{ 'RECEPTION.CLOSE_UNSEEN_CONFIRM' | translate }}
    </button>
  </div>
</div>
