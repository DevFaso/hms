<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>e-Keneya</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      ?v= is load-bearing, not decoration. Both favicons keep a stable
      filename, so a cached copy (browser or CDN) is otherwise served until it
      expires — the old blue mark survived a deploy exactly this way. index.html
      is no-cache, so bumping this version is what actually invalidates them.
      Bump it whenever either file's artwork changes.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico?v=2" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- Google Analytics is bootstrapped at runtime by AnalyticsService when
         environment.gaTrackingId is configured. -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
