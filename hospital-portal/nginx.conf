worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen __PORT__ default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Allow file uploads up to 10MB (matches Spring Boot multipart limit)
        client_max_body_size 10M;

        # DNS resolver for dynamic proxy_pass
        resolver __NGINX_RESOLVER__ valid=30s;

        # Security headers: NOT declared here. nginx drops server-level
        # add_header in every location that has its own add_header, which left
        # index.html with none. Each location that serves the portal itself
        # includes security-headers.conf instead; the /api/ proxies pass the
        # API's own headers (SecurityConfig) through untouched, so nothing is
        # sent twice. scripts/nginx-security-headers.test.mjs enforces both.

        # Health check endpoint
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
            include /etc/nginx/security-headers.conf;
        }

        # MVP-5c: server-side 301s for SUPER_ADMIN-only legacy URLs.
        # These two paths are reachable only by ROLE_SUPER_ADMIN, so a
        # blanket 301 is safe. /audit-logs and /platform stay as-is —
        # they're shared with HOSPITAL_ADMIN / ADMIN and are rewritten
        # client-side by superAdminPathRewriteGuard for super admins
        # only.
        location = /feature-flags {
            include /etc/nginx/security-headers.conf;
            return 301 /super-admin/feature-flags;
        }
        location = /analytics {
            include /etc/nginx/security-headers.conf;
            return 301 /super-admin/analytics;
        }

        # SockJS / STOMP WebSocket proxy — must come before the /api/ block.
        # The backend registers its STOMP endpoint at /ws-chat (with SockJS fallback),
        # so all paths under /api/ws-chat/ must be proxied with WebSocket upgrade headers.
        # SockJS uses sub-paths: /ws-chat/info, /ws-chat/<srv>/<session>/websocket, etc.
        location /api/ws-chat/ {
            set $backend __API_BASE_URL__;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keep the WS connection alive; increase timeouts for long-lived connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Reverse proxy API requests to backend
        location /api/ {
            set $backend __API_BASE_URL__;
            proxy_pass $backend;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
        }

        # QA D2351 (r63, slow 3G): the translation files keep a stable name, so
        # they cannot be immutable, but `location /` below sent them with
        # no-store: every reload downloaded fr.json (about 150 kB compressed)
        # again. no-cache + the ETag nginx sends by default revalidates them
        # instead: an unchanged file costs one 304, a deploy is still seen at once.
        location ^~ /assets/i18n/ {
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # SPA routing — serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
            # Prevent browsers from caching index.html so new deployments are picked up immediately
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
            include /etc/nginx/security-headers.conf;
        }

        # Proxy uploaded files (profile images, attachments) to the backend.
        # MUST be declared before the regex block below — nginx gives regex
        # locations (~*) higher priority than plain prefix locations (/api/),
        # so a .jpeg request would otherwise be caught by the static-asset
        # cache rule and served from the nginx root (returning 404).
        # The ^~ modifier stops regex matching for this prefix.
        location ^~ /api/uploads/ {
            set $backend __API_BASE_URL__;
            proxy_pass $backend;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Root-level brand assets keep a STABLE filename across every build, so
        # they must never be immutable: a one-year cache makes a favicon change
        # invisible to returning visitors and to the CDN edge for a year. This
        # block must stay ABOVE the hashed-asset block below — nginx matches
        # regex locations in source order and takes the first hit.
        location ~* ^/favicon\.(ico|svg)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Cache hashed build output aggressively. Safe ONLY because every build
        # configuration that reaches this image sets `outputHashing: all`, so a
        # changed file always arrives under a new filename. If a config ever
        # emits bare `main.js` again, this rule pins the old bundle in browsers
        # and the CDN for a year and deploys stop being visible.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Deny access to hidden files
        location ~ /\. {
            include /etc/nginx/security-headers.conf;
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
