# Railway service config for HMS Keycloak (dev / uat / prod).
#
# This single file is referenced by all three `hms-keycloak-{env}` Railway
# services. Each service sets its own `BUILD_CONFIG` env var (`dev`, `uat`,
# or `prod`); Railway forwards env vars matching declared Dockerfile ARGs
# to the build, so `BUILD_CONFIG` becomes the build-time selector. See
# `README.md` in this folder for the per-env provisioning recipe.

[build]
builder = "dockerfile"
dockerfilePath = "keycloak/prod/Dockerfile"
# Only rebuild Keycloak on changes under keycloak/ plus the repo-root
# .dockerignore (which affects every Docker build context — if it ever
# starts excluding keycloak/realm-export.json or similar, the resulting
# image would silently differ from what's running). Without this filter,
# Railway redeploys all three hms-keycloak-{dev,uat,prod} services on
# every push to the watched branch — including pure backend or frontend
# PRs — which burns build minutes and rolls Keycloak unnecessarily
# (visible in logs as a fresh ~8s startup right after every backend
# merge).
watchPatterns = ["keycloak/**", ".dockerignore"]

[deploy]
# Keycloak 26 serves /health/ready on the management interface (port 9000),
# which Railway's edge can't reach (only the main HTTP port is exposed).
# `/realms/master/` is on the main port and always returns 200 when Keycloak
# is up — equivalent liveness signal without the management-port split or
# the deprecated --legacy-observability-interface workaround.
healthcheckPath = "/realms/master/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.healthcheck]
path = "/realms/master/"
interval = 30
timeout = 30
